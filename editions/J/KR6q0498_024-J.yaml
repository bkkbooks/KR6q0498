body:
  text: 嗣法門人智朴編桐城方拱乾甦菴閱七言律詩冬日村居即事用古韻暫隱萍蹤傍小谿愛暄捫蝨倚楹西出籠謾謂如銀鶴養氣誰能似木雞雪壓蒼松形愈健風敲野籟韻傜齊梅花為報春消息惹得寒林鵲亂啼其二凍雲橫鎖玉盈谿風抱鐘聲過壟西沙渚霜驚濃睡鴈竹籬午過亂鳴雞懸瓢自昔懷巢父食粟於今愧叔齊居僻不知年欲盡惟聞深樹老猿啼其三煙消石冷影潛谿煮茗敲冰響度西梅放詩成千朵月香殘定起一聲雞謾誇北秀談玄喻堪笑南華論物齊愛日裁雲聊補衲傍簷花鳥盡情啼其四黃葉紛紛堆滿谿尋梅誤入石橋西牧童牛背歌殘照婆子村頭罵攘雞寒逼泉聲琴欲斷雲開山色畫雞齊誰云冬日無佳景玉樹山家鳥競啼幽居為卜山居伴夕曛喜無塵事可相分開池掘出半輪月種石招來幾片雲雨滴茅堂聲細細煙籠竹徑影紛紛虛懷獨坐忘諸慮雞犬時從嶺外聞留別居士夜深月滿畫樓南共話維摩茗半酣世出世間雖有二教傳教外本無三遺衣亭畔思韓愈留帶山門憶子瞻幾度盤桓應未盡別峰相見再相談雨後散步瀑雲初散淡煙凝遙望山山似潑青乍到人驚犬吠重來飛棹惹鷗憎菜花雨剪金盈地麥浪風翻碧亂汀乘興偶探新漲水老藤引過石橋亭寓法界寺煙樹蒼茫擁翠臺溪光搖映絕塵埃門連岫色和雲度風送鐘聲帶雨催古額高懸新梵宇斷碑橫臥舊荒苔偶因攜杖閒遊此底事天花動地來述懷野寺荒煙綴碧蘿䰐鬖古貌一頭陀道窮已絕羚羊跡夢破空餘蝴蝶過茶熟風來清筆債燈殘月下遺詩魔幽人謾謂忘機好誰識忘機事更多春霧萬象朦朧看不清依稀蘿月未分明似雲似雨漫空布如榖如綿遍界橫梅塢香飛無覓處板橋人過只聞聲拭眸復上高臺望儵忽乾坤幾變更九日值雨半風半雨妒重陽坐起無聊興自狂擬去囊萸羞混俗試將探菊詣何方聲沉寒水鴻初度金糝蒼苔葉乍黃爛煮浮漚誰共賞倚樓笑指野雲忙遣懷疏竹風敲寐不成披襟偶坐到鐘聲窮情半向閒中遣好景多因句裏傾雨著梨花香欲滴煙寒芳草夢初驚子規為惜春光媚叫落江樓月幾更初秋即景涼生古殿動新秋楓葉成丹落案頭萬慮澄瑩猶湛水一身放浪寄虛舟層層蘿月分詩興片片江雲曳練流無事細聽蟬競噪疏風遠遞暗香浮秋夜同浹水大師話別水際涼生萬戶秋高樓香茗話同遊江邊落葉驚鳧夢天外飛鴻送客舟月色初分今夜興雲情尤向別峰投青谿亦有留君意兩岸芙蓉帶露浮賦得漠漠水田飛白鷺綠野沺沺斂素文遙連浦樹浪初分煙迷高翥疑逃隱雨霽空翻識舊群影影波心雲黯黯行行天際雪紛紛數聲短笛滄浪外亂逐斜風度晚曛春日送拙菴朴侍者之徐州省親數年林下扣禪扉暫別邗溝一拂衣謾把金盆為母壽唯將蒲履事親稀黃樓春暖多佳景泗水花飛滿釣磯記取臨行曾有語薰風江上望帆歸舟中限韻兩岸蒹葭雪擁江喜留秋色入蓬窗溪邊菊綻金千朵天外鴻飛影幾雙有意騷人頻得句無心野籟自成腔停橈回首雲間望落落風旛繞法幢夏日得談字折腳藤床一草龕四維無壁任風探棹沉朱水懷船子牛去兩關憶老聃嫋嫋蟬聲吟細柳翩翩雲影洗晴潭新豐有曲誰同調獨與青松作笑談詠珠簾水潺湲白浪瀉層巔化作珠璣幾許年璨璨光搖煙縷織離離影亂月鉤牽珠絲雨度千條結蛟淚風翻萬斛圓帝釋宮中尋不見誰將倒挂碧巖前閱百丈石澗和尚偃草遺稿有感昔年揮手別松門此話而今疇與論師表高懸容似舊歌雲室鎖語猶溫鴈行半落驚霜曉花萼纔敷逐雨魂遺草那堪重讀處猿啼月冷正黃昏次一唯姚居士重遊怪石塢韻殘霞碎踏滿谿流兩度徘徊未盡幽野鳥隨筇啼不住巖花傍水笑相留塵封蓮漏何人聽曉霽華林有客遊莫訝雲廚多冷淡一杯春茗解新愁秋詠谿風閣外雨花香計拙無聊且學狂憶得梅梢曾摘月笑看鏡裏又逢霜曉天虛碧於詩淡野徑秋聲入夜長瘦影自憐為客久五湖夢老水雲鄉其二芙蓉秋水夢魂香午後茶酣笑語狂短笛樓臺頻弄月隔林砧杵亂敲霜雲消怪見山形瘦漏永愁添客思長放浪一身天地外蕭蕭蘆荻冷家鄉其三秋老林泉水氣香興來難禁草鞋狂澄澄皓月平分練落落丹楓碎剪霜夢繞天涯懷莫定鴻歸塞外信何長乾坤輸我疏慵甚高枕秦峰望海鄉其四鳩聲隔雨喚風香一味生涯老愈狂叢菊滿園驚蝶夢蒹葭兩岸墮瓊霜波心月畫蛾眉細天際雲排鳥陣長楖栗幾時尋舊壑臨風一曲唱還鄉其五氛斂秋山桂魄香亂雲堆畔放歌狂錦江釣盡三更月曉徑樵歸滿擔霜樹老不知形影健風高唯覺嘯聲長扁舟物外忘拘繫萬里煙波萬里鄉其六屋角風吹橘柚香曉來鶴避茗煙狂寺鍾雲外敲殘雨村犬籬門吠落霜柳按三眠棲鷺冷花分九曲引杯長間情一片秋山月獨照空林寂莫鄉其七幽階蝸蝕蘚痕香竹老龍鍾似我狂寒瀑千尋飛白練野棠數里下紅霜窗昏無月吟詩苦肩瘦耽風帶髮長秋色滿庭今古畫歸鴉雨後亂投鄉其八殘花和露釀秋香贏得風流物外狂滿架詩書憑餧蠹多年琴劍任堆霜風光影散爐峰裊野岸潮迴鏡水長江海浮沉何足計玉壺別有一江鄉古寺春回蘿壁金燈慰寂寥婆娑老檜話前朝細看佛頂青猶濕俄訝僧眉雪未消檻外煙濃春入柳溪邊梅破玉浮橋曉來獨對東風立飛鳥爭啣香亂飄浮圖秋月淨掃銀河淡抹煙波晴塔影入溪眠層層星斗平分彩面面蟾光各樣天鈴語風吹沉樹杪桂香露冷落階前夜深不倦徘徊興萬籟蕭騷奏管絃竹院晚涼寒碧陰森抱小樓袒襟更羨北窗幽綠雲冉冉畫猶夕水氣霏霏夏似秋幾樹新蟬音入律半簾斜月影垂釣邇來活計惟高枕夢逐白雲天外遊平田煙雨一帶蒼茫望裏昏隔林不見舊芳村人家渾著輕紗掩聚樹唯餘澹墨痕杳杳農歌浮水面依依鷗夢隱雲根堪憐側笠垂綸處撩亂鳩聲喚雨魂橋畔僧歸雨霽金鶯傍客啼柳灣直隔小橋西桃花流出紅鋪岸白鷺飛來雪漫斜挂片雲穿聚落半肩明月問招提相逢已識來方遠衣帶煙霞足帶泥松林雪霽簾捲春風乍曉時誰遺素練綴高枝梅花香滴寒初散蝴蝶魂飄睡正癡瀑斷崖頭飛片玉綠開波眼漾新詩負暄背坐茆簷外藤泛銀濤影亂垂靜夜聞鍾煙涵寺冷漏初沉一榻憨眠夢不禁抱月狂猿棲老樹啣蘆征鴈過遙岑希聲陣陣窗前度餘響悠悠枕畔侵坐起乍聆剛夜半霜鐘風送出雲林龍江夕照白蘋荷渚亂秋煙孤艇斜依落照邊楓醉江頭波織錦鴻排天外影揮箋參差雲樹眉端迥遠近溪山畫裏懸沙上遙看人競渡幾株暮柳響風蟬水塢樵風夏木陰深雨欲飛滑滑碧澗曳斜暉風寒六月松琴細花落三春蘚逕肥采藥仙人乘月往負薪樵子踏歌歸偶來策杖因逃暑驚起煙霞亂撲衣遊西湖崔嵬一榭繞潺湲四顧憑欄面面山雨霽湖光分素練煙濃荷渚度飛鷴斷橋簫鼓花邊出夕照漁歌月下還萬頃玻璃浮碧漢偶疑身世隔人間秋日偶成颯颯涼風撲面生出門乍喜葛衣輕木樨香爆金鈿砌匾荳花開月滿棚雲散吳山舒老眼雨餘練水挹孤城憑高為問飛鴻信萬樹秋煙一抹平秋日泛湖菱荇參差碧浪橫滿蓬秋色不勝情紛紛濃淡霜中樹隱隱高低雲外城荷葉影枯香欲褪芙蓉霜冷夢初驚殷勤借問沙鷗路午後招提磬幾聲中秋後二日舟次即景秋老蘆花雪半蔫尋詩先乞買舟錢晴晴淡淡湖中畫斂斂飛飛水上煙皓魄初殘輝尚滿梧桐乍落影猶圓今宵不減前宵興野色波光共一天次寒松首座清明值雨韻杏煙濃淡雨絲紅愛妒清明楊柳風野墓春銷芳草合北邙雲鎖夢魂空鶯啼紫陌行人外棹出青村流水中撫景傷心多此際飛花無限逐西東春日同靜公拙菴諸子遊平山堂日暖芳林鵲搆巢買舟城外泛西郊濃分鴨綠浮江面淡著鵝黃濕柳梢隔水聞鐘知有寺尋春留客愧無餚老來莫禁閒遊興卻偝東風為解嘲和寒松首座詠斷端硯韻貞玟耿介壓群豪志久隳形羨雅操損益無心堪拭劍琢磨不磷任揮毫文驅神鬼憑伊力字走龍蛇仗爾曹勿謂吾今成過譽端溪聲價舊來高雨中遣興雲涵野寺客來稀靜對瓶花發笑機生意半隨秋意老鐘聲常逐雨聲飛傍簷寒鵲窺禪叟貼岸丹楓醉釣磯數里平橋煙鎖斷茫茫蓑笠未曾歸焦山晚眺瘞鶴巖前獨倚笻斜暉浪掩錦重重人吹鐵甕城頭笛僧打金山寺裏鐘萬里鄉關歸夢遠千家樓閣瞑煙封臨風吊古多惆悵只有沙鷗睡正濃紅葉樵逕雲酣夾雨浮望中燒眼晚棠秋無心不作尋香蝶有興偏能狎野鷗零落枝頭詩片片空餘堤畔夢悠悠堪憐幾許丹青意惱亂西風舞未休初夏遊婁東王氏園竹逕藤橋傍小津偶偕短杖訊芳神池塘倒浸山林影亭閣平分閬苑春簇簇玲瓏爭怪麗層層點綴奇新循環遍倚欄杆立鳥慣啣花不避人望海海國誰分西與東潮迴天地見鴻濛千層駭浪飛奔馬萬派驚湍怒吼風霧斂蜃樓連碧漢曉開陸市雜蛟宮謾夸浩渺無涯際收拾還歸一目中題市隱圖大隱何勞遠世塵不妨在處且陶真橫拖嫩綠池邊柳亂吐嬌紅洞口春客夢半隨殘局破歌聲乍入曉風新目前識得皆行樂爭肯桃源去問津再遊銕壁居有序銕壁居者乃吾先師瑞老人之所搆也以其層巒環抱疊嶙峋獨有北面一峰最高峭峙如屏色猶潑黛故以銕壁名之亦為豺豹虎狼出入之藪苟非有道者不堪憩焉惟吾老人禪棲三載然後拂衣而往於是緇素高其德響其風遐邇彰名迨今不朽庚寅歲余渡錢塘掃祖塔遂登頂造廬披襟遠眺令人忘返故有鑑湖分海口石壁接天關之句及今丁酉春余承乏雲門一日偕諸子復躡其巔不椽頹屋老几榻塵埋惜哉自吾老人去後鮮有能繼其踵者因爾愴然有感聊為志此崚𡾓石磴影重重撥草來尋舊虎蹤壁上有詩餘淡墨池邊無鶴冷青松落花爭向藤床臥老蔓頻將瓦鼎封誰道慈音今已寂夜深幽籟撼群峰不流泉有序寺門巽首有泉無名不知出自何時其味甘溫鮮澤其色紺碧若玻璃然久供庖廚人皆樂之羅酷暑大旱嘗溶溶焉或淫雨彌月亦湛焉一日余攜笻徘徊其間謂侍者曰夫水之為物也盈則蕩之窪則洩之是泉亦有和而不流滿而不溢之謂茲以不流為名豈不為山門一佳致也耶因忘固陋聊以拙句志之並作後來高人騷士引玉云爾何年鑿出一潺湲倒浸星河碧漢顏澹泞忻同君子志澄渟靜比道人閒唯留好月常相伴肯逐落花去不還香積頻供同沆瀣至今無復到人間其二一泬幽深鑑者稀參差萍藻盪晴暉香浮綠綻殘花墮影亂漚空斷鴈飛燦燦霞光凝浩氣澄澄夜魄活天機唯期野衲清詩興懶與人間洗是非宿五洩寺有感日暮秋林杖倦行為尋古寺入山城池中不睹危樓影沈畔唯餘落瀑聲隱隱孤燈光欲墮依依宿鳥夢頻驚堪憐祖意無人問隔嶺霜鐘扣月明秋草吟瘦影離披老砌傍夜深簾外撲螢光逢秋何事形偏瘁泣露緣誰色漸黃細雨凄凄蛩韻切西風獵獵馬蹄狂傷心只為時多變一鴈聲中萬里霜其二水淺莎橫野渡傍時逢搖落慨流光曉風碎剪溪毛冷夜雨頻驚石面黃旅客天涯羈夢遠王孫陌上罷歌狂無情也解同人老慚愧衰容滿鏡霜遊東山白雲影綻碧重重不倦崎嶇問曉鐘洞古薔薇香氣杳局殘碁墅蘚苔封三江月冷梁朝寺萬壑龍吟晉代松攜茗東西頻眺望山山色染紫芙蓉夜坐遠明上人房小閣高懸落澗傍夜深寒翠滴幽篁澹雲水墨詩中畫素壁梅花夢裏香殿古鐘沉聲遠林空月瘦影微茫寥寥此際憑誰語萬里江天一鴈行己亥元旦豎方丈選得年新時也新重開白石闢荒榛雕梁橫架風煙麗彩棟高懸海國春三泖月澄天鏡朗九峰雪霽曉雲屯謾云十笏難容膝百億金毛現一塵遊古吳興何山廢寺有感為訪招提步落梅亂雲深處幾徘徊殘碑蝸蝕埋荒塚斷礎塵封臥綠苔風冷忍聞臞鶴唳月沉不禁夜猿哀堪憐祖道寥寥甚底事無人問劫灰登霞霧山禮石屋祖師塔逡巡幾度挽枯藤直到巉巖最上層野鳥隨笻常僼客山花笑我作遊僧搖搖白練飛泉下簇簇青巒宿霧烝窣堵深藏風韻古千年蘿月一龕燈同元潔和尚遊怪石塢分韻得山字踏斷羊腸路幾彎偶來乘興共躋攀流泉暗寫琴中調怪石驚看畫裏山日暖蜂衙香襲襲春晴花市鳥關關不須更問桃源勝笑指松雲學我閒十僧詠山僧一自誅茆居亂峰钁頭活計意偏濃頻刪梅圃堪留月細補荷衣可禦冬路僻曾無馬車跡苔深唯見虎狼蹤客來休問年多少石老松枯欲化龍禪僧始從言外契三玄不憚跏趺坐一氈針碗投時明底事風幡話處許誰傳秋深霧斂禪河淨霜冷鴻歸心月圓只個蒲團忘晝夜法堂一任草芊芊講僧舌翻教海浪涓涓如意揮空代佛宣一字初分開半滿五時巧設定偏圓香雲緲緲飛繒彩花雨紛紛繞法筵欲止兒啼黃葉好謾將黃葉作金錢詩僧一度敲推一度新重吟句裏喜驚人練成錦繡猶多富清似冰霜不染塵雨歇風前頻眺望曙晴花下獨逡巡生涯最苦雕蟲技日日尋芳去問春老僧霜眉皓首褐氍毿世事榮枯總不諳齒缺多風羞見客眼花無力懶開函愛眠每起三竿日怕冷時煨一草龕自憶當年行腳事萬機休罷不須談病僧袈裟羸弱不勝支學佛心灰說向誰枕伏藤床強自起手攜藥銚未嘗離堪嗟病骨如梅瘦形鶴癡妄念銷鎔無一點獨餘明月照清池孤僧自入幽岑只一丁鐺兒腳折苦支撐襟開宇宙憑瀟灑目視雲霄任逕庭清夢不隨流水去閒情唯與野鷗盟獨憐形影常相吊坐起無聊嘯月明遊僧不辭寒暑涉江濱箬笠芒鞋緊著身踏碎峨眉千丈雪帶來少室一枝春衣穿半是風煙妒藤老多緣瘴霧頻路債多年還得否相逢滿面盡埃塵貧僧四壁寥寥只自知窮無窮處始為奇甑中愧乏聚蠅糝囊底久空繫曦絲拾翠充枵遭兩逐裁雲補衲被風吹分明說向人難信舉世貧來更有誰懶僧形骸疏散不堪論對客無心敘語溫涕墜從人言是懶髮長任爾笑非髡愛看涼月猶眠石慵撥寒爐只負暄寂寞渾忘身世老那知剝啄到蓬門初春曉起衝寒試步行喜逢喬木乍遷鶯人情冷淡殊前輩世態驕奢讓後生古驛春晴衰草活遠村風暖落梅輕徘徊更躡煙堆望萬里雲霞海面橫秋日病中遣懷病來偷得片時閒伏枕窗前把句刪萬事無心慚白業多年有夢在青山影沉野渚鴻初度聲亂寒蕉雨乍還閉戶不知秋已老芙蓉笑我鬢毛斑詠舟室臨溪一閣影空浮似艇高懸不著流柳細煙寒低蘸水雪枯荻瘦淡涵秋無邊風月詩中老幾許乾坤夢裏遊試問主人聊借我閒來海上狎輕鷗其二數椽倒浸一溪橫彷彿蘭舟浪不驚兩霽帆收雲影亂風迴纜繫柳絲輕每懷鄂渚千年韻誰羨銀河萬里情近日生涯隨分足月鉤天外釣長鯨春日漫興二月三月春風狂桃花李花爭出墻萍喧遊鱗擲浪急雨過紫燕啣泥忙閒荷小鋤耘細草獨披短褐理修篁堪憐世事今非昔日暮煙波望渺茫春日登雲間大觀樓春風無恙鳥啼花花裏登樓興更奢浩浩歌鐘沉野籟層層梅柳隔人家數堆螺髻青撩亂百里虹橋影倒斜遙望潮迴知海近城頭落日奏胡笳再過古疁化城菴去年我來八月天今又舟泊重陽前乍出乍沒江邊石半晴半陰隴上煙楓落紅霞詩片片菊開黃蝶影翩翩此回且喜生涯好滿載秋風過練川賦得隨意嶺頭雲澹澹和風過翠岑遙看時復弄晴陰忽南忽北情無倦頻去頻來意不禁曉逐輕帆歸遠岫晚隨清磬度長林等閒懶上丹青譜蹤跡惟容野鶴尋善權洞亂雲深貯玉壺天勝境方知不浪傳石乳潛通流鳳髓靈根倒拄透龍困玲瓏翠寶明兼暗窈窕丹梯斷復連到此頓忘塵世界相逢且莫說三禪詠善權寺有感離墨山高壓眾峰紅霞碧樹繞重重六朝香火千年寺十里亭橋一逕松水接靈源分洞脈燈傳慧燄續南宗看來此地今猶昔夜半慚聞架上鐘新秋西風昨夜入簾鉤一葉俄驚海國秋雨過幾家人弄笛月明千里客登樓池荷露滴香初散院竹涼生暑漸收落日亭邊倚杖立漁歌唱出蓼花洲中秋賞月湖天一色滿樓西極目清輝杖可攜簫管聲從雲外斷星河影向盞中低漫嗟秋草經時變已識人情轉眼迷好景不妨連夜賞莫教明月落前溪閒步秋林落葉滿天涯撩亂浮雲陣陣鴉楊柳暗傷流水外芙蓉醉倚夕陽斜一團風月恣吟興萬疊煙巒入望賒時序易驚衰鬢改蕭蕭野岸老蒹葭九日登離墨峰頂重陽抱病強登高身入層雲興亦豪彈指江山歸幻夢堪嗟名利逐波濤白鷗蕩漾狎仙客黃菊離披類我曹欲把新詩留石上恐驚野籟晚蕭騷其二風晴沙白裊秋煙攜茗憑高共笑巔病眼懶看浮世態孤笻唯愛老山川樵歌互答長林外鴈影橫分夕照邊望裏鄉關何處是丹楓搖落滿江天詠醉松錯節盤根擅八區飽酣霜雪鼓虯鬚乾坤獨立聲光冷今古渾忘氣概殊夜靜有情招鶴唳曉來無力著風扶渠儂不食官家俸月挂峰頭傾玉壺春日詠雪看似無情卻有情飛來片片使人驚暗侵柳色寒猶甚低壓梅花夢不成枕上吟殘詩五字窗前疑是月三更興酣慣與東風戰盡把溪山一抹平登樓竹裏樓臺取次通遙看孤鶴下晴空短歌隱隱畫溪外清磬聲聲煙寺中千里風塵隨處異百年人事與今同欄杆倚罷斜陽盡撩亂荷花水面風芟草次拙菴朴侍者韻門逕荒涼客屐疏殷勤還自細刪鋤目前荊棘知無剩簾外風光儘有餘晴曬落霞堪作供夜留明月且看書漫言道者多分別蘭蕙薰蕕不共居遊金山誰向江心豎一拳稜層怪勢欲擎天繩床借坐東坡話玉帶曾輸佛印禪瓜渚煙寒迷楚樹瓮城浪急泊吳船今朝始獲登臨興收拾峰巒畫裏懸五言排律暮秋積雨山深寒更苦屋老畫常昏況復秋多雨仍兼首戴盆栖禽愁不寐籬菊暗消魂罕見僧尋句唯聞犬吠門曉風生遠浦落木下孤村鶴避茶煙濕衣添水墨痕沉沉清夢斷漠漠野雲奔螢火搖簾暮遊魚弄沼渾聊荷補毳衲拾翠纔饔飧蝸蝕繩床腳蘚侵犢鼻禪問天何日霽啟戶望朝瞰有客來相吊無人細共論詠維揚善慶禪院四水縈金界九龍護座雄欄楯珙樹繞亭閣篆煙籠鴛瓦翻繒彩鰲椽締錦虹飛花隨客至遠翠隔簾通磬寂僧方定林幽鳥喚風漁歌和梵響佛火射潮紅蛟室胡為麗蜃樓未足崇廣陵真勝地千古一琳宮
