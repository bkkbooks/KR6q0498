body:
  text: 桐城方拱乾選歌懷梅擬古四首雨過兮窗暗溪漠漠兮煙淡淡煙濃兮春歸庾嶺遙兮雁斷雪飛兮魂亂漏滴兮夢寒水溶溶兮月團團月落兮鵲鶩憶和靖兮夜闌詩成兮燈殘林空兮香窅人寂寂兮霜皎皎霜冷兮鐘沉問消息兮誰曉南枝兮啼鳥簾動兮月上風戛戛兮波蕩蕩波澄兮天空獨搔首兮惆悵芳心兮無恙送柴也歸閩昨從浙江來今又入嶺去千里何迢遙索我歸山句閩海多奇峰飛猿常嘯樹道人活計新自有天然趣君不見他人行處我不行他人住處我不住又不見昔年潦倒隱山翁燒卻芊菴入深處風吹日炙荔枝紅一段馨香任遠布庚子春厂峰堂主邀余過瞿曇菴踏月抵初而至落日啣山半昏黃抱笻躞蹀復趨蹌十里松花撲衣香飛濤滾滾下澗旁行盡溪聲到草堂月上層巒影微茫中有厂子憩瓢囊四壁瀟然書滿床綴荷餐霞歲月忘婆娑短髮歌徜徉鏗金戛玉弄修篁坐闢乾坤天一方輪蹄安得至巖房石上苔蹤多虎狼偶來二月柳初狂春風相約牽我裳等閒笑裏聲何長驚散冥鴻返故鄉詩成潦草揮數行落花流水各自忙久慕上洋王氏梅園辛丑仲春日麗風和景舒物暢偕諸子泛小舟遂獲盤桓信宿以償夙願柳線娜娜谷風微紫陌行人踏朝晞隔樹煙迷鶯語嫩晴江霞翻錦浪肥小舟行慣諳水脈曉期尋梅問釣磯望中千家屋曬月郊外百頃雪沾衣夢入羅浮春窈窕香驚蝴蝶影紛飛相呼相喚二三子共坐臨流竟忘歸王家池上天欲無桂亭蘭榭疑洞府仙葩異卉百千般鐵榦虯枝互撐拄俄訝臥龍攫浪起轉盼白鳳翔空舞乍似玉人月下依稀臞鶴棲玄圃伯美費盡腕頭力只可看兮不可譜我今來扣花主人幾度問花花不語一片冰心說向誰對客半吞復半吐循環不倦徙闌杆樓頭笛罷珮珊珊羞煞幾多妖冶態肯同桃李話歲寒君不見孤山翁冷澹生涯趣不同放鶴亭邊春常在千古萬古仰其風又不見灞橋客尋香凍斷蹇驢脊皎皎清光遠塵氛秋月蘆花難並跡東君為我一何好十里橫鋪粉瑪瑙徘徊別是一壺天不羨十洲與瓊島回首總成醯雞夢寄語遊人須珍重送紫谷後堂之五臺紫霞谷多年煙水詢堂奧越國燕京無不到撈得耶溪月一鉤而今欲返臺山道臺山道上春更奢擔月囊雲客如麻自古新豐和者寡無腔笛裏落梅花謾說高山與流水不屬尋常律呂家臨行贈爾鈯斧子此去闕蓁住紫霞紫霞谷深多靈蹟昔有尊宿號紫柏壁上猶存翰墨痕留與後人作標格君不見洞源一派舊來長滔滔不斷入清涼千溪萬壑阻莫住瀰漫大地滋群芳又不見臺山勝境名第一寶樹珍禽人不識石上遍開金芙蕖欲見無緣空相憶為我致意文殊叟跨下青獅無恙否何時騎得到雲間試向風前一哮吼歌剪絨白輥馬昔日曾觀子昂畫畫中騏驥妙入神曠然令人動想此畫世間稱奇珍有客惠我剪絨馬斯馬古今罕見者極精殫巧不可言雙眸炯炯寒光灑鼓鬣揚蹄塵不起追風躡電未為比王良善御技已窮伯樂顧之徒驚喜玉骨爭肯著雪埋神駒不產渥窪裏久辭征戰汗勞勳懶嘶清風臥香几雕鞍已卸利名韁豈貪芝草戀瓊漿雄心歇處忘踢齧逸塵何足誇乘黃得意謾將詰牝牡麟趾龍媒詎尋常畫馬奚如絨馬好霜毛凜凜生輝煌支公有言良可信我今亦復愛神駿若教當今天子知詔購千金價不吝分付圍人緊相從等閒莫放出紗籠只恐秋深明月夜走入蘆花不見蹤送靈谷之五臺有序靈谷昔自五臺來歷參久發大誓愿飯僧十萬八千誦法華千部燃二指作回向今欲五臺余嘉其行而作歌送之曉霽天開鴻初度春風吹起花無數極目煙波正茫茫堪憐誰問福城路有客矍鑠老不頹赤腳踏水下五臺看遍江南梅似雪袈裟曾不著點埃不著點埃真瀟灑翻笑無端甘行者十萬八千無漏因勝似餧牛與餧馬道人行履未足誇肯逐兒童捉楊花披襟坐月閒活計胡跪焚香誦三車諸法本來寂滅相黃鶯枝上語偏賒琅琅句滿七千軸豈似循行學筭沙君不見藥王當年焚兩臂為法捐軀志何銳精進之中精進幢供養之中供養最又不見塗膏代燭把指燃燃燈因地修忍僊光明耿耿長不夜千古萬古火中蓮而今欲返清涼去得來索我臨行句金剛窟前有一言均提覿面曾指註前三後三意若何舌頭捩轉說向他文殊不居金色界千峰雲散碧嵯峨五言古詩蓮沼靈沼鑿何年經始先人手鬱鬱無凡卉芙蕖依岸柳風迴香濕衣露墜珠交走性賦廉且貞根潛悠復久試問看花人幾能心似否若教心似花證聖何難有珍域即目前胡為列品九徘徊堪獨賞莫問濂溪冷窗吟子月正隆寒況兼苦霜雪松巢鶴共語日中烏足折野客吟不成品字煨榾柮翻思持節人冷齒和氈齧衡門有高士僵臥身不層更憐忘軀者安心將臂截銳志不可磨千載風凜冽此道今何遐堪悲不堪說登弁峰頂偶登蒼弁巔紆目千里外天地一胸襟長江飄素帶謦欬發清風萬壑鳴幽籟浮雲倏變更令人增感慨曉望曙色盪簾珍禽鳴鼓翮畏寒臥起遲披襟聊斫額雲斂望鄉關煙樹千重隔宇宙半微茫霜風正蕭索勞生苦何煩誰能解自適堪羨海鷗閒嘗狎無事客夜坐覽坡僊集得黠字夜寂漏聲稀風雨驟然聒打我窗紙穿倒弄簾鉤戛篆銷幌影寒雁叫羽橫刷偶讀蘇子忽笑靈鼠黠人為物最靈奚焉弗覺察良由情斷牽古今不可拔智愚無靈凡天地恣管轄春宵遣懷夜寒不成眠振衣聊復起搔首弄殘燈微風生竹裏誰招月來窗勾引梅放蕊梅月兩交輝萬籟靜沉水有客萬緣空身心亦如洗歌罷獨徘徊此情難共委寥宇宙間長嘯聲不已送谷山和尚返古虔梧陰滴翠濃菱芡香波竅正好恣高譚奚為動還棹月滿十八灘迢遞三千里愧斯守株人無能附驥尾各懷天一涯悠夢託流水祖燈多嶺南古虔復振起千載澤群蒙章貢流不已他日抱笻經遙尋詠鶺鴿空拳作人事相見莫掩扃哭曹山啟元大師去年八月裏排闥樛園中談心笑明月啜茗話秋風杖黎踏歌去闢雲搆梵宮此宮還未竣別我何匆匆吳山落暮色鑑水正微茫砥柱中流斷疇乃作慈航泉石爭哽咽猿鳥競哀傷我哭天垂淚萬里傾滂沛不是思慕情亦非手足義痛哉末世時真風將恐墜丙申夏月重晤任運法兄承惠墨詶酢月餘遂欲別復訂雲門之約憶昔聚雄峰瞬息十六載彼此兩鬢絲相笑復相駭挑燈話忘眠鄉譚喜未改遙惠以客卿滿室飛光彩筆底生雲煙金箋結蓓蕾縷縷鬱陶思𩖼𩖼南薰解聽雨坐茅堂烹泉沸玉蟹大賈貴深藏鴻鵠志高愷千里一帆輕別我去瀟灑莫負會稽盟垂虹釣東海秋夜水煙縈荇絲微涼生素髮露滴桂花根簾捲玲瓏月瓦鐺然桂枝香霧靄林樾銀河搆羽橋乘槎興莫閼蟲泣懷宋玉秋聲葉底發逝者歎如斯好景成倏忽宿梅園秋色爛如春幽香乍可掬深塢有梅園煙霞生竹屋紅日半崦嵫白雲留我宿麻餈飽不饑柴床夢易熟流水亦堪琴青山好遊目何日偷餘閒再享茗香福過竹香居兼贈巨浪主人百畝水雲鄉窈窕抱幽獨沙暖鳧鴈多林明生海旭有客愛隱淪數椽聊自足板橋通流水半梅兼半竹春回香滿室風搖疑戛玉落花自成詩好鳥賡相續曾聞到者稀我來極遊目籬菊解笑人秋風倒牽服信宿幾逗留為唱新豐曲曲罷復長嘯萬里江天綠鵲營巢羨爾珍禽靈擇木托高志拮据自營為聊作目前計春深帶雛飛曷有眷巢意曾聞北海鵬背負垂天翅崩騰六合雲變化形無寄矧茲達道人無悶而遯世造物莫能拘胸襟羅天地嗟彼戀窟蛇彈丸不可棄勞生亦復爾寧免桎梏累觀海薄暮臨高臺憑虛一登跳千里何茫茫滄溟正浩浩白浪如山頹火雲波底照魚龍影紛飛乾坤忽顛倒還疑起鶤鵬天風吼萬竅令我骨毛寒倏爾動懷抱人生良可悲興廢總幻泡欲寫莫能言徘徊發長嘯再過吳淞寓普賢菴買棹遠尋鐘一庵負城郭綠水自縈迴白雲抱樹腳佛燈映海霞茶熟驚野鶴我來正清秋諸景未寂寞芙蓉撩亂開紅葉剛乍脫屈指十餘霜顧盼猶如昨相逢盡少年相識半凋落隙駒誠難挽世事浮雲薄詩成將寄誰明月可常託月浦野步漠漠天涯外悠悠東海瀆晴煙浮蜃閣芳樹靄紅塵依岸暫維舟極目曠無垠林雞啼午後村犬吠花津涼飆刺短袖細露濕青巾片雲孤野鶴萬里一閒身野老鄉談異解笑語未真江山幾改變流水不知春惟有浦上月千秋獨照人挑柴途中口號山家何所事生涯寄野樵帶葉斫青榦擔雲歸路遙緩步下危嶺橫肩過小橋悠哉忘帝力忽聽南山其二一曲聲未已夕陽澹流水亂石響松濤寒花爆霜蕊憶昔爛柯人一去不知春令我增懷抱千古共誰論湧金亭看秋色郊外雨初晴風煙斂亭際我來試策游秋色勝春媚野棠數里紅長江一錦庇石壁流丹霞亂山疊黃花暗窺人蝶翅挾香膩竹根迸細泉鷺鶿傍午行吟過澗東葉響驚犬吠不羨米家圖別在一天地偶修善權佛殿月臺適有謗者瑞魯毛居士贈以詩依韻酬之慨茲黍離離鼷鼠晝行蔓佛燈久塵霾芳規去年這莖草昔人標布金長者願於義苟無私當仁何必遜經始號靈臺千古曰成憲幸爾有知音立言發高論稱譽亦非榮詆訾胡為困何以報瓊瑤自慚多委頓月下細披之助我窮愁健山中苦雨一秋九十日兩月苦淋漓滴穿頑石眼愁斷案山眉老農咸在望收藏賴此時高低田盡沒禾黍刈何期新餉無可辦舊賦更難支有客朝炊玉瓦鐺爨瓊枝常懷杞人憂寒花為我悲憑虛天外看城郭浸玻璃夜讀弘秀集有唐三百年人文盛且優騷壇推李杜緇林擅齊休上人五十二雪曲遞唱酬戛金爭播玉截錦綴貂裘雄有拔山力勢能障海流逮茲千餘載冷然韻不改片片析瓊枝字字成珠壘詠之以忘憂目生光彩光彩耀古今幾得古人心夜深屋梁月獨寒擁衾復長嘆霜花盈衣襟五月二十一是余初度諸子各以詩偈為壽予亦不禁鄙懷遂依韻和之搔首雪花飛驚看寒碧映晴巒入畫圖風鐸向天詠荷動水烝煙江澄鷗汎鏡孰能為解嘲笑傲生平慶其二菡萏笑風狂憑欄光揜映晚霞織錦天幽籟雅歌詠萍跡浪生愁蒲姿霜落鏡空慚馬齒增魚鳥為喧其三蕉窗傍小池瀲灩遞搖映籜粉欲成團翠雛擬學詠廚空愁見賓髮短羞窺鏡一紀又虛添自敲詩自慶遊八公洞行入深深處幽曠隱逸多松老前人句歌看花敲竹戶坐石挽藤蘿山泉分古韻春色亂庭欲歸歸未得愛此風月窩行泊河橋行行一百里日暮到河橋舟艤河橋畔遙聞吹洞簫簫罷人何處落花隨水去偶逢白鷺鶿與我同心緒心緒有何憑東風颺柳絮絮飛二月天細雨亂如煙最是不堪聽聲聲啼杜鵑
