body:
  text: 住國山善權寺嗣法門人智操住京兆薦福寺嗣法門人智覺編次機緣僧問拜即是不拜即是師云顛倒作麼僧曰金翅劈開滄海去青山低首笑相迎師云腳跟下好與三十棒曰作家宗師師云不勞讚歎僧禮拜師復云從何處來曰西天目師云曾見高峰大師麼曰和尚大似不曾到天目師云莫亂統曰和尚一向在那裏師云要向你說上座不曾到曰同是家裏人何消與麼師云三千里外曰爭奈腳頭腳底師云腳底尚不知說甚麼腳頭問如何是無位真人師云兩瓶好花紅似錦曰家賊難防時如何師云即今賊在甚麼處僧擬議師云捉敗了也曰說甚麼師云你耳聾我亦耳聵僧參師云號甚麼曰牧牛師云牛在甚麼處僧禮拜師云牛既如是你作麼生牧僧拂袖一下師云猶𨁝跳在曰師作麼生牧師云穿卻你鼻孔眾善信設齋次師云今日多謝厚意曰上門買賣好做師云爭奈居士折本曰食到口邊被人奪卻師云何處得者消息來曰和尚請齋師云果然被山僧奪卻士無語師大笑居士參師云你一向做甚麼工夫曰持準提咒師云曾見準提菩薩麼曰曾見師云是何面目士擬議師打一數珠云準提菩薩過去久矣僧問覿面相逢作麼生道師云只恐你錯會曰門門一切境回互不回互如何回互師撫桌子云不得喚作桌子曰如何不回互師云者箇是桌子曰學人即不然師云你又作麼生曰出戶不偏行各赴兩頭機師云莫亂統僧請益師問如何是你本來面目曰胡來胡現漢來漢現師云胡漢不來時如何曰照天照地師云打破鏡時作麼生曰海闊從魚躍天高任鳥飛師云更有漫天網子在僧擬議師掌云又向鬼窟裏作活計居士問曹洞臨濟還有別也無師云虛空無背面曰者是無別也師云青嶂有高低曰者是有別也師云那裏是別曰有高低師云仁者自生分別師命寒松首座落堂考工畢上方丈問訊師云今日堂中幾人悟道曰若不是某幾錯祗對和尚師云座元大似不曾落堂曰將謂無人證明師云既然落堂因甚容他聖僧瞌睡曰且喜今日放參師為擊節僧問涅槃心易曉差別智難明如何是涅槃心師云簷前雨滴滴曰差別智又作麼生師云秋色滿庭芳曰恁麼則言言見諦句句朝宗師云莫錯會好問初祖對梁武帝云廓然無聖因甚雲門祖庭寺名顯聖師云君子喻於義小人喻於利師問獨立維那月到中秋分外明因甚被片雲遮卻還是隱顯不同為復別有長處曰待月落後與和尚相見僧送茶至師云是甚麼茶曰太白峰茶師云太白峰嶮峻如何到得僧無對師云不是太白峰茶師畫此問北冥西堂不是圓相亦非月輪去此二途試道一語看曰帝釋宮中放赦書師云未在更道曰王令已行天下遍身榮何用更封侯師問時一侍者山僧連日有病大眾俱來看有一人不來且道為甚不來曰東宮雖至嫡不面聖堯顏僧問如何是青龍境師云寶塔衝霄漢如何是境中人師云金鎞指月看曰人境不立何處相見師云當面錯過曰芳艸渡頭尋不見夜深依舊宿蘆花師云那裏學來的僧禮拜師便打厂峰入方丈師云那箇是你本來面目曰和尚還見學人麼師云何曾會在曰從來不迷師云既不迷到弁山做甚麼曰不到爭知不迷震南參問作何方便得本分相應去師搊住云速道速道南愕然師便托開靈機參師問甚處來曰河北師云少林主人為誰曰涵宇和尚師云如何知是涵宇曰一點瞞他不得師云背後的是甚麼機作禮師云大好瞞他不得印白參師云今日事如何曰天不能蓋地不能載師云你在甚麼處白喝師云再道曰不敢妄生節目九一居士參師舉大顛擯首座話詰之曰好事不如無師云與麼大顛亦多事曰和尚著甚死急師云當日首座會不會曰不妨舉似諸方師云有人舉數珠問你又作麼生士拂袖出師云放汝三十棒福建居士問七佛已前是何人說法師云居士莫打鄉談曰七佛已後又是何人說法師云山僧只會官話劍機尼入室師云一歸何處曰金不博金水不洗水師云南泉斬貓趙州頂履又作麼生曰故鄉蹋斷來時路師云麻三斤聻曰白日無閒人問荅問乾為蓋坤為軸將甚喚作關捩子荅拄杖在山僧手裏問鄉村四月閑人少因甚容得水牯牛橫眠四野荅農家不管興亡事一任和雲占洞庭問翀天俊鶻為何撞入網中荅怪得阿誰問一箇雷聲天下響古路邊石獅子為甚不聞荅不受驚嚇問血滴滴地是何意旨荅照顧眉毛問如何是子覺母殼荅錯過了也問九峰不肯首座意在於何荅雪屋夢猶寒問孤峰獨宿未是衲僧活計那是衲僧活計荅眼裏童人吹玉笛問兩手扶犁水過膝明什麼邊事荅知恩者少問心花發現為何腳下不明荅但恁麼舉問法身充滿沙界因甚無字關透不過荅一箭射雙鵰問威音王那畔更那畔如何透過法身荅波斯水上翻筋斗問洞山睹水影悟箇甚麼荅鄉談不一般問從賢聖中來不曾殺生是何意旨荅雲消山谷冷問既是放生池為何淹死人荅路不拾遺君子稱美問一切眾生本無生滅因甚又放生荅拋磚引玉問一切眾生本來是佛且道復禮何佛荅天上天下唯我獨尊問既是鹹井涇因甚麼靜室中喫淡水荅莫被舌頭瞞問佛未出世祖不西來者著子阿誰傳授荅春至鳥聲碎問洞山君臣臨濟賓主是同是別荅疁城古練川如何是賓中主荅茅屋安金吻如何是主中賓荅拄杖半肩橫如何是賓中賓荅滿面是埃塵如何是主中主荅佛祖莫能窺如何是賓主相見的事荅當面休錯過問賓主相見有何奇特荅六耳不同謀問賓主相去幾何荅兩眼對兩眼如何是體荅虛空吞皓魄如何是用荅蝦蟆飛上天如何是體用俱到荅清風拂明月如何是體用俱不到荅抱贓叫蒼天問師是洞山嫡裔洞山祖師今在何處荅遍界不曾藏問蓮花出水根從何來荅好箇消息問朝朝同佛起夜夜抱佛眠為何佛又不見荅只為太近問一燈普照因甚殿後不亮荅自生障礙問鼙鼓震驚四方俱動未審法地動不動荅木馬遊春俊不羈問龍華大士化身千億師今補處能化幾身荅雲月雖無異谿山不一般問袈裟角裏無藏風地風從何有荅好箇問頭問諸供養中法供養最今無法無供養作麼為最荅謝子殷勤問華林古木陽春競發敢問枯木開花也無荅堪憐幾許尋香客穿卻鼻頭總不知垂問問有一人讀盡五車書胸中無一元字有一人不見書木博盡古今有一人讀盡五車書博盡古今有一人不讀五車書亦不博古今此四人中且道那一人作得人天師問月到中秋分外明因甚被片雲遮卻還是隱顯不同為復別有長處問弁山頂上為何白不住問洞山門下永絕滲漏為何花石澗內流水滔滔問菊花九月開因甚華林園裏卻無問霧鎖千峰為甚行人不斷問畫此云不是圓相亦非月輪去此二途試道一語看問洞山云青山白雲父白雲青山兒白雲終日倚青山總不知既是父子為甚不知問烏鴉生箇白鷺鷥且道是何祥瑞問善權古剎歷代名藍法堂前為何艸漫漫地問輪藏殿與鐘樓每日鬥額且道他為箇甚麼問德山入門便棒臨濟入門便喝且道山僧總不與麼還有為人處也無垂代問聖僧打瞌睡因甚麼不巡他香師代云官不容鍼私通車馬問適來經行何緣故蹋殺箇祖師師代云何不道某甲罪過又云賴和尚證明問在眼曰見在耳曰聞在鼻曰嗅在舌譚論祇如在眉毛喚作甚麼師代云天子不刈茅問衲僧家氣吞佛祖眼蓋乾坤胡為乎透一字關不過頌氣吞佛祖未為雄末後牢關不易通腳底若教紅線斷倒騎石馬出紗籠問高揖釋迦不拜彌勒的人為甚麼朝打三千暮打八百頌不羨首陽清餓士謾誇渭水老垂綸高名勳業雙忘處始是太平無事人問山青水綠桃紅李白若道是色瞎卻渠眼若道不是色又被活埋且道如何得透脫二途去頌朱紫滿堂豈是色管絃徹耳亦非聲試看橋畔酣眠客寵辱無心兩不驚問疑團未破腳跟下浮逼逼地疑團已破為何腳跟下亦浮逼逼地頌三月年年啼子規聲聲泣血染花枝窮途無限傷心事不是愁人也淚垂法語示景純張居士昔慈明禪師好訶罵諸方指為邪說大慧老人好貶剝叢林名為禪病以此觀之古今皆然邇來參禪者如麻似粟真得見地者曾幾何人要而言之有認耳目為禪到處側耳揚眉搖頭點額有認手足為禪遇人豎指擎拳點胸頓足有認意識為禪一味窮玄索玅博古論今有認狂妄為禪飲酒食肉自稱為逆行菩薩有認儱侗為禪盲枷瞎棒亂訶亂說便為格外提持如此者非邪病而何皆由不肯親近名宿妄自尊大故耳今足下欲明此事須將平日所學所見盡情放下把箇本參挂在眉尖如一柄金剛寶劍更有何物敢攖其鋒有時㘞地一聲元來只是者箇猶如啞子得夢只可自知到者箇田地一任橫行豎行無非佛事弄子抱孫總是尋常所謂大家團圞頭共說無生話是也否則急就作家爐韝受向上鉗錘庶免墮如上諸病耳勉旃勉旃示蘊空知客昔年相見不相識今日相識不相見練川一路平如砥腳頭腳尾光顯現掀翻底蘊絕囊藏喝碎虛空始成片回頭笑看楚山雲轉步還蹋吳嶺霰關外更有一重關且莫歸家便住院不信但問無舌人洛浦當年曾親薦昭慶無物可贈君臨行聊為通一線春風拂破碧桃腮曉日揭開青嶂面示闇然禪人秋風瑟瑟浮雲薄秋雨濛濛木葉脫青山骨瘦溪毛長江天一色澂寥廓堪憐一片祖師心萬古凝然成寂寞禪流於此識端倪何必擔囊費驢腳吳山楚水兩悠悠湖北江南翠如削若是金毛獅子兒安肯隨流混眾角一聲哮吼隱狐群乾坤粉碎空花落勿怪青龍把舌饒就中幾箇能斟酌三更迸出一輪紅珊瑚枝上光閃爍示默符書記機前有語未為奇默契安知向上機語默兩途俱坐斷靈符肘後示全提示悟如闍黎悟本由心勿外求如來藏裏已全周打開方識無窮盡信意施為用不休示大休禪人大休須到大休時到得休時正好為任意為來無一事三更紅日上梅枝示錢君求醫士醫到末年老愈精拈來莖艸盡回生須知更有超方術一念無為聖可成示古言知藏一藏原來是故紙五千餘軸總閒言知君徹底掀翻也撒手歸家月滿軒示子菴書記一字難將海墨書箇中那許涉躊躇分明祇在毫端上滿目煙光徹太虛示杲目禪人杲日三更當戶照徹開亞目頂門寬今時那畔俱拈卻鐵馬嘶風鳥道還送獨立書記之楚禪客飄然歸楚鄉清風兩岸送行裝一曲新豐宜鄭重由來此曲異宮商今古知音能有幾洞庭月在波心裏耐得秋霜果自馨爭看聲價撩天起金錘袖裏復誰知等閒擊出虛空髓弁山華發少林春千載曹源流不止蹋遍煙巒何處好回雁峰前消息早覓得佳山勿自棲他時待我來投老題讚釋迦佛惟我大雄一切究竟包括太虛遠離修證一塵不動普接群機遍界全彰恒然在定玅相不可以色求洪音不可以耳聽至矣哉凡有覺知者莫不稽首皈命雪山像皇宮棄卻亦何獃六載饑寒骨似柴箇事而今誰不會逢人謾道睹星來觀音大士四首婆娑其髮袒露其襟默然獨坐聲似雷音咦欲識洛伽真面目端的休從紙上尋一毫端上玅相現一切毫端靡不遍恍如秋月著珊瑚枝枝撐出慈悲面僧繇雖巧畫難成慈禪筆底顯神變神變縱橫不滯功如幻三昧體皆同見聞獲益無空過風號松吼啟圓通袒裼露胸潦倒叵耐跣足垂眉似甚體態道是過去正法明卻云現前觀自在咄認著依然不是渠黃鶯啼出柳陰外坐對銀瓶一味閑秋空皓月露慈顏圓音落落超今古祇在鴉鳴鵲噪閒木理觀音有序辛丑歲江南造戰艦禦海工師解木忽得木理作大士像者眉髮精細衣袂飄舉雖吳道子得意筆未能過之亦奇事也一送如皋一供善慶禪院因作贊以志不朽月之在水火之傳薪不去不來非幻非真頭頭物物剎剎塵塵舍亦弗得取愈勞神無取無舍何疏何親大士亦爾如是現身有感斯應靡福不臻魚籃觀音二首巧扮風流何太奇魚籃默自手中提而今不比當時事索價撩天賣與誰慈風滿面兮若春輝玲瓏通身兮悉瓔珞足躡白雲兮影重重籃提赬尾兮活鱍鱍只為其人罕遇到今滯貨難脫莫莫莫須斟酌從來者箇不尋常六月何曾怕爛卻普賢大士酬機玅辨似瓴懸潦倒無端號普賢舒卷猶憑吾掌握象王鼻孔謾撩天達磨蹋翻波底明月坐斷嶺頭白雲堪笑者場漏逗強將皮骨空分將謂許多奇特事至今千載賺兒孫寒山拾得者對髼頭似甚模樣攜帚搭肩縱情放蕩有時向國清寺裏混跡和光有時在寒山嶺頭揚歌作唱直饒你文殊普賢到者裏正好喫棒羅漢四首者夥老禿奴看來甚古怪做出許多般賣盡家醜態愛靜而離喧唯知貪自在當時趁入牯牛群免得丹青還筆債箇些尊慈大衲渾然沒點來由到處逢場作戲見人慣弄虛頭或捐笠而直渡或擲杖而截流降龍兮欺神瞞鬼伏虎兮誑惑愚儔若到昭慶門下竹篦打破髑髏何故騰雲駕霧不如你說法還須老比丘擁衲蒲團只默默無心翻貝葉滿腮鬚髮紺螺旋秋浸雙眸萬頃碧波天彷彿空生嵒下坐卻又似達磨覿面分明別不別不別殷勤問取天邊月老大無端不自尊重交臂摩肩聚頭說夢幙天蓆地而橫眠跨海駕虹而應供德動鬼神兮有何奇道伏龍虎兮徒打鬨不如一念回機徹見本來玅用且道如何是玅用咄好與三十老烏藤免教人前更賣弄觀音經塔層層彰自在字字露圓通為了慈悲債分身遍剎中金剛經塔團團任描邈落落絕追攀欲識金剛體祇在一毫端梵網經有序予寒松首座於率眾之暇敷楮援毫書成梵網經四卷冀廣流通使見聞讀誦者皆證如來心地法門故作一偈聊為贊助毫端別露玉壺春寫出琅𪻱無價珍一葉一莖交互現一華一佛遞相鄰百千世界猶珠網萬億光明遍剎塵句下揭開心地藏盡虛空是舍那身雲門湛老和尚大啟雲門中疏洞水挽回既倒之狂瀾重整將頹之綱紀機如掣電兮龍睛鶻眼猶迷辯似懸河兮墅潦牛涔莫比高揮寶劍兮掃空魔跡狐蹤橫拋月鉤兮釣盡爆腮赤尾師翁師翁我知之矣天下人不奈你何故號之曰湛鐵觜弁山瑞老和尚五首頂垂鶴髮目奪秋江溫同煦日凜若嚴霜施金錍兮刮人天之瞖膜舒毒手兮抉佛祖之膏肓分一燈於石傘闡五位於龍岡名聞異域聲震遐方有人欲問是何叟九坐道場大法王坐穿鐵壁顯家風九闢天荒老凍儂拈出花梢一片月等閒壓倒大雄峰稽首吾師人天標格滄溟為口霹靂為舌坐斷十方孰能可測喚回石虎嘯春風鞭起泥牛耕海月高撐石傘坐大雄峰翻天轉地捉象屠龍呵斥邪說扶樹綱宗是誰作略號楊木公若道是先師如井覷驢若道非先師如驢覷井是非并拈卻截鶴續鳧脛既都不是畢竟向何處見先師聻分明覿面更無私切莫迷頭猶認影蓮池大師貌古稜層熾然無語性相兼通權實并舉纔涉思惟未敢相許且道是誰蓮宗教主聞谷大師動若行雲止若谷神勿勞耳聽祇須眼聞咦禹門浪裏翻身轉高剔蓮燈慧燄新茂林和尚得戒師金襴獨擁倚藤床不倦毘尼為舉揚他日願為蓮社主共攜諸子上慈航三昧律師碧水澂渟絕點塵風光滿貯玉壺新阿師面目分明在謾道優波最後身道明律師坐倚屏風家聲獨占幹蠱先猷毘尼城塹願力彌勒慈誨無倦潔若冰壺淨似江練一缽雲仍澤流溥遍若菴律師長松之下頹然一老戒若冰清行猶月皎七軸蓮經一默而了且道是誰問取文表文表請見月律師絳衣斜搭半橫身高豎光幢啟後塵道繼南山知有在千華臺上再來人洞山孤崖和尚目紺眉修神丰貌冷巍巍乎峭壁之凌虛凜凜然孤松之秀挺鋤明月而調繼新豐闢白雲而剎興洞嶺玄關丕闡兮濟濟龍象交參藻鑑高懸兮歷歷聖凡絕影春雨桃花泛錦溪秋風梧葉飄金井衍慶石鼓和尚貌臞似鵠目湛如秋奇偉逸群玅辨罕酬絕攀緣兮惟道自樂嗜恬澹兮以德為侔指雲月而傳心兮機無不被借松風而演法兮澤及何休吾兄乎吾兄乎是之謂嬾殘大梅船子鐵篴之流也歟金仙蕃光和尚咄哉老兄氣宇豪邁結佛祖冤放慈悲債橫拈麈尾驗龍蛇默倚烏藤震聾聵分明覿面更無他金仙堂上第一代大休法姪象田出廄迥常途此是吾家天馬駒更向曹溪波浪裏蹋翻明月滿珊瑚道珍闍黎叢林柱石羨耆年一片身心似鐵堅贏得滿頭垂白髮性天雲靜月初圓半壑上座眼界澂渟胸襟廓落以德為鄰於世無縛一味瀟然生平行樂流水潺潺白雲漠漠此之為誰號曰半壑廓凡耆德艸褥褐衣唯尚儉素秉雲棲尸羅飲真寂甘露聞金剛以出塵閱圓覺而契悟了無異念兼利於自他不滯一邊并修於禪土誠緇門之表儀尚高世之風度思其人也維敬維欽見斯容兮如偈如慕自題偶爾相逢渠是我渠今是我我非渠婆娑凜若寒松操傲雪凌霜氣自如寒松操首座請爾貌不揚作事且大滅少室之真宗破優波之淨戒剔骨刮髓兮罪犯彌天鑄聖銷凡兮惡盈法界三年居弁峰百世招譏怪噫唯有一點為人心縱使僧繇難邈畫弁山常住請我相真箇醜誰能描得渠縱有十分像何如井覷驢咦山而曉來憑雨洗柳絲春暖倩風梳九芝侍者請生平無福住雲門多結冤家少結恩直欲人人窮徹骨惡名那怕遍乾坤有眼不解觀色有耳不會聞聲雖則如聾如瞶卻又似聰似明咄哉斯漢真奇怪惱殺丹青畫不成僻性生成不自由尋常多為別人愁些須活計真堪笑無底船兒載月遊載月禪人請若道是我返成兩箇若謂非我依然話墮拈卻是非二俱有過畢竟是誰雪壓梅花肥風吹明月破斯人面目畫難全縱有十分也枉然怎似渾圇活打殺免教污卻一張箋天髻禪德請潦倒疏狂不自禁白雲流水共談心生平面目難描畫認著依然又隔岑蕭疏人笑爾樗形巧設施為總不能對客慚無三寸舌酬機唯有一條藤俗不俗僧不僧箇樣如何續祖燈折箸慣將攪大海北冥浪激看飛鵬北冥西堂請者箇褦襶子從來沒正經衲僧眼裏著楔佛魔腦後抽釘或謂是凡睹之叵測或云是聖呼之不靈不若以火燒卻咦且莫孤負丹青靈枝知客請箇樣矮頭陀看來真好笑毘尼渾不持佛法安通竅供養他圖箇甚麼死蝦蟆捏出尿大休靜主請者漢生來骨董佛祖見也毛聳獨許紫谷參頭描得半邊鼻孔紫谷參頭請僧不僧兮俗不俗婆娑短髮齊眉目盡情滅卻洞山宗疑殺諸方老賊禿韞之知藏請者漢無端忒煞奇特座敷青蓮身裹緋疊若謂是震旦之僧卻又似西番之客翻覆細看來我也識你不得呵呵呵咄咄咄不如付與子西堂一任逢人去花擘子菴西堂請壘垂鼻孔擁聳昂肩福薄如紙心高似天其為人也落落魄魄其作事也癡癡顛顛喚回石女兮暗穿玉線策起泥牛兮曉耕秋煙欲知箇漢行藏處端的還須問雪田雪田禪人請凡百莽鹵真杜拗禪截兔角而為杖搓龜毛而作鞭戒德了無毫髮罪過高似華巔時聞書記不嫌醜描得形容壁上懸時聞書記請壘壘堆堆骨骨董董奪罔象之珠絕老胡之種拶得秤錘汗流逼教石女毛聳且道是阿誰此乃南陽谷老師的面孔杲目靜主請打雨敲風多瞋少喜虛空畫眉缽盂安耳咄似者般杜拗阿師誰不識你䰐䰐鬖鬖瀟瀟灑灑或時走電驅雷或時粧聾作啞祇將箇麤棒熱拳便喚做慈悲喜捨恁麼為人報恩者寡欲知渠是誰端的問柴也柴也後堂請髼髼鬆鬆落落魄魄幼少叢林長復失學教無舌人解唱兮響遏風雲使無手者行拳兮掀翻海嶽愛截麒麟之角兮扶弱抑強慣拔鸞鳳之毛兮解黏去縛似者般漢只好打煞活埋又那堪焚香描邈莫莫且留與雲水方來持將去一任他江南塞北天下人貶剝白雪智吟備資敬刻百老和尚語錄第十八卷
