body:
  text: 住國山善權寺嗣法門人智操住京兆薦福寺嗣法門人智覺編次頌古世尊初生出窟金毛威可驚眼空四海太孤生那知更有強中手十字街頭報不平升座洞啓重門坐正軒無絃琴弄月明前依稀似曲才堪聽又被風吹別調間拈花枷鎖多年苦逼身臨行欲把纍兒孫當時爭似默然好一笑輕輕禍到門女子出定春暖陽和景色肥江城花放柳垂隄家家梁上呢喃語處處林中杜宇啼殃崛救産覿面相逢覿面呈何勞往返問來音一錘敲落天邊月萬古碧潭徹底澄洞山掇果桌夜深門外倒垂簾一句聊將驗正偏謾謂蘆灣停櫂穩回途妙展萬機圓德山托鉢才展沒絃琴風吹別調音子期如不遇誰識伯牙心咦昨夜梅開深雪裏天明尋殺幾多人船子得夾山家園蕩盡貧如洗活計惟憑落照裏一曲滄浪聊自喜韻無比遙驚兩岸蘆花起忽有長鯨來噉餌蘭橈直下偷心死踏翻船子重相委休擬議夜深皓月澄江水雲門因僧罷經論來參因緣不惜渾身入虎穴腮邊只欲將鬚捋擬思回首隔雲泥謾道恰似初生月初生月曲彎彎一重金鎖兩重關腦後雙瞳何得失寒光直射斗牛間雲居舜如武昌行乞公子驕人意氣多作家開口見淆訛釘鉸曾喫子湖棒陷虎牢關幾透過幾透過曉不曉令人特憶洞山老為兒不惜兩行眉堪笑而今更有誰丹霞訪龐居士見靈照洗菜次提起籃兮放下籃看來也是販私鹽雖然博得他人利家裏難防老白拈法華舉到琅琊雲從龍風從虎北山晴南山雨放行也皓魄騰空擒住也須彌倒拄明暗交參敲唱雙舉無限魚蝦努眼睛扶搖萬里播寰宇雲居膺令侍者送褲與道者赤心片片為誰酬劍峽徒勞去放舟千古唯餘遺恨在馮唐至老未封侯南泉斬貓提起貓兒驗兩堂箇中那許費商量吹毛直下狼煙息一段春風滿大唐趙州戴草鞋獨羡雄雄老作家草鞋頭戴逞風奢看來也是揚家醜擾得叢林亂似麻勘破婆子趙州老趙州老勘破歸來休草草世事而今更不然未曾開口人先曉大顛擯首座莫謂禪家太不容箇中端的為誰通不因出院明綱紀路上行人口似風國師擯侍者佛眼無窺猶易可龍生鳳養實難饒當時若不行斯令那識南陽手段高興化擯維那當陽一句驗來機霧驟雲騰觸處威驀地捧頭轟霹靂金鱗衝破碧天飛玄沙三種病盲聾瘖啞病多般莫教玄沙被熱瞞若是金毛獅子子三千里外透重關百丈再參一喝當陽徹斗牛電光影裏陳雲收頂門迸出摩醯眼爍破乾坤水倒流打破醬缸江城五夜角聲早韻遞東風穿戶曉帳內佳人睡正濃和雲流水過峰島一僧哭上法堂電光影裏問端倪句內藏鋒意更奇堪笑當年摩竭令幾多喪盡目前機僧問寶月禪師師唱誰家曲宗風嗣阿誰寶云窣堵那吒掌上擎箇裏從來別有腔不干六律與宮商真風淡蕩超今古一任東君到處揚百丈維古禪師上堂衆才集定丈云多虛不如少實卓拄杖一下便下座多虛不如少實那堪捏目生花卓杖即便下座早已淨地撒沙咦當時若有龍門客推倒禪床笑轉奢僧問百丈超禪師某今辭去有問和尚說甚麼法向他道甚麼丈云大雄峰頂上虎生獅子兒一句虎生獅子兒迥然透出有無機三冬枯木花偏秀六月寒梅香滿衣百丈中靖肅禪師有塔存焉無機緣語録巍巍獨占大雄山拂拂清風八面寒流水熾然無間說曾無一字落人間百丈開田說大義開出普請向君說大義明明都漏泄雄峰老太周折展開兩手重饒舌休饒舌饑餐渴飲倦時歇麻三斤鑿頭方錐頭利於中切忌求玄會噉龍妙翅快騰空逐彈蜣螂不離地溪聲和鳥語碎至今千載憶南泉未識何人知此意丹霞燒木佛拈來木佛向爐煨一段真機覿面揮院主殷勤重舉似莫教辜負兩行眉婆子燒菴舉意來時已不投枯樁那許繫魚舟轟雷拶破澄潭月無限風光徹底流慈明問顯英上座近離甚處曰金鑾硬似綿團軟猶鐵橛曲之不彎撓之豈折虛玄不犯兮龍得水而興波左右逢源兮虎插翼而出穴笑作悲巧成拙話盡雲山無限情依然露出珊瑚月長慶拽僧半蓑煙雨曉風寒淺水何勞下釣竿捉得盲龜空作餌翻然笑入蓼花灘龍牙參翠微臨濟撥草入龍宮瞻風探虎穴放行也電卷星馳把住也山崩海竭多少行人被陸沉至今幾箇眼無屑麻谷持錫是不是太郎當切忌人前話短長若肯回頭言外薦始知倒腹與傾腸真堪笑又可傷鴛鴦枕上夢初覺空惹相思淚兩行五位正偏正中偏無目山人夜入廛杖頭有眼明如日照破三千及大千偏中正豎弄橫拈佛祖令任運隨緣總不殊渾然常在那伽定正中來崑崙騎象到天台總然不涉途程限火內優曇五色開兼中至龍吟虎嘯看威勢大用堂堂意自殊電光石火絶回避兼中到箇裏休分白與皂一隊泥龜下洞庭杳然今古絶音耗五位功勳碧水沉沉一色秋蘆灣深處泛輕舟篙師不住煙波興猶向洶洶浪裏遊向心心殷重絶離微念念無私豈背違長樂宮前更漏永夜明簾外曉霜飛奉呆郎閒撫沒絃琴不落宮商調更新架上木雞夜抱卵天明生下玉麒麟功金針玉線意幽玄用去拈來理事全兩岸蘆花翻野色一雙白鷺戲晴川共功擊碎重關海嶽沉今時劫外總非真長安路絶鴻音斷莫向虛空覓四垠功功五位王子生成睿智更殊倫瞬目開顏語出綸雖是天然身至貴須知更有一人尊誕生經綸腹內世難裁豈類當年覆御杯更有一雙調鼎手從來不假舊鹽梅朝生陋巷蓬門志愈勤五車覽盡語驚群不因窗下多年苦爭得鵬摶六合雲末生威權閫外任施為鐵額聞風也皺眉不動干戈沙界靜就中密令許誰知化生久隱深宮不出門等閒那肯混常倫欲知箇裏行藏處夜靜長廊挂月痕內生翠竹風敲弄晚絃巉嵒瀑布浪掀天箇中不必重饒舌落落圓音剎海宣妙唱不干舌死蛇草裏暗當途試問禪人見也無觸著依然腥氣發直教驀地喪全軀死蛇驚出草沉沉秋色暗疏林日暮寒江萬籟沉夜半一聲石虎嘯驚回潭底水龍吟解針枯骨吟鐵牛橫臥氣豪雄覿面堂堂不見蹤佛祖位中寧肯住至今到處舞西風鐵鋸舞三台三滲漏二月新林花正芳扁舟活計水雲鄉夜深不向蘆灣宿別有平湖照眼光見碧岫峰頭借問人白雲嵒下笑抽身相逢莫怪無知己只為而今家更貧情獨角泥牛夜出海木童背上跨將回一聲鐵笛和雲冷吹散江城五月梅語三墮類隨尊貴明月峰頭臥清溪岸上遊雖然蹄角共不與衆同流四五笙歌巷二三花柳街縱橫歷遍處曾不帶纖埃金殿莓苔古玉墀秋草盈煙霞隨玩賞到處不知名三種獅子未出窟時勢已昂等閒牙爪不輕張驀然觸著無回互大地生靈盡受殃出窟金猊迥異群縱橫無處不為尊一聲哮吼虛空外鐵怪銅精頓墮魂欲出未出太奇哉不動聲音震九垓那畔今時無覓處直教千聖也疑猜四轉位月鉤雲餌泛煙波釣罷滄浪返碧蘿風景寂寥剛夜半星移斗柄挂銀河轉功脫下珍衣著敝衫更深密步出長安多年忘卻來時道幾見春風度柳寒轉位權實縱橫一道施明來暗去絶參差白雲影裏青山動緑水光中碧漢移齊施生佛才云眼內塵勿勞開口較疏親藤枯樹倒無依倚挂角羺羊沒處尋俱隱三句秋風昨夜過園林吹綻黃花色似金石女天明輕摘去惹他蝴蝶暗飛尋平常無生蘭房化母展家風機杼頻投施巧工織就空花五色錦絲毫渾不墮青紅玄妙無私當臺寶鑑絶纖瑕歷歷分明驗正邪萬象森羅交互現騰今耀古迥無差體妙無盡三種功勳無影堂空鳥道沉寒嵒荒草不知春就中那屬陰陽管萬籟寥寥沒古今正位一色夜深玉鼠臥銀盤鶴立冰輪照影寒兩岸蘆花風翦碎江天萬里雪漫漫大功一色物物全彰最上機低眉早已涉離微風搖紅杏嬌堪挹露滴蒼梧翠欲飛今時一色四料揀禁院春深景愈榮新紅嫩緑舞輕盈箇中不是尋常處動著些兒禍便生奪人謾道江南景物鮮於今猶是孟春天遊人郊外閒尋遍那有新紅到眼邊奪境七星橫按氣豪殊孰敢當風問有無一劈渾教華嶽碎人亡馬喪血淋途俱奪賓主相逢意更深高山流水共知音忘機話盡樓頭月君向瀟湘我向秦俱不奪四賓主終朝孑孑走煙塵江北江南遍問津踏破芒鞋雙腳露何須向外苦因循賓中賓橫拈拄杖任逍遙十字街頭立錦標相見勿勞開狗口思量打折你驢腰賓中主通身手眼通身用格外提持辨作家若是藍田射虎客相逢且喫趙州茶主中賓獨坐巍峨眼界空全提正令振寰中其間那論凡和聖到此齊教立下風主中主四喝一喝金剛寶劍騰騰光徹霄漢箇中誰敢當頭觸著通身血濺一喝金毛踞地威獰迥絶回避多年古怪潛蹤萬里江湖倒沸一喝探竿影草勿用張良計巧若欲揚眉動睛教伊性命難保一喝不作喝用從來千聖難共燈籠夜半傷風露柱天明腦痛三玄要第一玄有無俱盡蠲黃面都盧觜維摩總默然第二玄機鋒似電旋才涉思惟處迢然萬八千第三玄臘盡又新年黃鶯枝上叫處處百花鮮第一要勿論玄與奧虛空被陸沉日月失光耀第二要棒喝俱齊到一點不來時髑髏遍地爆第三要長風鼓萬竅妙應總無私何曾有作造黃龍三關我手何似佛手試問君能識否拈來當下無情到處慣打瘋狗我腳何似驢腳東西南北寥廓縱饒千手大悲至今那曾摸著人人有箇生緣山僧怎敢瞞盰欲問攔腮便掌不會更與三拳仰山一十九門施設爐韝宏開手段高鉗錘不動火星拋直饒生就金剛體也要重新煆一遭垂示三昧龍吟虎嘯震山川風攪長空浪拍天大用縱橫無軌則忽驚蝦蟹入深淵問答互換夜深移履下瑤階暗把絲桐操一回韻出青霄非律呂應教師曠也疑猜性起無作竿木相將下碧層百花叢裏任縱橫轉身踏破澄潭月一片秋光萬派明緣起無礙拈來覿面絶思惟用去如飛孰可追蚊蚋腹中藏劫火蟭螟眼裏著須彌明機普互霧鎖青山路不通箇中別是一家風象王蹴踏誰能委狐兔才聞遠匿蹤暗合賓主沒孔鐵鎚直下拋髑髏喜識盡乾消花開鐵樹常春色翠葉無風影自搖三生不隔一莖舉起現全身大地純彰劫外春擬剔眉毛猶蹉過白雲萬里謾因循即約明真吹毛用處莫容情佛國魔宮一道平撒手歸來風月靜木童夜半奏新聲用了生緣灰頭短髮破䰐鬖聲色堆中任往還猶憶當年蜆子老神前推出酒臺盤就生顯法鑊湯爐炭正交加劍樹刀山亂似麻識得其中真快樂不妨隨處逞風奢冥府生緣千般施設總非親只要當人達本真寶所掀翻須轉步莫教海底起蓬塵三境順真借爾聊將展化門權披敝垢混同倫面皮翻轉無情謂直教渾家斷命根隨機識生一滴曹源遍九垓光含生佛體全該衆流截斷無多子萬派都歸者裏來印海收生機關捩轉別端倪暗裏抽筋若箇知非但天魔聞膽落直饒佛祖也攢眉密用靈機啐啄之風作者機電光石火爍難追任從舉鼎拔山力擬議將來失卻威啐啄同時左手拈錐右手鉤鉤錐在手用難酬收來放去全無礙放去收來總自由隨時收放一條楖栗活如龍頭角崢嶸氣象雄舒卷聖凡渾莫測至今變化更無窮卷舒無任十九門懸帝網重塵塵剎剎影圓融欲知仰嶠真消息開合全歸掌握中一多自在法華經序品第一赤腳波斯入大唐粧憨賣俏逞顛狂堪憐慈氏徒遭惑冷笑文殊暗著忙天雨四花成底事地搖六震太郎當爾時若有仙陀客打破傀儡作散場方便品第二潦倒瞿曇興不孤春光別貯一金壺空花且莫爭濃淡兔角徒勞較有無知覺圓明尤缺半見聞悟徹總名污何如野衲渾忘慮靜坐山窗聽鷓鴣譬喻品第三曲垂巧喻委相陳祇要當機薦處真步步白牛休外覓頭頭寶藏盡家珍聖凡垢淨機方契父子情忘意始親擊碎絲桐別轉調一腔風月劫前春信解品第四承言早已涉離微何必重重話是非回首明珠元不失轉身他國自相違春風撲破桃花面夜雨傾翻荷葉衣縱與箇中全會得須知更有祖師機藥草喻品第五本分鉗鎚覿面施管教當下絶狐疑隔江便去猶為鈍掩耳先行已是遲二木分時眸著屑三根論處路多岐那堪更欲資談柄笑殺東村王老兒授記品第六祖翁田地舊皇都且莫從人向外圖空劫國名何處起威音佛號是誰呼溪山在在雖云異雲月家家豈有殊寧可無鞋赤腳走丈夫怎肯受糊塗化城喻品第七墨劫分明只目今擬思量處隔遙岑化城歷過須前進寶所掀翻更別尋石女能擎無底鉢木童慣弄沒絃琴長安雖好君休戀物外風清月滿林五百弟子受記品第八渠無國土謾相呈記莂由來亦妄名衣裏明珠誰不有臺邊古鏡自分明花拈鷲嶺淆訛出法到曹溪攪擾生趁入溈山水牯隊拖犁拽杷任縱橫授學無學人記品第九慶喜殷勤請舉揚世尊覿面不囊藏一瓢惡水驀頭潑兩眼空花遍界狂鼓浪金鱗多變化輾沙跛鱉亂承當白衣拜相奚為貴野老門前歌未央法師品第十滯貨多年不值錢無端亂撒向人前偈時那待臨穿井觸著方知便是泉雨過幽林山翠溼風翻野岸浪花鮮縱饒會得分明去猶隔迢迢萬八千見寶塔品第十一從空涌出太奇哉端的唯憑一指開移土他方情未已還身此界體全該星衡那許容毫髮藻鑑分明絶點埃正眼看來成底事堪憐平地起孤堆提婆達多品第十二大用無拘體絶倫於中切忌妄疏親驢胎馬腹隨遊戲地獄天堂好寄身十聖聞時猶喪膽二乘見處亦傷神機關撥轉憑誰手疑殺閻浮幾許人持品第十三如來慧命任非輕俯就機宜與麼行劣相殊形皆幻色鼠肝蟲臂總虛名罽賓已受揮鋒讖嵩嶽親聆裂石聲為法求人能有幾況茲叔世難多生安樂行品第十四證道非難弘道難道弘無恙可為安堅持四法環中照始獲一珠頂上看柳巷花街隨步舞樓臺歌館且盤桓飛塵滿目何曾染笑傲春風入燒瘢從地涌出品第十五從門入者豈家珍爭似胸中流出親衆愈恆沙超數量座克法界絶言論波心明月誰能捉鏡裏金烏謾可陳叵耐東君輕漏泄曉風吹綻滿園春如來壽量品第十六倒腹傾腸忍不禁堪憐忒煞老婆心虛空漫把分邊際大海徒勞較淺深夜半木雞啼月冷天明石犬吠花陰舌頭坐斷忘言路一片冰壺自古今分別功德品第十七別露生涯展化門暫相投處敘寒溫磻溪直釣心非餌任氏垂竿意在鯤兩岸蘆花天正曉一江明月碧無痕滄浪歌罷歸來晚梳雨斜風度遠村隨喜功德品第十八堪哂叨叨阿逸多瞿曇答處亦須訶擬將一字留心地唯恐千生作障魔月滿真如搖岸柳風翻般若響庭柯虛空無耳時常聽功德於今較幾何法師功德品第十九解義依經即佛冤離經亦復是魔言如能一念知端的始徹六根見本源芥納須彌層岌岌毛吞巨海浪翻翻葛藤截斷千差隱折角泥牛出故園常不輕菩薩品第二十喫水何須用捺牛唯人曰肯乃方休珍呈楚國遭刑憲珠獻隋庭按劍投拋卻雲門乾矢橛枯來洞老死貓頭縱饒碧眼難分辨千古令人價莫酬如來神力品第二十一騰騰運用本如然觸處靈通不假宣箇箇腳跟皆點地人人鼻孔自撩天雲凝大野忘回互雪覆層巒絶正偏今日分明重指注相逢且莫亂流傳囑纍品第二十二求人落草話匆匆盡把家私徹底空就父轉身方是孝輔君退位始為忠夜明簾外音回早古鏡堂前路別通纍及兒孫何日了波濤遍界鼓春風藥王菩薩本事品第二十三宿王大士啓前因只欲時人悟本真喜見焚身煙未息神光斷臂血尤新曉風度水頻敲戶夜雨穿雲遠叩津舉目無非求道者不知誰是報恩人妙音菩薩品第二十四遊遍山高與水深相逢彈指幾知心煙明花笑真三昧犬吠驢號不二音意外擬將生一念目前早已隔千岑分明日用頭頭事多少隨流被境沉觀世音菩薩普門品第二十五普門境界妙難窮觸處逢源那滯功三十二形隨類現百千億相任機通無心恰似春回谷有意還如月印空正與麼時堪喫棒由來箇裏不同風陀羅尼品第二十六咨詢為衆廣傳持拋出陳年一古錐觸著應須頭腦裂覷時只教眼睛眵釋迦挈挈尤難會彌勒惺惺怎得知可惜韓盧逐塊者至今尚自苦奔馳妙莊嚴王本事品第二十七鬼面神頭見未耶妙嚴睹影眼生花念興自是分妍醜機泯誰能驗正邪轉步南辰空挂劍藏身北斗謾浮槎知音不在頻頻舉千古風流出當家普賢菩薩勸發品第二十八最後因緣仗普賢還憑密護果方圓一心不動群魔隱四法才持萬慮蠲步步目前乘白象行行舌上吐青蓮欲知向上通霄路拋卻筌蹄意始玄總頌併來武庫盡銷鎔陳後何勞更犯鋒海嶽躍翻休覓跡聖凡抹殺謾留蹤夜深古殿銀缸滅秋老荒階玉露濃萬籟沉沉誰辨的一輪皓月照孤峰德溥張應宿張龍程良德敬刻百老和尚語録第十六卷
