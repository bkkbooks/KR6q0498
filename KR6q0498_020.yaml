body:
  text: 住國山善權寺嗣法門人智操住京兆薦福寺嗣法門人智覺編次佛事挂鐘板佛祖家風迥出權衡之外人天號令全憑掌握之中有時動地震山搖有時靜海晏河清只如不動不靜如何施設擊鐘板云恆為選佛場中主箇箇心空及第歸挂鐘板叢林矩矱列聖規模狂象以之而牢籠獰龍以之而關鎖一動一靜佛祖莫知一放一收人天罔測今挂隆福堂中又作麼生一擊當陽全正令十方聞處悟圓通掃雲門湛祖塔昔年未睹師翁面今日歸來無可酬自恨一身貧徹骨聊將矢橛當珍饈是以二十年前祖禰不了殃及兒孫二十年後兒孫不了殃及祖禰到者裏悲歡莫辨恩怨難分只得撮土為香以笑作哭且道師翁今日還來受供也無陋巷不騎金色馬回途卻著破藍衫掃雲門湛祖塔松竹森森煙雲疊疊山色亦非清淨身溪聲不是廣長舌既然離卻聲色大衆又向甚麼處見先師翁面貌拈香云一片栴檀海底焚金雞啄碎珊瑚月掃辨山瑞老和尚塔臨風回憶昔年事幾度親遭喪膽魂絶後蘇來空懊惱恩冤數載未曾分今日此舉且道是雪冤耶報恩耶良久云珊瑚枕上兩行淚半是思君半恨君開山瑞老和尚忌日環目雲山無非先師面孔穿林溪澗總是老婆心腸去世九載而為人愈切不覺至今而觸處難忘大衆且道難忘箇甚麼拈香云不敢逢人輕舉似年年此日一爐香掃久默和尚塔昔年相識不相見今日相見不相識六年心事有誰知無縫塔前露消息且道是甚麼消息滿山松柏影蒼蒼盡是吾兄親手植久默和尚十周而瘦豈無茶飯致鬢霜還有法門愁古風行得些兒去不愜時人意也休大衆此是先兄久和尚十年前為人的面目脫或未見更為指出拈香云芍藥花開菩薩面棕櫚葉長夜叉頭掃龍山和尚塔稜層石塔蘚苔肥夜雨和煙度翠微欲識龍山真面目落花流水兩依依衍慶石鼓和尚訃至忽爾黑風翻海岸吹折華林一枝幹人天失怙痛無依叵耐中流砥柱斷珍重諸人緊著鞭光陰莫把等間玩瞥然㘞地一聲時大事分明須了辦薦不薦剔起眉毛仔細看大衆還知衍慶和尚落處麼兩岸蘆花展舊容一湖秋水澄新練疏菴和尚木主入祖堂雲散銀河靜秋高玉露多一輪淮地月光透鑑河波惟疏菴和尚法門砥柱祖苑光幢始喫跌於萬竹林中披褐懷玉匿迹同塵或舒光發焰叱電驅雷後結果於七峰寺裏桂子飄香於雪谷玉兔藏影於冰盤雖然只如轉功就位又作麼生公孫父子團圞坐共笑優曇遍地開次賢法主封龕松濤落落夜寒而木馬嘶風山色沉沉天曉而泥牛耕月卷舒不落朕兆來去那覓行蹤惟次賢法主講肆義虎法苑神駒落拓無羈掀翻良遂翁之鼻孔瀟疏自適拈卻太原孚之鼓聲方期慧日長懸何意慈音遽寂所謂樹高千丈葉落歸根今而後大衆又向甚處相見竹依依雲靄靄落花流水曾無礙獨坐長吟修雅歌夜深明月來窗外入塔細而無內大而無外撥之不開摶不成塊皎月無以喻其明冰霜難以同其類此是法主半世清操磨而不磷一具黃金骨到此也不得寶惜直須盡情放下始得入骨云無影林中隨放曠夜深長嘯月明前蘭山葦渡大師訃至前月曾將今月期我來不意君先往雖云來往任翛然特地令人生渴仰休渴仰絶思想一團明月上花梢明暗雙雙誰共賞葦渡大師來也大衆見麼以手捶胸云蒼天蒼天嗚呼尚饗深山嘯雲和尚訃至指靈位云此是我嘯雲和尚把斷要津不通凡聖最後為人一著子今日當陽露布了也儻不見不知再與注破智燈沉法棟折人天哀慕波旬悅如來慧命若懸絲只要諸人親了徹徹未徹春林夜夜子規啼淚染山花遍地血金仙蕃光和尚訃至祖庭秋晚雁影空沉末運澆漓花梢月沒苦海茫茫兮孰作濟川之舟長夜冥冥兮若為光明之燭獅蟲交互而相食野干晝行而躑躅實法門之不祥乃蒼生之薄福猗歟哀哉君何遽逝誰息我黥誰補我劓山川為之改容草木為之流涕幸有肖子克紹箕裘頭角森森而拔萃羽翼濟濟而絶儔夫既如是吾復何憂聊設蘋藻以代珍饈大衆且道伊還肯納受也未石湖三月鶯花市滿載笙歌逐水流木主安位日出連山天曉陰晦月圓當戶夜半正明祇如不居正偏迥超明暗的人來如何安置佛祖位中留不住紫羅帳裏且盤桓清一徹禪師封龕霧鎖千峰暗天空斗柄垂三更月落後霜冷雁聲悲唯我清一法姪一生鯁潔半世高韜惟期匿迹藏形不欲舒光耀彩遠追杉菴之遺烈實有煨芋之餘香目視雲霄佛祖推之不出因行掉臂人天挽之難回越山增悽慘之色耶水添哽咽之聲雖然更有末梢為人一句又作麼生夜半曦輪當戶照珠簾倒挂影玲瓏入塔影疊疊兮非昔非今碧重重兮無成無壞星月繞兮經千古而彌新煙霞生兮歷百劫而常在此是我徹姪最後為人處今日全身獨露大衆見麼掩塔云梅梢月上恰三更嶺外風生號萬籟道和穆禪師設供雲寒山蹙額凍斷溪聲咽夜靜老猿啼令人添慘切兄弟們瞥未瞥正是魔強法弱時參天玉筍風吹折唯我道和法姪乃龍塘遠兄之子遠兄一世殷勤半生克苦纂諸祖未纂之鴻庥續五燈未續之烈焰嗟乎時澆世濁無奈玉石遭焚幸穆姪涉危冒險為法忘軀越梁魏走少林以繼其志可謂父纘子述真克家肖子法苑功臣不期月明簾外半途抽身古鏡臺前別行一路大衆還知我穆姪去處麼金鳳不棲無影樹紅輪怎肯墜澄潭西凡禪師木主安位楚天空闊月光輝鑑水澄渟鳥不飛截斷千差無異路回途木馬踏雲歸此是西凡覺姪屢經爐韛久受鉗錘金粟擊碎疑團靈峰拽脫鼻孔自爾解作活計別立生涯擲釣鉤於黃梅山上收因果於孝宣寺中正如片月行空來去渾無凝滯春秋在樹往還那覓形蹤到此已忘彼此不立正偏又如何安置遞代相傳無底鉢不萌枝上玉花開履元乾禪師火華頂風高鶴夢驚遠峰木落曉霜清石鯨吸盡滄溟水突出青天天外行此是我乾姪始受心印於護國屢登猊座於洞庭眉帶七十二峰青纖塵不染襟藏三萬六千頃滴水無遺誠法門之赤幟為祖域之長城何乃驀地回途而別行一路遽然撒手而直入千峰龍象難留人天莫挽直使雲山蹙額草木失顏木童因爾興悲石女以之殞涕然猶未是他長處大衆要見他長處麼兔角挑開大火聚層層烈焰現優曇入塔不居正也不居偏凡聖和融觸處圓別有風光彌宇宙三更那借夜明簾靈澤維那火栽樹望成陰養兒為待老我今尚未衰子去因何早哀哀哀復誰曉草木含悲生懊惱撒手急須歸去來克賓公案要渠了入塔赤灑灑淨裸裸提起也宛轉玲瓏放下也連環鉤鎖有時包裹虛空有時虛空包裹無在不在無可不可澤維那澤維那更深不借夜明簾照徹山河千萬朵真參火二月煙凝柳乍肥鶯啼花笑弄真機此時處處風光媚正好飄然撒手歸撒手到家須自委分明不必更擬議掀翻薉土與蓮邦間看青山浮緑水入塔迥絶中邊了無廣狹一而恆殊混而不雜勿勞更覓真參須知心外無法提骨云且道者箇喚作甚麼入骨云劄圓攝知客火將謂我孤汝卻是汝負我若得不孤負還須者把火咄曉風吹散白雲天露出青山千萬朵九嶷火梅香日冷無非觸目菩提霜落烏啼盡是當人境界只饒脫體承當全身擔荷猶欠一著在且道是那一著火光三昧須親證透出威音那畔行入塔九嶷公真撇脫去住翛然離把捉多年行腳纍芒鞋今日藏身於辨嶽休動著萬古長空雲漠漠眴目火我有一機瞬目視伊若還不薦更為重提咄直須照顧兩莖眉入塔九蓮臺畔不許安身五濁界中那容措足正恁麼時忽遇一陳卒風暴雨眴目你向甚處回避若回避不及山僧有箇方便入骨云者裏恰好徹先禪德火打徹牢關了無先後更有者重還須親透擲炬云天外白雲任去來松梢明月只仍舊玉笥火涅槃生死鏡中花劣相殊形空裏電坐斷千差絶去來東西無路且休戀玉禪人急須薦我今為汝通一線箇裏翻身看是誰金毛百億毫端現瞿宗火生死若浮漚涅槃亦夢幻漚夢總非真二俱不可戀宗禪人看轉變回途木馬不須鞭蕩蕩無依鳥道玄天壁火風飄飄雨浙浙帶水拖泥送天壁丙丁童子顯神通擲炬云八臂那吒追莫及雪林火一靈妙體絶追尋塵不染兮物不侵歷劫分明常自在迥然坐斷去來今只者是謾沉吟看取紅爐飛片雪金烏子夜照高林圓通火生則畢竟生死則實不死透過兩重關始知無彼此無彼此休擬議目前無物不圓通焰裏優曇結玉蕊舉火盡知禪德別有機籌善知時節去住自由雖然祇如末後一句你作麼生會擲炬云不肯隨人度舊歲翻身極樂逞風流舉火正念正念且喜了辦在日挈挈波波去時快快便便靜處急須走過鬧處亦莫留戀祇如靜鬧兩忘又作麼生擲炬云大火聚中看轉變德一火斫盡青山額縛雲肩上還驀然撒手處功業兩俱全只如功忘業罷復歸何所烈焰光中辭舊歲金蓮臺上度新年慈中火全身與麼來白雲流水任徘徊全身與麼去明月清風常顯露去來渾不涉關津滿目煙光絶點塵燒卻無明皮袋子嵒頭花發劫前春舉火嵩野嵩野言行非假汝惠我箇黃庭我贈汝箇火把且道者火把有甚麼用處赫赫無情劈面來風光遍界任瀟灑值牲融哲火緊把繩頭不犯他人苗稼牢牽鼻孔從教隨分納些溪東溪西往還自在山前山後水草無拘其放也清風四蹄其收也明月兩角日久不覺變作箇孤迥迥的露地白牛趁亦不去融哲禪客可謂真牧牛矣只如今日繩頭斷鼻孔穿你又牧箇甚麼者裏直須親透過百千剎海一毛吞預修火踏遍江湖走破鞋始朝南嶽又天台袈裟碎把煙雲補拄杖橫挑日月回截斷溪聲頻嘯傲踢翻鳥道絶塵埃正眼看來猶是程途邊事只如不涉程途又作麼生數聲鐵笛秋江外黃葉西風撩亂堆隱明火風瑟瑟草蕭蕭萬木秋聲葉亂飄與汝脫卻娘生褲得逍遙處好逍遙最初句即不問你如何是末後一著擲炬云燒從慧火楚山歷盡到江南為問福城五十三勝熱婆羅親指示現成句子不須參瑞雪渾成銀世界紅爐焰裏綻優曇舉火盤谷盤谷聽我叮囑三千里外而來來者阿誰一剎那間而去去者何物了知無去無來豈礙任出任沒今時那畔本自逍遙薉土蓮邦有何拘束雖然祇如凡聖兩忘東西俱泯你又向甚處安身擲炬云雨洗蓼花兩岸紅月澄秋水一江緑如意入塔落葉黃秋水緑盡是當人舊面目亙古亙今絶覆藏勿勞向外更馳逐如禪人你還識得者舊面目麼髑髏裏面好風光夜靜龍吟海底水難勝入塔勢嵯峨離向背無限輪鎚擊不碎難勝尼會不會皓月輕搖緑水寒白雲飛去青山在正心入塔四面絶壁落中間亦無門日月照不到別是一乾坤正心尼你道是箇甚麼乾坤了知心外元無法滿目青山不是塵心蓮耆德入塔門門一切境雪壓青松冷回互不回互雲綻峰頭露回而更相涉螺螄吞皓月不爾依位住金雞啼玉樹雖然只如者箇又向甚麼處著入骨云無縫塔中頻嘯傲不萌枝上辨春秋完心玉宗入塔本自完全了無欠缺硬似綿團軟似生鐵嵐風吹不搖劫火焚不熱非修證之可成豈心識之所測二禪客我今為汝重饒舌入骨云不須此外覓根源流水松風無畏説入塔廣莫廣莫羡爾撇脫打徹牢關掀翻海嶽聖見凡情一時拋卻須識其中更有一著你道是那一著入骨云寒暑莫能侵瀟然任灑落圓覺尼入塔毗嵐雖惡撼之而莫搖劫火雖熱燒之而不著不與凡聖同居超然古今獨脫莫狐疑須領略我今為汝都拋卻擲骨云湖水澄瑩似鏡明秋空萬里大圓覺智康尼入塔風吹不入雨灑不溼亙古今而長存歷塵劫而獨立智康尼須委悉入骨云凍開碧澗響潺潺霧鎖巉嵒層岌岌日輪入塔者箇上座生平操履與人不同煉成一塊並作一團堅似金剛而不壞瑩若白玉而無瑕仔細看來猶有些渣滓在山僧今日為汝一齊揚卻始獲箇安樂法門入骨云珍重珍重靈鑑入塔其來也萬象莫能逃其影其去也一塵無以留其質用而虛寂而照真可謂靈鑑者也只如拈卻照用不涉離微又作麼生鑑提骨云只者箇一點瞞他不得入塔寂光土裏了無聖凡之殊無縫塔中奚有男女之別可謂身外無餘身心一如成禮你還知身心一如麼入骨云春園繡遍花如錦不假金針玉線功松濤入塔通身脫盡沒絲毫豈著娘生舊布袍坐斷煙霞無背面從今休戀楚山高坐斷後又如何雙耳曉開觀碧漢兩眸夜靜聽松濤六亡僧入塔鹿野苑中五比丘而證真常龍華會裏六禪人而入寂滅入寂滅者無殊真常之道證真常者奚異寂滅之理祇饒真寂不立人法銷鎔猶有者箇在且道者箇作麼安置入骨云無縫塔中間歲月團圞聚首話無生源朴入塔萬派窮而流自還源千差泯而理應返朴踢翻化城方堪進步拈轉寶所始可忘功只如前後截斷中間不立源朴你又向甚麼處安身擲骨云薰風影裏春初去流水聲中月乍還入塔金風颯颯玉露飄飄雲散千峰氣象高無縫塔好逍遙夜半木人剛轉側玄關金鎖手慵敲入塔透出光明藏迥絶纖塵打開解脫門莫留朕迹不可以色見安可以聲求秋風吹斷浮雲夢放出青山萬朵蓮入塔其生也不因三緣和合而成其滅也不為四大離散而壞本無來去安有內外煆之愈精煉之成塊念禪人會不會入骨云碧苕波底月團團蒼辨峰頭雲靄靄入塔泥牛穿海底石虎嘯風前涅槃與生死二俱莫留連箇中會得安身法石上頻開上品蓮彌綸聖圓入塔彌滿清淨綸貫十虛聖凡兩忘圓融不二出入不居於陰界動靜那涉於衆緣既然如是為何又落在山僧手裏類之弗齊混則知處入塔鍊得通身絶瑕玲瓏了無比況雖然脫盡根塵看來猶未穩當法乳禪德還知穩當處麼入骨云無影林中任放曠入塔幻影滅兮五障銷浮雲散兮一真露無男女之別任去來泯聖凡之號何迷悟德倫優婆夷聽我親分付無陰陽地不同春火內優曇香遍布入塔春雨濛濛山色麗春風蕩蕩鳥聲碎就中端的絶囊藏勿用別尋安養地寶成入塔由來至寶甚分明任運頭頭總現成徹底掀翻無盡藏從今放下一身輕急薦取更叮嚀不須向外覓無生若耶溪畔春風早細聽黃鸝織柳聲慧曇入塔藏身處無蹤迹千眼大悲不可覓無蹤迹處莫藏身脫韁木馬正遊春曇禪德薦也無更聽重重唱鷓鴣昨宵玉女笛三弄吹落梅花滿鑑湖水生尼入塔靈木異凡叢生自本條直幼小脫塵埃兼秉聞慧力知幻與離幻非二亦非一覷破有漏身撒手歸蓮宅迥然了無依唯有此真實入骨云秋風落葉天大地黃金國入塔寂寥非內寬闊非外劫火洞然者箇不壞舉骨云信之信之你道者箇是壞的是不壞的入骨云從茲放下萬緣空無相光中常自在密音入塔白雲自異流水自深桂輪如鏡松風似琴觸目無非般若經耳總是密音截斷千差兮了無背向渾融一致兮不落古今且如何是不落古今一句無影林中間歲月泥猿夜半嘯孤岑黃見山居士入塔見山是山見水是水處處相逢無不是你只如山崩水竭你又見箇甚麼入骨云山頂蓮開十丈蕊嚴土禪德入塔四大本空白雲飛而青山露五蘊非有秋風起而梧葉飄脫盡廉纖迥絶染污非情識之可到豈根境之能容嚴土禪德只如者箇你又作麼生湊泊入骨云萬派聲歸海上消一光入塔一道常光了無向背內脫根塵外遺世界在凡而凡不知在聖而聖不會箇中別有一般春石上蓮開香復媚慧勤隱明入塔慧勤公隱禪德來不同途去共一轍白雲嵒下且莫貪眠流水聲中聽演妙訣且道是甚麼妙訣無言童子為爾説入塔遍明遍明為爾相呈勿勞修證本自圓成孤孤卓卓疊疊層層無背無面非色非聲舉骨云且道者箇喚作甚麼乾坤就裏別水底剔金燈映虛法真入塔旭日流金風光匝地霜花爆蕊妙用全彰於斯會得蚊蚋踏翻四大海若也不會蟭螟觸倒五須彌會與不會拈向一邊映虛法真二禪德畢竟是何意旨入骨云放下著入塔卓午金星懸越嶺三更紅日落耶溪箇般境界天然異描不成兮畫不齊慈容禪德你還識者箇境界麼入骨云流水光中石犬吠落霞影裏木雞啼入塔雲生不離山漚滅還同水生滅本無蹤皆從妄念起識得妄元空究竟歸者裏起元禪德你道者裏是甚麼所在入骨云枯木裏龍吟萬如入塔離背離觸非實非虛隨方自在任性無拘煩惱與菩提不二生死與涅槃奚殊急領略莫躊蹰從此萬緣俱放下管教徹體自如如入塔千差截斷撒手於紅爐焰中一念無私藏身於寂寞界裏絶見離聞超然獨露彌今亙古卓爾全彰道融你還知者裏受用麼花開花落渾間事雲去雲來只在山德元入塔雨過草生香月明山更悄此處好安身何須向外討德元會麼寒暑莫能侵八風吹不倒入塔曉霧溼梨花春風吹柳絮會得目前機即此安身處自誠你還識安身處麼入骨云試看大千俱壞時巍然只箇常堅固百愚斯大禪師塔志銘銘碑高六裁尺闊三尺分二十六行每行六十四字盍聞拈花枝葉派演兒孫豎草因緣光彌震旦天每欲耀一代知覺於光明必生一人焉主持慧燈敷施靈焰自大鑒照徹天下而後五宗並峙法席於海內雖盛衰不同歷唐宋同斯文於未墜我百愚大師乃洞上嫡傳正宗主也師法諱淨斯別號百愚姓谷氏生於河南南陽之桐柏幼見繪畫佛像輒下拜母夫人常曰是殆一比丘乎十歲聞鄰家哭問哭何事曰哭死師云人孰無死我亦有死將如何或曰學長生乃不死師遂有方外志矣十三業儒十九娶婦忽決志離家室題詩以謝其堂上飄然隨所之至鄧州東寺見老僧螺髮有異相曰將往終南師隨之至道林寺老僧曰是子剃髮地矣師遂禮寺僧應宗具出家相老僧終不言姓名而別時為庚午歲年二十一矣居寺中作務如常僧獨禮誦不倦然不知有向上事一日有僧自南方來問師在此何為師云為生死出家耳僧曰如此那能了生死南方有宗門一路急往尋之師遂勇決而行出山陟九華渡南海歷閩越辛未冬圓具報國寺習毗尼期年無所得聞辨山瑞白雪和尚宗風大振乃往白雀參之初見機詘痛自振勵又歷天童遊秣陵已而曰吾機緣終在辨山也時辨山隱崆洞相見問如何是未生前面目山便棒師云除卻棒又作麼生山曰日落西山近師禮謝一日上方丈未開口便棒行數步喚米頭師回首山曰是甚麼師遂豁然有省一日聞山激勵乃糾伴打七第三日聞報鐘聲師遂將疑滯盡入琉璃矣山知之乃問曰如何是你主人公師云有眼不見有耳不聞山曰只恁麼便是耶師云正要和尚疑著山笑歸室隨充執事越兩年為歲庚辰山應建安王百丈之請問佛殿簷前為何墮落一花師云詩向梅中得琴從月下彈野狐既脫皮毛因甚虛名千古不昧師云敲空有響擊木無聲冬間日色為何寒冷師云大雄峰高山曰此子有大人之作辛巳三月喚入室付杖拂源流師時年三十二逮山化去守龕後乃掩關楊湖甲申住青龍隆福寺丙戌住嘉定昭慶寺己丑住辨山龍華寺壬辰住越州大能仁寺丙申住雲門顯聖寺庚子住皋亭佛日寺壬寅住國山善權寺癸卯住維揚善慶菴海內卓錫知識如麻粟誰乏因緣師則卓然恬然不事攀援每主法席必士大夫敦禮再拜而始應每至一剎大衆戀如慈母凡所至地數千衲子而糗糧自充師名振珠林人望之如山斗憶其人當魁梧崖岸高自標榜嚴霜絶巘不示人攀躋路師則和藹必委曲慰所懷來到喝斷衆流時又復一絲不漏宗師之刻苦以誨人者惟師獨也余觀操公稱師出世二十餘年提唱宗風機辨縱橫深拶鉗錘無問飽參顯貴周金剛秀鐵面之孤風也傳舍殿堂翛然一衲不驚榮辱利養芙蓉楷黃龍心之芳規也隨機説法適興揮毫不落語言神思洪覺範明教嵩之妙用也法幢所賁即成寶坊辦真實心行真實行悟真實道説真實法化真實衆一動一靜無事而非真實法門大矣哉一切衆生中之平等寂滅光明幢也操公師之嫡嗣其言足徵師嘗謂豫曰萬物有萬物之性順其性性乃歸萬物有萬物之情印其情情乃愜夫宗門本孤高而師特出之以坦易洞上門庭本綿密而師又出之以奇特所謂無性不歸無情不得也師忽於乙巳八月遣僧報豫曰和尚將別盡散衣鉢越數日上堂辭衆翌晨書偈擲筆而逝頂暖徹日夜有漁翁不向蘆灣宿之句為其別刻以傳師生萬曆庚戌五月草一寅時終康熙乙巳八月草八卯時世壽五十六僧臘三十五語録草卷詩集四卷得法四十二人其上首寒松操北冥湛紫谷覺圓攝遍鹵菴鼎等適侍師而襄大事操作狀屬豫以志師遺命塔善權是冬歸厝澗左衆延操公繼其席請茶毗獲舍利不可勝數鎖子靈骨五色斕斑齒牙目睛全如故建塔寺東北萬松嶺後坤山艮向乃為銘銘曰曹溪一滴酌古流今一花衍蒂大樹垂陰靈育嵩高篤生英傑攀璨提能吞川喝月不著槽廠未斷芒鞋披荊蒙棘踏破川崖忽遇辨山根甜瓜熟入室三更如蜂得蜜出林猛虎摩空俊雕百獸率避片雲共飄卓錫白椎膺荷大事一口西江如如了義海邊龍象石上楩楠盡歸陶冶曲受雕刊得髓得骨如雨如雲鱗依羽附鳳起虯興晚節廣陵得末後句去來日月寺即不住茶毗舍利燦若珠繁不淄不磷萬古長存是善權峰即星宿海上摩斗垣心驚目駭大機大智全體全用無位真人塔歸無縫前進士出身通議大夫詹事府協理府事少詹事兼翰林院侍讀學士加一級龍眠法弟子方拱乾頓首拜撰報國寺普達備資敬刻百老和尚語録第二十卷
