front:
  text: 百愚斯禪師説法之圖師諱淨斯號百愚南陽桐柏谷氏子生萬曆庚戌草一脫白明年圓具參瑞白雪老人聞鐘聲大悟記莂時年已四八矣後五載開法疁之昭慶壬寅主善權升維揚之善慶乙巳中秋盡散衣鉢越旬二日上堂辭衆翌晨書偈擲筆而逝頂暖徹日夜壽元七八臘終五七嗣法四十有二遺命塔造善權茶毗獲大小舍利不可勝數鎖子靈骨五色斕斑齒牙目睛全如故辛亥建塔寺東北萬松嶺後坤艮向銘為方學士拱乾所撰乙卯築禮菴守護塔左八坐名藍九會説法語録草卷梓送楞嚴隨藏流通門人智操拜記百愚斯禪師語録序一千七百則之先有公案否前此矣前此則何以一千七百則獨傳發端焉耳發端則有廣之者矣諸家語録是也語録者語言文字之屬也前此舉語言文字而掃之矣以為佛法之障也繼此可得而掃之否曰存之則語言文字為佛法之障掃之則佛法又為語言文字之障矣然而掃與存果何居則貴乎其人焉爾其人存則其政舉語言文字皆神奇也其人亡則其政熄語言文字皆臭腐也以臭腐之語而出於佛祖之口則佛祖之矣以神奇之句而出於野狐之口則野狐之矣吾故曰貴乎其人也然而其人則難言之矣求其人於佛法之季則益難之矣吾則以仰百愚大師足以當之大師開悟最早操履至醇譬之帷燈匣劍其光鍔以韜斂為奇及其苦心為人而寶珠肆應全體大用有不可得而掩者其嗣存焉睿公以語録見示余曰吾將求大師之人則大師之語言文字舉此矣夫大師之人諸方所共仰或以為泰山喬嶽或以為威鳳祥麟或以為光風霽月或以為烈日秋霜而要其感人以誠遇物以恕律己以孤峻處事以平等不離真實者近是經云惟此一真實餘二則非真以大師之實求大師之人以云傳也以大師之人存大師之語言文字以云救也山陰雲隱弟子祁熊佳頓首拜題百愚斯禪師語録序禪師俗姓谷氏河南南陽桐柏縣人自出世後以向上鉗錘學者凡八主道場始暢於昭慶圓寂於善慶建塔於善權善權者吾邑溪山最勝處歷代祖師仙靈窟宅也先是邑中蔣晦齋先生以宰官為釋氏護法念茲山自洊更兵燹來榛莽之所叢生獾豕之所嗥嘯法席非得人不可於是不徇名不懾勢特迎師主是山師至則攘幽剔薉復故拓新寺大治繼師者即師法嗣寒松公公神明警秀威音肅然其語録詩文亦久為世重師沒後寒公手輯其語録為二十餘卷藏寺中寒公嘗為余言師為人清沖簡劭是支道林竺法深一流人及讀龍眠先生所為師塔銘條分縷柝寒公之言益信既又讀師語録龍駒蹙踏天馬脫羈時而説法熾然時而拈花微笑竊歎自一花五葉以還青原南嶽而下提唱兼行然未有颯爽森張單提直入如禪師之踸踸者也則吾於寒公之言益大信噫吾見今之執拂而踞上座者矣其上者剽竊古德傳燈單文隻字支離撏扯嚼蠟捕風輒揚揚然詡於人曰我某宗嫡傳也是與王謝家不慧子弟專以門閲上人者何異甚或牽綴權勢憑藉貴遊攫人之田廬而魚肉之猶曰我為祖塔司糞除也五宗嚴支派也識與不識無不從而嘔噦之聞禪師之風亦庶幾自愧矣余涉秋行國山道中憩善權寺門松巷屈指疇昔則禪師既寂晦齋繼歾即寒公亦席不暇暖他徙問其寺則已為豪有力者主之矣驚飆所及林無靜柯俯仰之間能無慨然於中乎因至師塔下汲澗水一盂而飲之風霜刻轢泉香而石瘦則猶能想見師之為人荊溪法弟子陳維嵩頓首謹拜撰百愚斯禪師語録目次像傳序文第一卷住嘉定古昭慶禪寺語録第二卷住雲間青龍隆福寺語録第三卷住湖州辨山龍華寺語録第四卷住湖州辨山龍華寺語録第五卷載住青龍隆福禪寺語録第六卷載住青龍隆福禪寺語録第七卷住越州大能仁禪寺語録第八卷住越州雲門顯聖寺語録第九卷住越州雲門顯聖寺語録第十卷住杭州皋亭佛日寺語録第十一卷住宜興國山善權寺語録第十二卷住維揚江都善慶院語録第十三卷示衆小參第十四卷晚參第十五卷普説拈古第十六卷頌古第十七卷源流頌經旨頌第十八卷機緣問答垂問垂代法語題贊第十九卷書復雜著第二十卷佛事塔銘蔓堂集附四卷六十四葉
