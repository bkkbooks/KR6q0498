front:
  text: 百愚斯禪師說法之圖師諱淨斯號百愚南陽桐柏谷氏子生萬曆庚戌廿一脫白明年圓具參瑞白雪老人聞鐘聲大悟記莂時年已四八矣後五載開法疁之昭慶壬寅主善權陞維揚之善慶乙巳中秋盡散衣缽越旬二日上堂辭眾翌晨書偈擲筆而逝頂煖徹日夜壽元七八臘終五七嗣法四十有二遺命塔造善權茶毘獲大小舍利不可勝數鎖子靈骨五色斕斑齒牙目睛全如故辛亥建塔寺東北萬松嶺後坤艮向銘為方學士拱乾所撰乙卯築禮菴守護塔左八坐名藍九會說法語錄廿卷梓送楞嚴隨藏流通門人智操拜記百愚斯禪師語錄序一千七百則之先有公案否前此矣前此則何以一千七百則獨傳發端焉耳發端則有廣之者矣諸家語錄是也語錄者語言文字之屬也前此舉語言文字而掃之矣以為佛法之障也繼此可得而掃之否曰存之則語言文字為佛法之障掃之則佛法又為語言文字之障矣然而掃與存果何居則貴乎其人焉爾其人存則其政舉語言文字皆神奇也其人亡則其政熄語言文字皆臭腐也以臭腐之語而出於佛祖之口則佛祖之矣以神奇之句而出於野狐之口則野狐之矣吾故曰貴乎其人也然而其人則難言之矣求其人於佛法之季則益難之矣吾則以仰百愚大師足以當之大師開悟最早操履至醇譬之帷燈匣劍其光鍔以韜斂為奇及其苦心為人而寶珠肆應全體大用有不可得而掩者其嗣存焉睿公以語錄見示余曰吾將求大師之人則大師之語言文字舉此矣夫大師之人諸方所共仰或以為泰山喬岳或以為威鳳祥麟或以為光風霽月或以為烈日秋霜而要其感人以誠遇物以恕律己以孤峻處事以平等不離真實者近是經云惟此一真實餘二則非真以大師之實求大師之人以云傳也以大師之人存大師之語言文字以云救也山陰雲隱弟子祁熊佳頓首拜題百愚斯禪師語錄序禪師俗姓谷氏河南南陽桐柏縣人自出世後以向上鉗錘學者凡八主道場始暢於昭慶圓寂於善慶建塔於善權善權者吾邑溪山最勝處歷代祖師僊靈窟宅也先是邑中蔣晦齋先生以宰官為釋氏護法念茲山自洊更兵燹來榛莽之所叢生獾豕之所嗥嘯法席非得人不可於是不徇名不懾勢特迎師主是山師至則攘幽剔薉復故拓新寺大治繼師者即師法嗣寒松公公神明警秀威音肅然其語錄詩文亦久為世重師沒後寒公手輯其語錄為二十餘卷藏寺中寒公嘗為余言師為人清沖簡劭是支道林竺法深一流人及讀龍眠先生所為師塔銘條分縷柝寒公之言益信既又讀師語錄龍駒蹙蹋天馬脫羈時而說法熾然時而拈花微笑竊歎自一花五葉以還青原南嶽而下提唱兼行然未有颯爽森張單提直入如禪師之踸踸者也則吾於寒公之言益大信噫吾見今之執拂而踞上座者矣其上者剽竊古德傳燈單文隻字支離撏撦嚼蠟捕風輒揚揚然詡於人曰我某宗嫡傳也是與王謝家不慧子弟專以門閱上人者何異甚或牽綴權勢憑藉貴游攫人之田廬而魚肉之猶曰我為祖塔司糞除也五宗嚴支派也識與不識無不從而嘔噦之聞禪師之風亦庶幾自媿矣余涉秋行國山道中憩善權寺門松巷屈指疇昔則禪師既寂晦齋繼歾即寒公亦席不暇暖他徙問其寺則已為豪有力者主之矣驚飆所及林無靜柯俛仰之閒能無慨然於中乎因至師塔下汲澗水一盂而飲之風霜刻轢泉香而石瘦則猶能想見師之為人荊溪法弟子陳維崧頓首謹拜撰百愚斯禪師語錄目次像傳序文第一卷住嘉定古昭慶禪寺語錄第二卷住雲間青龍隆福寺語錄第三卷住湖州弁山龍華寺語錄第四卷住湖州弁山龍華寺語錄第五卷載住青龍隆福禪寺語錄第六卷載住青龍隆福禪寺語錄第七卷住越州大能仁禪寺語錄第八卷住越州雲門顯聖寺語錄第九卷住越州雲門顯聖寺語錄第十卷住杭州皋亭佛日寺語錄第十一卷住宜興國山善權寺語錄第十二卷住維揚江都善慶院語錄第十三卷示眾小參第十四卷晚參第十五卷普說拈古第十六卷頌古第十七卷源流頌經旨頌第十八卷機緣問荅垂問垂代法語題贊第十九卷書復雜著第二十卷佛事塔銘蔓堂集附四卷六十四葉
