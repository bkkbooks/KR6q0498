body:
  text: 住國山善權寺嗣法門人智操住京兆薦福寺嗣法門人智覺編次普説告香普説具大機者不拘於高下施大用者不囿於軌則自結制以來不覺三七大機大用即不問你諸人只如即今一句作麼生道僧才出師便打僧喝師又打進云恩大難酬師云不是弄潮人進云不得壓良為賤師云還向潮中死乃云問在答處答在問處如連環不斷語脈相通方稱善問不然縱問似雲興答如瓶瀉有何交涉不見道饒君學得千經論一句臨機下口難儻信之不及待山僧引幾箇古錐作標榜昔周金剛未出蜀時何等氣概聞南方禪席大盛氣頗不平擔青龍疏鈔出蜀至澧陽路上向婆子買餅點心婆指擔曰甚麼文字曰青龍疏鈔婆曰注何經曰金剛經婆曰我有一問你若答得施與點心若答不得且別處去經云過去心不可得現在心不可得未來心不可得未審上座點那箇心師無語婆指往龍潭至法堂曰久嚮龍潭及乎到來潭又不見龍又不見覃引身曰子親到龍潭師無語遂棲止一日侍潭抵夜潭曰更深何不下去師珍重便出卻回曰外面黑潭點紙燈度與師師擬接潭復吹滅師大悟將疏鈔堆法堂前舉火炬曰窮諸玄辨若一毫置於太虛竭世樞機似一滴投於巨壑遂焚之辭去山僧聊為頌出氣宇雄雄老德山婆婆一拶便焦乾不因吸盡龍潭水怎見波濤遍界寬此是第一箇樣子也亮座主因參馬祖祖問講甚麼經曰心經祖云將甚麼講曰將心講祖云心如工伎兒意如和伎者六識為伴侶怎解講得經曰心既講不得莫是虛空講得麼祖云卻是虛空講得座出將下階祖召座主座回首祖云從生至死只是者箇座有省隱西山終身不出亦為頌出瞥然一喚便回頭惹得虛空笑不休雲捲西山明月上章江千古水長流此是第二箇樣子也又太原孚上座初在揚州光孝寺講涅槃經有禪者阻雪因往聽講至三因佛性三德法身廣談法身妙理者失笑孚講罷請者喫茶白曰某甲素志狹劣依文解義適蒙見笑且望賜教者曰實笑座主不識法身孚曰如此解説何處不是者曰請座主更説一遍孚曰法身之理猶若太虛豎窮三際橫遍十方彌綸八極包括二義隨緣赴感靡不周遍者曰不道座主説得不是只是説得法身量邊事實未識法身在孚曰禪德當為我説者曰座主還信麼孚曰焉敢不信者曰座主輟講旬日室內端然靜慮收心攝念善惡諸緣一時放卻孚如所教從初夜至五鼓聞鼓角聲忽然契悟便去扣門者曰阿誰孚曰某甲者咄曰教汝傳持大教代佛説法夜來為甚麼醉酒臥街孚曰某甲自來講經將生身父母鼻孔扭捏從今已去更不敢如是者曰且去來日相見孚罷講遍歷諸方後嗣雪峰亦有一頌鼓角頻催一夢回從前知解便成灰不緣明月來窗外那得梅花雪裏開此是第三箇樣子也洛浦禪師久為臨濟侍者濟常稱美云臨濟門下一隻箭誰敢當鋒浦一日辭濟濟問什麼處去浦云南方去濟以拄杖畫一畫云過得者箇便去浦乃喝濟便打浦作禮濟明日上堂云好一條赤梢鯉魚搖頭擺尾向南方去不知向誰家齏甕裏淹殺浦遊歷罷直抵夾山頂卓菴經年山乃知修書令僧馳到浦接得便坐卻再展手索僧無對浦打云歸去舉似和尚僧回舉似夾山山云者僧開書三日內必來若不開書斯人救不得也果三日後至見山不禮拜當面叉手而立山云雞棲鳳巢非其同類出去浦問云自遠趨風請師一接山云目前無闍黎此間無老僧浦便喝山云住住且莫草草匆匆雲月是同溪山各別截斷天下人舌頭則不無怎教無舌人解語浦佇思山便打浦從此服膺亦有一頌當年洛浦稱聖箭來到夾山折一半解語還須無舌人忽驚玉鳳翀霄漢此是第四箇樣子也大衆此乃略言不及枚舉要做祖師門下兒孫必須親到德山亮座主太原孚洛浦諸大老者般田地始稱道眼圓明行解超然不被邪師所惑自成一家種草不然終成杜撰向葛藤窠裏過日子見人説長便謂之長見人説短便謂之短隨人起倒全無主張必是離師太早未盡其妙山僧曾見大慧普説中曰有一種將臨濟三玄雲門三句逐句解説以傳燈廣燈祖師言句各分門類不見汾陽曰三玄三要事難分得意忘言道易親一句明明該萬象重陽九日菊花新此老明明為你指出臨濟骨髓卻來逐句注解謂三玄三要事難分是總頌得意忘言道易親是體中玄函蓋乾坤句一句明明該萬象是句中玄截斷衆流句重陽九日菊花新是玄中玄隨波逐浪句此乃前輩中負大名望者猶且杜撰如是其餘不足言也莫道你負大名望具大辨才有大智慧便是達磨出來作者般去就正好捉來活埋免得教壞人家男女一盲引衆盲問著三要即注解不得便將德山托鉢嵒頭末後句南泉斬貓百丈野狐歸宗斬蛇大隋燒畬趙州勘婆子勘菴主睦州擔板陳操尚書勘僧玄沙敢保老兄未徹在洞山道即太煞只道得八成達磨隻履西歸如此之類皆謂之末後句便引洛浦云末後一句始到牢關把斷要津不通凡聖任從天下樂欣欣我獨不肯謂之我為法王於法自在任你學者逞盡神通呈盡伎倆我只一向把住不許你謂之牢關直待立僧住院密室口耳傳授如斯之類自毀正因返行魔説又有一種道南泉斬貓百丈野狐歸宗斬蛇大隋燒畬趙州勘婆子勘菴主之類謂之建立門庭本無恁麼事貴要羅籠學者更有一種以偏正回互為宗旨如洞山與雲居過水次洞山問水深多少云不溼山云粗人雲居卻問水深多少云不乾謂水諱溼而當頭道溼不能回互謂之粗人雲居卻云不溼是觸諱而不能回互洞山道不乾乃有語中無語何謂有語不溼是何謂無語不乾是不乾乃是溼是活語能回互不觸諱故也又以黑白圈兒作五位形相以全黑圈兒為威音那畔父母未生空劫已前混沌未分事謂之正位以二分黑一分白圈兒為正中偏卻來白處説黑底不得犯著黑字即觸諱矣又謂曹山有言正位者即空界也一向無物偏位者即色界也內有種種諸雜萬象兼中至者捨事入理正中來者背理就事兼帶者即冥應衆緣不隨諸有非染非淨無正無偏故云虛玄妙道無著真宗從上先德推此一位最妙最玄須是審詳辨明當體又説五位三字成句偏正上下回互而不犯中中即正位也説理説事教有明文教外單傳直指之道果如是否若果如是討甚好曹山耶又引浮山作太陽真讚曰黑狗爛銀蹄自注云此語正位中有偏位黑狗是正位爛銀蹄是偏位白象崑崙騎自注云此語偏位中有正位於斯二無礙自注云此語不墮有無二邊所以洞山云不落有無誰敢和木馬火中嘶自注云妙挾然雖妙挾而虛玄唱道也似者般説話須教你燒頂煉臂發誓願不得妄傳然後分付亦謂之末後句師舉了遂彈指云好掩彩底禪若是皮下有點血底還肯喫者茶飯麼以上種種闢判皆是大慧概而言之不但説臨濟有此之弊即曹洞雲門亦復不免痛斥當時注解三玄穿鑿五位之病故極力挽回恐愈流愈下而不可救也大慧運斤成風左之右之總不傷鋒犯手可謂千古宗匠誰敢議論昨見一册將大慧示衆普説有貶駁注解雲門三句臨濟三玄以及洞山五位黑處説白白處説黑更有燒頂煉臂不得妄授與人邪謬等語不知何等禿丁遂將雲門臨濟説話盡情刪去單單獨存洞宗五位注解配合一篇謂洞上宗旨有如此之義解有如此之穿鑿用心如此誠乃含血噴天先污其口不見大慧説了便云古人意只如此乎若果如此何處討好曹山耶大凡古人言句前後照應首尾相聯始成一家説話今將首尾刪去獨留中間一節誣蔑先賢鼓惑後學若子若孫不知其過每每大本刻出不顧取笑大方所謂家醜自揚是也夫為善知識者唯要眼目精明見地圓活出一言發一句如盤中走珠使人遏捺不住摸索不著又如經中道資生産業治世語言皆與實相不相違背到此須是白拈手段方可為人山僧昔見列子篇中有云齊之國氏大富宋之向氏大貧自宋之齊請其術國氏告之曰吾善為盜始吾為盜也一年而給二年而足三年大穰自此以往施及州閭向氏大喜喻其為盜之言未喻其為盜之道遂踰垣鑿室手之所及無不探也未及時以贓獲罪沒其先居之財向氏以為國氏之謬己也往而怨之國氏曰若為盜若何向氏言其狀國氏曰嘻夫為盜之道至此乎吾與若言矣吾聞天有時地有利吾盜天地之時利雲雨之滂潤山澤之産育遂生吾禾植吾稼築吾垣建吾舍吾陸盜禽獸水盜魚鱉土木未稼禽獸魚鱉乃天之所生非人之所有故吾盜天而無殃夫金玉珍寶穀帛財貨皆人之所聚非天之所與故若盜之獲罪孰怨哉向氏以為國氏之重罔己也過東郭先生問焉先生曰若一身庸非盜乎若盜陰陽之和以成若生載若形況外物而非盜乎誠然天地之不相離也認而有之大惑也國氏之盜公道也故無殃若之盜私心也故獲罪有公私亦盜也無公私亦盜也公公私私乃天地之德知天地之德孰為盜耶孰為不盜耶斯意雖淺可以喻深此言雖細可以喻大國氏之盜可謂肘後有符慣會白拈手段是也向氏之盜正謂豁達空撥因果莽莽蕩蕩招殃禍是也東郭先生可謂是賊識賊是也昔紫胡一夜擒住一僧曰捉得賊也捉得賊也僧曰不是某甲紫胡曰是即是只是你不肯承當或曰既為善知識當使人忘情識死偷心提佛祖向上之令拈人天格外之機烏得教人做賊遂拊掌三下云捉楊花捉楊花箇樣風流羡作家十字街頭廖鬍子教得孩兒會罵爺普説登山須到頂入海須到底登山不到頂不見字宙之寬廣入海不到底不知滄溟之淵深結制已經三七試問諸人於中工夫果能到頂到底可謂功不浪施不妨飢餐渴飲早起晏眠隨緣放曠任意逍遙若也未到者般田地正好於此發大精進奮大勇猛立大誓願以悟為期不可因循放過經云壯色不停猶如奔馬人命無常速於川流豈可視為等間所以古人四十年打成一片二十年不雜用心三登投子九上洞山然後發明大事所謂佛法無多子久長難得人豈似今人才入叢林即便妝大老把生死一著子置於度外話頭不審來由工夫不知深淺到處作詩作偈徵古代古別古頌古擬小參示衆大似百舌學禽語全無自己聲殊可憐憫古人道毫釐繫念三途業因瞥爾情生萬劫羈鎖凡名聖號總是虛聲劣相殊形皆為幻色汝欲求之得無纍乎急須截斷情關掀翻識窟大死一番始堪湊拍故云懸崖撒手自肯承當絶後再蘇欺伊不得又云凡聖情盡體露真常理事不二即如如佛諸公還信得及擔當得麼在凡不減一毫在聖不加一毫亙古彌今明明不昧而不透脫者病在於何蓋緣二六時中隨境飄流迷己逐物雖終日行而不自覺不自覺者乃無始住地無明也何謂無明華嚴經云不了第一義諦故曰無明無明包裹謂之胎生煩惱纏繞謂之卵生愛水浸潤謂之溼生欻起妄想謂之化生即此一念無明具足十二類生是以汩沒三界輪轉四生頭出頭沒亦如陽焰翻波無有了期若是英烈漢一聞此語即便坐斷兩頭中間不立赤灑灑淨裸裸向威音那畔更那畔打箇筋斗卻來者裏行履又不可認著一機一境一棒一喝以當平生活計到者裏直要參須實參悟須實悟説得到行得到見得到用得到方與道人分中有少許相應雖然更須向深山窮谷中盤結草菴折腳鐺裏煮飯喫過三二十年財寶不為念名利不干懷君王命而不來諸侯請而不赴若也説在飛龍之前行在跛鱉之後縱是文殊金毛獅子被你騎得普賢六牙象王被你跨來頂上放萬道金光足下踏千葉寶蓮正眼看來總是尋聲逐色光影邊事與我衲僧門下了無交涉須知別有生計迥出常流千聖喚不回萬人挽不轉堂堂自在獨步大方花柳巷正好調心管絃樓何妨掉臂雖然更有一人不肯在大衆且道不肯的甚麼人良久云不勞久立珍重普説譬如暗室中無燈不可見佛法無人説雖慧莫能了山僧連日傍敲正打或慈或威或喜或怒要且不為別事只欲諸人端的得一回汗出於一莖草上現瓊樓玉殿若未端的得一回汗出總有玉殿瓊樓被一莖草覆卻前日發憤打七要明箇事至今七日已過還知端的也未果能端的自然淨裸裸絶承當赤灑灑沒可把別有生機活路總不踏人舊轍喫他殘唾古人逴得些子如虎附嵎似龍得水即能興波作浪東涌西沒便為人抽釘拔楔解黏去縛遇處即宗隨緣建旨只教枯木回春冰河發焰攀鏡裏之空花撈波中之明月聲色叢裏妙運神機是非場中大作佛事不動纖塵那留朕迹驅木馬高驟於雲霄鞭泥牛深耕於海月密度金針夜挑蜀錦暗穿玉線巧繡鴛鴦暗去明來鋒鋩不露勦凡絶聖棄智忘功蠲除那畔塵中混迹不落今時炭裏藏身於一語具三玄門於一玄門具三要有權有實有照有用或現全身或露半形或乘獅子或乘象王或全賓即主或即主全賓或全賓全主或全主全賓殺活縱橫收放自在拈三句機鋒弄一字關鍵銅心鐵膽猶且亡魂碧眼黃頭那知來處父慈子孝聲順響和或向空中書字或向脅下安名九十七種圓相驗盡天下衲僧一十九門施設搜遍寰中英俊剷聲削迹屏識離情或論三界惟心萬法惟識耳觀山色眼聽水聲所謂種種音聲相貌種種變化神通種種佛事種種建立百千三昧無量妙義總不出者些子如上所舉皆是古人興慈運悲接物利生之方便土苴緒餘耳若是真實相為處山僧今晚未曾吐著一字大衆要會真實相為處麼良久云霜寒月冷各須珍重普説三七光陰彈指過衲衣下事更如何直饒到得無心處須識無心事轉多大衆既到無心因甚麼事轉多莫是涅槃心易曉差別智難明麼莫是道曠無涯逢人不盡麼莫是法因頓悟事次第除麼莫是修證即不無染污即不得麼若與麼商量盡是義學知解有甚共語處衆中有出類拔萃者出來説看問今朝草一三七已畢特請吾師通箇消息師云剔起眉毛猶錯過進云善慶堂前金鳳舞九龍橋畔絶知音師云擬思一箭髑髏穿進云踏翻滄海波心月獨露乾坤任所之師打云腳下紅線未斷在乃云披褐服毳者不可與論紬帛之麗密茹藿含糗者不可與道太牢之滋味止草菴者不知有寶所行小徑者不知有大道此是朝菌蟪蛄之類殊不知我衲僧門下見處不然故德山云我者裏無祖無佛達磨是老臊胡釋迦是乾矢橛文殊普賢是擔屎漢等覺妙覺是破執凡夫三乘十二分教是鬼神簿拭瘡紙四果三賢十地初心是守古冢的鬼自救不了唯此一著子言思路絶心行處滅識不能識智不能知親無可親疏無可疏是無可是非無可非修無可修證無可證迷無可迷悟無可悟經塵劫而不磨歷萬古而不朽到與麼地三世諸佛不敢正眼覷著覷著則瞎卻渠眼故靈山拈花飲光微笑亦是一犬吠虛衆猱啀實西乾四七東土二三總是杓卜聽聲承虛接響天下老凍儂盡是將錯就錯以訛傳訛其奈去聖時遙愈流愈下縱使佛祖再出莫之能挽更有妄認正偏君臣滲漏功勳為洞上堂奧者有認玄要賓主料簡四喝為臨濟宗旨者有認韶陽三句顧鑒一字為雲門要妙者有認三界惟心萬法惟識華嚴六相義為法眼祕訣者有認一十九門施設九十七種圓相為溈仰密傳者有認種種門庭種種言辭種種方便以為向上提持者此是認指為月棄本逐末總屬世諦流布非唯五宗斷滅達磨一枝佛法早已掃地有般杜撰長老或結一期打一七即便大書於丈室某已悟道某得見識某堪付法設齋辦供以求印證或法語小參作頌作偈喚作操履佛法以此羅籠學者簧鼓天下嗟嗟佛法果如是乎非造地獄業因即為魔家眷屬我佛法中實無是事山僧自到維揚不敢妄生節目一味本分草料不教你參禪悟道不教你成佛作祖但教你削人我去是非息塵勞脫生死打掃得胸中乾乾淨淨無有纖毫渣滓無有纖毫知見作箇灑灑落落無依道人然後舉措施為咳唾掉臂無非祖師西來意苟能如是復有何事所以古人道明明無悟法悟法卻迷人到者裏説箇悟字不惟自欺亦乃欺人儻有長老出衆高聲云我悟也我悟也山僧更要問你身如椰子大捫頂至踵毫毛孔竅一一推尋看你悟的佛法向甚麼處安著是何形狀試拈出看若拈不出更有三十拄杖親領出門外自打始得何故卓拄杖云選佛若無如是眼假饒千載亦奚為拈古舉鹿門自覺禪師示衆曰盡大地是學人一卷經盡乾坤是學人一隻眼以者箇眼讀如是經千萬億劫常無間斷報恩秀曰看讀不易師云盡大地是一卷經向甚麼處著眼盡乾坤是一隻眼向甚麼處著經既都不然且道鹿門意在於何報恩曰看讀不易此語是褒耶是貶耶鵝王擇乳素非鴨類舉青州希辨禪師嘗垂百問勘驗學者一曰聲前薦得落在今時句後承當迷頭認影作麼生是空劫已前自己師云古人垂一言半句如湛盧莫耶相似凝則傷鋒犯手觸則喪身失命安有你卜度分有班楞爭鬼認著箇驢前馬後漢為空劫已前自己所謂可憐愍者畢竟如何是空劫已前自己良久云寧可截舌不犯國諱舉雪竇智鑑禪師兒時母與洗手瘍問曰是什麼雪云我手是佛手後依真歇於長蘆天童首衆又遁象山深夜百怪俱作乃大悟後上堂世尊有密語迦葉不覆藏一夜落花雨滿城流水香師云金翅生來勢不群乍飛便解取龍吞搖地軸拔天根直至而今海嶽昏舉天童岫禪師上堂鬧市紅塵裏有鬧市紅塵裏佛法深山嵒崖中有深山嵒崖中佛法山僧昨日出城鬧市紅塵裏佛法一時忘卻了也行到二十里松雲便見深山嵒崖中佛法大衆如何是深山嵒崖中佛法白雲淡濘出沒太虛之中青蘿夤緣直上寒松之頂師云雲外老漢大似將祖翁田地強自分疆立界我者裏也無鬧市紅塵佛法也無深山嵒崖佛法只有箇荒村破院衲子數百隨家豐儉隨緣飲啄而已有人道著佛法二字三十拄杖打折驢腰且道其中還有為人處也無舉天童淨禪師六坐道場未言稟承衆由是請童曰我待涅槃堂裏拈出果臨終拈香云如淨行腳四十餘年首到乳峰失腳墮於陷阱此香今不免拈出鈍置我住雪竇足菴大和尚師云長翁者般説話還是出陷阱的語未出陷阱的語若出得怎肯恁麼道若出不得怎解恁麼道具眼者試辨看舉雪竇證禪師入雲外室雲曰天童今日大死去也你作麼生救雪曰請和尚喫飯雲曰天童今日大死去也你不要相救雪曰救他作麼雲曰天童今日大死去也阿誰與我詞行雪曰和尚先行某甲隨後雲呵呵大笑師云大死去也作麼生救和尚先行某甲隨後呵呵大笑有誰知一段春光彌宇宙舉大明寶禪師示衆若論此事如人作針線幸然針針相似忽見人來不覺失卻針只見線者邊尋也不見那邊尋也不見卻自云近處尚不見遠處那裏得來多時尋不得心煩不好昏悶打睡拽衣就枕方就枕時驀然一劄曰元來只在者裏師云者箇譬喻説得無不了了奈何皮下無血者多當時雲門若在但只撫掌大笑且道笑箇甚麼參舉雪嵒滿禪師初參普照寶照曰兄弟年俊正宜叩參老僧當年念念常以佛法為事雪避席進曰和尚而今如何也照曰如生冤家相似雪曰若不得此語幾乎枉行千里照下禪床握雪手曰作家那師云一人以老賣老一人粧聾作啞及至後來大似皮匠失火二俱露出楥頭且道甚麼處是楥頭若檢點得出許你參學事畢舉報恩秀禪師問僧洞山道龍吟枯木異響難聞如何是異響僧曰不會恩曰善解龍吟師云只如者僧若是作家為甚麼卻不會若是箇孟八郎為甚麼報恩道善解龍吟如甄別不出莫道不疑好舉報恩倫禪師僧問法眼道我二十年只作境會既不作境會合作麼生會曰猿抱子歸青嶂裏鳥銜花落碧嵒前師云倫禪師只會就窩打兔不解仰箭射雕當時若問雲門既不作境話會合作麼生會亦向他道猿抱子歸青嶂裏鳥銜花落碧嵒前且道與古人是同是別舉王山體禪師示衆曰既有尊貴之位須明尊貴底人既知尊貴底人不處尊貴之位方明尊貴師云總饒明得尊貴猶未是尊貴作麼生是尊貴良久云要頭割取去舉雪嵒滿禪師因僧問高郵定和尚透網金鱗以何為食定曰乾矢橛雪聞之曰謝供養師云此二老與麼答話還有優劣也無若云無不啻天地懸殊若云有差別在甚麼處雲門不惜眉毛為諸人點破咄尿床鬼子待別時來舉雪庭裕禪師因僧問如何是祖師西來意雪曰待乳峰點頭即向汝道師云此箇乳峰不獨塞卻者僧咽喉亦乃塞卻天下衲僧的咽喉至今無出氣雲門要與諸人出氣去也遂喝一喝舉靈隱文泰禪師上堂塵劫來事只在於今河沙妙德總在心源試教伊覿面相呈便不解當風拈出且道過在甚麼處卓拄杖曰只為分明極翻令所得遲師云若論此事普天匝地塞壑填溝説甚麼有過無過靈隱老漢大似倚勢欺人當時雲門若見他恁麼道點一把火向他面上照一照看他作麼生折合舉還源遇禪師因僧問如何是西來的的大意還曰風送泉聲來枕畔月移花影到窗前師云者則公案見則易見會即難會何也若道是西來意又是目前境若謂是目前境又答西來意果向者裏剖析分曉雲門與伊箇鉢袋子舉香嚴文才禪師因僧問如何是理法界嚴曰虛空撲落地粉碎不成文曰如何是事法界嚴曰到來家蕩盡免作屋中愚曰如何是事理無礙法界嚴曰三冬枯木秀九夏雪花飛曰如何是事事無礙法界嚴曰清風伴明月野老笑相親師云香嚴者般説話還是單明法界道理耶還是別有向上提持耶若是單明法界與座主何異果別有向上亦是節外生枝去此二途作麼生商量直饒商量得出更買草鞋行腳三十年始得舉疑然了改禪師上堂莫向言中取則直須句外明宗若能如是會徹古徹今自由自在知麼師云者等説話大似扶鴨上壁牽驢過橋不顧傍觀者哂雖然也是為憐三尺子不惜兩莖眉舉俱空斌禪師因僧問如何是空劫已前底事空曰烏龜向火師云宗師家等間吐露一言半句如大火聚使人觸不得背不得只要你直下翻身當陽瞥地豈有他哉只者一句子大難委悉有者道是答空劫已前底事有者道此是格外提持若恁麼會總是屙屎見解有甚交涉畢竟如何腦後見腮莫與往來舉慈舟念禪師參幻休休問甚處來慈曰北方來休曰北方道法與此方何如慈曰水分千派流出一源師云焦磚打著連底凍舉湛然澄禪師參慈舟舟問止風塗向青山近越王城畔滄海遙時如何湛曰月穿滄海破波斯不展眉師云言有宗事有君宛轉偏圓虛玄不犯須讓他二大老始得若是覿面向上一路猶隔山海在雖然只如雲門與麼道別有甚長處百醜千拙跛跛挈挈德玄寂行悟續箇明才明朗明判李花秀李馥備資敬刻百老和尚語録第十五卷
