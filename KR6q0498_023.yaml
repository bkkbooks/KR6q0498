body:
  text: 嗣法門人智朴編桐城方拱乾甦菴閱七言古詩靈松輪囷古榦凝寒翠氣蓋森森雄拔類錯落虯枝摩太青髼鬆偃仰空塵世弄月嘲風不自禁凌霜傲物得人畏夜深疑是奏瑤琴影動雲濤頻亂墜挂冠久謝大夫名身退非慮小人忌我亦逃禪何有鄉與君共話歲寒志群芳雪後始知慚獨立無能奪其萃飽飫煙霞老益堅挺然亙古撐天地遊洞巖摳衣扶策躡奇蹤執炬攀危探仙窟稜層匍匐笑老猿委蛇崱屴頻顛蹶石罅玲瓏奪神工萬竅騰輝嵌寶月晨風𩖼𩖼散天香玉液瓊漿流不竭靈葩不卸自長春彩雲靉靆籠林樾幽深處處架虹橋壺天別自開宮闕藤蘿倒挂挽鰲鬚蒼蘚輪囷披紺髮徘徊躑躅興何勝偶出洞門笑不歇渾身帶露濕淋漓回首看山眼突兀遊五洩削出嵯峨奇更奇驚看號叫走馮夷銀河誰將忽決斷飄颻千尺倒懸眉𡬡耐天孫剪為五玉練飛飛隨風舞激湍觸石濺銀濤萬斛珠璣噴如雨靈湫莫測通蛟宮掣電轟雷震聾瞽攀藤更上一重巔足下日輪剛欲午七十二峰看不厭峰峰爭吐青蓮瓣昔有開山靈默翁驅神役鬼壘天塹愧我來時何太遲不得追隨空眷戀徜徉月下竟忘歸催歸回首雲煙變逶迤十里出青口倚杖溪邊笑拍手此景非獨人間稀只應天上亦希有題墨蘭揮霍淋漓輕煤掃圖成幽蕙看轉好影落銀箋淡復濃纖葉橫斜和煙裊不藉春風花自開花開不逐春風老無人靜裡暗浮香肯與群芳鬥花藻錦心獨抱樂天真德不孤兮石為鄰堪羨氣味同君子徹盡風霜不染塵登國山覽東吳封禪碑一步一歇臨高頂青天漸近毛髮冷驚看疊嶂不知重笑指白雲千萬頃勞生擾擾隙中塵浮世茫茫眼裏青孫家封禪載殊祥天璽龍圖讖其永吳國花宮安在哉空負流泉作悲哽皇天無親不可期曾聞在德不在鼎塞海𡎺城何太癡今古英雄幾個醒回首忽聽下方鐘斷送斜陽過西嶺春風暗裏醉遊人拄杖歸來深酩酊詠菊乞得鄰家一盆菊扶向齋頭伴幽獨幸爾客到不憂貧丰姿爽氣清人目靜看翩翩蛺蝶飛寒香馥馥襲輕衣對風解笑不解語喜占秋光弄素輝錯落蓓蕾籠煙紫參差露蕊傾珠璣不與春葩爭豔麗欲同白石老松扉此花一開眾花歇自古號為霜中傑試問相知更有誰脈脈無言憶靖節遊張公洞聞說張公洞最好秉燭特來尋幽窅雲梯嶮巇路百盤下臨蛟宮萬丈島仙蹤怪跡不知名鬼工神斧弄奇巧瓊漿倒瀉灌芝田丹灶無煙生碧草細聽珍禽雜管絃轉盼靈葩砌瑪瑙欣逢八月木犀天香風不斷頻繚繞徘徊花藏界裏遊頓使塵襟除熱惱誰知此地非人間我欲誅茅來送老送𠁼菴石二禪人還義山秋風蕭索暮山紫楚雲吳樹幾千里禪客南詢不憚勞遠涉荊溪扣玄旨潦倒從來一字無那有佛法挂人齒生平多被業風吹越國揚州無定止說妙談玄愧不能一片身心付流水君今別去返衡陽湖天煙浪正茫茫路途草鞋須珍重拈卻語句勘諸方唯有義山真可羨鉗鎚惡辣多機變與我最是好弟兄廿載相識不相見到彼若復問行藏莫謂善權住破院月夜同古樵鹵菴諸子登潤州雙峰頂夜靜霜風摵疏竹歡遊何必羨金谷買屐尋幽兼秉燭相呼相喚共躑躅雲磴紆迴起復仆攀蘿捫壁繞山腹欲窮絕頂豁雙目劃然一嘯驚林麓湧出銀似推穀萬里煙光浮白玉仰觀星斗亦堪掬細聽波底龍吟曲更向峰頭覓華屋屋中主人淳且朴烹茗同盤餐黃獨詩成句裏山鬼哭試問焦公今在不空餘丹井臥麋鹿人生何苦不知足富貴總歸碁一局歸去來兮更漏促聊借松頂鶴巢宿過與可沈居士舊隱滿架詩書一草堂紫藤百尺魚梁春禽門外噪斜陽我來不見梅源主泉石唯餘翰墨香望雨辛丑歲大旱故有此作五月六月天不雨老圃老農咸叫苦每年播種在黃悔此際禾莖未插上深溪陡然成淺溪小暑酷來勝大暑桔槔遠近盡停聲怪底商羊胡不舞空裏一片烏雲來勃然隱隱動輷雷轉盼好似雨將至倏爾又被風吹開今日挨過看明早依舊晴空如帚掃溝壑絕涓流林木皆枯槁再經三日五日不降霖管教老幼蒼生無可保安得烏藤長百丈搗穿銀河徹底放浸殺旱魃不較多好看平田三尺浪五言律詩賦得樹影中流見誰把圖橫展還疑筆走煙無根枝倒出有葉影分先雲散丹青地魚遊水墨天群流雖鎖斷不礙往來船詠法界寺銀杏樹氣鬱凌霄漢婆娑接地陰夜栖禪月皎日引怪禽吟九夏果含玉三秋葉落金渾忘年代遠一柱砥叢林野望孤煙林外迥野色望中收影綠梅初熟雲黃麥欲秋閒心隨鶴止逸興寄波流得句誰同賞斜陽滿樹頭夏夜愛涼開竹牖孤坐對南薰雉堞月初上嗣階影乍分徘徊螢散彩搖映水梭紋野思沈虛籟鐘聲逐斷雲寄漢融朱居士聞君曾兩顧媿未啟荊扉無壁安題鳳有亭堪寄衣道交千里契念異寸心違勿謂不相值月明樹樹輝煮茶坐倦猶思茗分薪向小鐺初看疑霧起更聽若蛩鳴味戰昏魔遠香撩詩興清趙州無限意珍重向人傾詠螢丹鳥名傳久冷然體自輕浮沉隨處度隱顯順時行伴讀欣幽室全生遠禁城夜來蒲上宿疑是七星橫病起自愧身縈癖春光已半過試行憑杖力見客怯言多夢暇常同鶴形臞懶盼柯幸期得小健聊作一吟哦元旦登山探奇聊仗策攀磴躡危巔怪石雲千簇晴湖鏡一圓村閒聽好鳥凍斷看飛泉小憩崖臺上春風軟似綿梅徑傍水春何好南枝蕊競肥色分鶴背冷影碎蝶魂飛看月疑堆雪穿風亂點衣聊因送客處門外踏香歸夏日遊銕壁居撥雲尋鳥道危磴碧蘿攀逸韻仙橋古香風樵徑還鑑湖分海口石壁接天關絕頂舒長嘯乾坤一掌間除夕前一日臘盡驚梅放香風暗動簾半生方外客一歲夢中添積雪烹新茗裁雲補舊縑何時完筆債免惹野鷗嫌詠秋蟬素志多高尚清吟足一枝外形欣自得忘味樂天倪露薄傷時變風微寄遠思秋來無限意堪惜幾人知重陽日訪龍潛玄素法兄途中作為尋白社友迢遞入深阿佳節途中賞幽情客裏多菊香烝野徑鴈影蘸江波高隱知何處夕陽清磬過偕行秋色裏沓嶂含蒼翠尋幽竹徑斜霜花侵短鬢丹葉落晴霞問鴈情何闊穿雲興更奢笑談明月裏石上且烹茶雨窗即事柿酣秋漸老小硯足生涯蕉響來山雨風狂集暮鴉人情隨所適世事亦何嗟落葉催砧急禦寒且續麻歲暮遣懷年盡事何盡得休且便休新詩寄故友往跡付東流日曬荷衣暖雪香草閣幽瀟然忘蝶夢酌茗笑莊周夏日訪丹溟法兄為訪金襴友飛帆兩度遊新荷香亂渚疏竹影侵樓客久憐多病年高喜白頭此心誰共曉攜手肅芳洲重過練川昭慶寺疁城煙景好帶雨遠揚舲岸柳因誰綠庭蘭為我馨榻餘昔日夢鏡異舊時形𡬡耐薰風急催丹不肯停暮冬即事雪霽園林好幽情歲底奢洗鐺頻煮月留客共餐霞凍解溪腸咽煙凝谷口遮老藤閒不住隔水探梅花詠雪擁毳獨聞鐘參差倒壓松山高形易老梅瘦蕊偏重少室今猶冽程門久不逢偶疑人世變樓外失千峰秋日過化山訪位中法兄煙寒秋欲老山亂影猶迷清磬雲門寺晨歌耶水溪昔年懷勝隱今日見真棲話久情忘處高軒桂月低隆福寺流霞磨殿角額古見遺蹤闢徑通三泖開門對九峰月移鶴夢穩花襯馬蹄重千載名藍地雲閒夜半鐘昇仙臺王可交成仙處榭老餘荒砌至今思可交水流空有月鶴去獨遺巢丹灶和煙冷碁盤任雨敲蓬萊知在邇秋色滿蘆幻酒缶山昔韓世忠勞軍處通鑑云世忠後軍屯青龍即此也積壘成高阜年深事可傷殘虹沉劍氣夜雨盪壺漿勳業埋荒草雄心寄北邙何時開醉眼共笑白雲忙白鶴江岸樹聯沙觜霜翎影蘸波時聞清唳遠乍見片雲過細雨侵紅蓼白萍照綠莎子喬乘去後幽夢逐漁歌會龍菴雲深開白社遠水遞重圍玉齒經聲朗金龕佛火微禽閒頻入定月上不關扉夜夜群龍聚聞鐘帶雨歸獅子橋煙鎖關津斷金猊隔岸通風生聞夜吼草偃見毛豐荻白溪眉老霞酬水面紅久忘狐兔跡險處架長虹戒衣亭昔日曾分付誰將挂此亭條衣流水樣色染遠山青錦綻煙生藹光飛夜聚螢寄言雞足老莫使亂飄零除夕打掃階前雪留詩且補窗年增空自惜齒缺不成雙剪燭留金蕊烹泉瀉玉缸坐深因送臘鈴語落吳江初夏懷穀山和尚章江分棹處十載愧離居春去難留夢鴈回猶見書參差煙樹杳迢遞水雲疏一榻高懸久何時過我廬酬朱漢融居士晴煙籠鶴渚一棹夕陽回梅老香涵雪春深花戀臺月依流水活山傍畫圖開莫訝幽齋冷乘閒且再來檇李道中殘暉籠遠樹錦纜繫春風波響魚吞影花驚鳥啄紅人家榆柳隔鄉國夢魂通煙雨樓何處蒼茫在望中過水月菴贈竺賓薄暮投香剎苔深一杖通橋橫明月廚傍落花紅滌缽魚心悅敲詩鳥定空主人情不已連日對春風雨後登玉峰彌勒閣雨餘山色好牽袂躡雲梯嘯裏江天隱望中樓閣低花頻留客坐鳥獨向風啼兜率疑何近蒼蒼煙樹迷閔浦曉望曙色分茅店人家近渡頭煙描雲外樹雪點浪中鷗短笛催鄉夢飛絲繫客愁徘徊搔首望隔岸喚漁舟宿亭林寶雲寺雪朗上人房雨過亭林暮偶來借榻眠窗寒花弄月池靜露生蓮坐久因情洽談深識王賢忽聞流水外鐘打五更天花承蓮座列岫自天削芙渠瓣瓣開涼風生碧沼丹葉點金臺影亂流雲度香飛驟雨來雙趺聊一坐身世遠塵埃秀屏春樹雲開飛翠羽怪石淡煙籠春藹鋪鮮錦巖花著嫩紅四時風雨易一色古今同眼飽渾忘倦猶疑在畫中秋夜客中閒詠海棠眠正穩振策獨吟時風定螢喧竹水香花落池幽情孤嶼遠客夢片雲知此際真堪惜冰壺滿貯詩嘲梅二月春將半南枝尚未開朦朧因霧褁冷淡怯風催瘦影搖簾幕香魂落茗杯欲言猶不吐試問待誰來送象先返楚客路春山杳新青陌上看疏鐘敲暮雨好月下晴灘柳放龍江暗霜驚雲夢殘歸帆千里外珍重曉風寒南橋明行寺阻雨問宿南橋寺寺門捲浪頭無人為下榻識我是飛鷗夜冷花貪睡煙深柳帶愁情知風雨挽不肯放行舟舟中限韻西風吹夢急作客不吾嫌柿葉飛紅鳥霜花糝白鹽鐘沉吳嶺外鴈度楚雲尖堪惜秋將莫吟成獨燃髯雨窗夜坐一榻和雲冷坐深篆縷斜山空多夜雨樹老獨棲鴉貧病胡為慮世情亦可嗟秋風知我意吹夢過天涯過長青嶺十里長青嶺迢迢到紫郎竹橋霜易滑茅屋草生香路細因苔合林深悅鳥藏幽棲知在邇小犬吠斜陽指石峰嶮巇絕行跡疇將一指伸劃開江眼碧點出嶺頭春幾見梅花笑數番楊柳新何年舒到此唯待問津人碁墅年深柯已爛細雨草生悲世事空流水人情一局碁月晴螢火瘦秋爽石毛披此著誰先得白雲獨自知琵琶洲地靈多復巧芳渚類琵琶逸韻含千古流商別一家春風吹不斷幽瀨奏無涯不作關山恨東風草自花乍霽曉開天放眼試策踏新晞粉蝶探花徑群鷗䀶縞衣犬聲隨客往雲影逐帆歸堪惜春將半尋詩問釣磯遊大山菴路狹難容足徘徊只見山攀巢驚鶴唳嘯月倚松關鐘向雲端發客從天外還倦來眠石上夢不到人間寶月菴坐雨一室更初漏燈殘客思沉涼風生短髮細雨濕孤襟鴈過滄江杳蟲悲落葉深幾家人不寐城外擊寒砧托缽昔年分衛事雞足繼芳塵檀度千門廣生涯一缽新除貪為正命趣味但支身從上真儀式惜哉愧古人拾棉花荒村生計拙農事待秋看遍壟敷瓊蕊壓枝盡雪團和雲逐日撿帶露向風攤好似兜羅物隆冬不怕寒羅漢夜泊市散人煙寂移舟傍石磯夜沉漁火斷霜冷鴈聲稀旅客吟殘月寒砧搗素衣古疁臨海近夢帶晚潮歸中夜雨寒雨西風夜孤襟自擁舟鐘沉黃葉寺浪捲白蘋洲世事貧中斷家山夢裏遊謾言為客易霜色忽驚秋月浦夜發渡口潮初漲一篙逆上流轉灣驚睡鴞移浪動飛鷗村遠人煙斷風高畫角悠更知前路好蘆月滿江洲看雲一片來何處行藏頗自閒有心隨野鶴無意出青山練曳溪邊度影分洞口還偶然檀杖立疑在畫圖間登玉峰雪霽山何好徘徊一杖通錦帆流水外清磬隔城東華雨迷幽徑笙歌逐晚風我來頻眺望春色滿吳中登龍池山路細沉蒼藹逡巡半入峰煙林幽澗隔野寺白雲封谷暗疑飛雨池澄起臥龍歸樵遙指處金碧影重重秋日山行隔津頻問路穿石度危橋落葉秋風戰殘花細雨飄踏歌尋谷口策蹇下山腰行盡白雲處相逢半是樵割稻畚插勤秋望登場見穫功翻雲和碧倒刈浪帶煙空餘粒滋肥蟹閒田下晚鴻羨茲農事畢擊壤詠年豐冬日曉發歲暮征途遠江煙曉似烝殷勤望北固指點說毘陵楊柳含春思梅花笑老僧謾言為客苦此際興何勝遊平山堂即煬帝建宮處昔日繁華地今來倍慘傷草餘昏夜雨碑剩斷文章老兔棲荒塚寒鴉噪夕陽瓊臺何處是千古說雷塘其二肩輿盤曲磴為訊上林春粉黛悲流水笙歌逐遠塵江山仍似舊風月幾番新駐蹕當年事黃鸝苦訴人
