body:
  text: 住國山善權寺嗣法門人智操住京兆薦福寺嗣法門人智覺編次書復復汝允肅總戎前接芳函有一念未絶到處紏纏云云何其智哉嗟乎世出世間實不越此一念不識此一念未免被功名聲色之所蠱惑達此一念則功名聲色皆如夢幻不實既知不實則萬機普赴而不撓其神衆音交響而不亂其聽五色互眩而不混其觀所謂隨順世緣無罣礙涅槃生死等空花是也誠能如是何紏纏之有哉復趙完之御史屢見佳作言高意深若是本分一著子實未夢見在昔佛印與東坡書云子瞻胸中有萬卷書筆下無一點塵奈何腳跟下事黑漫漫地今觀足下何以異此亟將平日所習學的束作一團拋向吳淞江裏如棄敝屣更莫回顧單單看箇本命元辰落處儻一旦豁然則又吾法門一龐老也復方坦菴學士禪不在於坐化超脫若以坐化超脫為禪非禪也道不在於留形住世若以留形住世為道非道也昔九峰不肯首座黃龍痛叱純陽良有深意豈止坐化超脫留形住世而已哉愚見如是高明詳之與楊靜山太史聞居士有慷慨志真火宅中蓮花也不見昔崔趙公問欽國師曰弟子欲出家得否曰出家乃大丈夫事非將相之所能為公於是有省者裏著得隻眼看他是何道理儻或豁然覷破非惟親見國師亦與趙公把臂共行脫或未然更有偈作箇注腳修行豈必著緇衣唯要明心透祖機昔日龐公曾戴髮傳燈千載許同歸與青龍兩序山僧自甲申蒙衆檀逗留挂瓢逮今十有五年矣雖不能廣闢大剎光耀法門然而遠近檀護已知歸向三寶此第一勝事次則大殿雖未竣亦稍可觀其三寒座元為人真率梗直見識超卓可作二代主人代山僧説法也縱佛祖出世不過化人向善紹續慧命今也信心已熟叢林得人可謂能事畢矣昨山僧曾受佛日之請不可腳踏兩船遺笑諸方冀兩序送首座入方丈如渠不允須善調理方丈不可一日無主至囑至囑與青溪衆檀護山僧出雲門本欲抵青龍與諸公笑談一上不期虎林檀護邀住佛日直得應允今隆福盡付寒座元掌管祈送入方丈雖佛祖出世不過為法求人山僧既有首座青龍一派始不斷絶亦見護法之心始終不異矣與青龍寒松操長老初七接來書云收成略勝去歲國稅納已過半復閲新刻語録山僧不禁蹈舞居然一佛出世矣兼之青龍一片荒地曩承遠近檀護及前執事人一腔血汗所成幸爾大衆有依叢林有託山僧縱老死丘壑復何憾焉吾子既踞座披衣為一方知識必也匡時挽弊體從上佛祖之淳風以衆心為心以衆耳為耳以衆目為目夫以衆心為心者其量普而無物不容衆耳為耳者其聽聰而好惡之聲無不辨衆目為目者其明遠而秋毫之末可察是以大海不擇細流泰山不讓土壤世出世間其理一也凡接待衲子唯以本分鉗鎚使彼透脫生死機無大小施之以平等法門叢林之興可卜佛祖慧命可繼為知識者能事畢矣又自維揚返荊溪半年以來身如破車腳似飛蓬曾無片晷之暇奈何奈何昨見來書云歲有豐色衆有和聲國稅叢林亦有內託外護山僧不勝慶慰乃子福德所致亦叢林厚幸復何他慮焉至於進退之節分憂之勞此太早計生然青龍一坐具地已曾兩度鳴鼓上堂人天衆前分付與子并無年月期限之説亦非衙署傳舍之所何乃妄生許多葛藤山僧獨慮普同塔及重興隆福碑賴子協力為我圖成待山僧死後不用作供亦不必下語以此二事酬恩足矣外和偈曰聞説昔人曾有言養兒多為啓家門須知不奉原非輔古道無如慧命存又前六月與子書中甚是明白毫無隱匿何故徒勞跋涉枉廢人力子既擔當佛祖重任升座説法開示後來可謂人天師範矣夫為人天師範者人莫行而行之人莫忍而忍之人難能而能之唯慧命為念弘道是懷以至功流百世名垂不朽雪後始知松柏操此之謂歟今青龍雖不大備足蔽風雨遠近檀護皆知向佛亦可化度地僻景幽儘可行道欲舍此而他往我不知子是何意也不及盡言惟子勉之又青龍一剎悉屬檀護脂膏所為與山僧何預焉況山僧於人天衆前兩次委付與你無不知者故爾放浪煙霞息影嵒壑以待殘喘而已且維揚荊溪二處葛藤尚未剖斷何暇復顧慮於青龍哉今而後更以瑣末事煩亂山僧者作不孝論至囑至囑與青龍衆護法竊惟邇來佛法澆薄無甚今日每見拖笻曳裾苞苴投刺交結權勢靡所不至唯圖門庭熱鬧不顧取笑傍觀滔滔皆是若欲匡時援溺易風移俗求其一二者又烏可得興念及此未嘗不疾首蹙額者也近有人從青龍來謂新方丈杜門不出一味高尚弗憂門庭冷落法堂草深較之諸方新出世者可謂劣矣山野謂果如是則古風稍挽涇渭可分何患叢林不興祖道不振古云作家自有通人愛是也雖新方丈不諳時務抑且尚在老誠比前之拖笻曳裾者不可概而目之未審何日枉駕邗關懸榻以待與汝允肅總戎別後瞬息四月矣光陰逼人若是竊惟今時不為功名祿位所絆知進退者能有幾人唯足下抽身於金紫叢中撒手於麒麟閣外可謂名成身退古來明哲何以過是山野前見足下國事紛紜頗似忘情吾道邇來知有精進心故以本分事相告欲明此事慎勿外求只將一箇本來面目話頭孜孜矻矻頓在目前不可須臾放過正如疇昔統領百萬雄兵援抱對壘必以勝敵為主稍有一毫畏縮則為敗將矣誠能勇猛無懈於不知不覺處豁然㘞地一聲徹見自家本來面目始知不動干戈而恆沙國土一時歸降所云克己復禮天下歸仁是也勉旃與大休禪人掩關一事上古未聞後因居曲彔木者苦於應酬故設一關絶攀緣免迎送是以遠公不過虎溪汾陽不踰閫閾非孟八郎淘汰知見漁獵學問之所為也今人往往不達其意輒為效顰封鎖一室端坐其中見地無所決擇道力無因進益雌黃莫辨菽麥不分但有幾箇齋公道婆送供禮拜便生歡喜此乃虛消信施何益之有果欲琢磨知見勿得離師左右殷殷懇懇朝咨暮問得臻堂奧始成一家兒孫不然縱有所得終成杜撰決非法門種草也思之審之復吳淞沈鎮臺來論云在帆影馬蹄中做工夫當如何下手貧衲已酬之上堂語中向刀刃上走馬虛空裏行船若從者裏具得隻眼一任橫拈倒弄無處不是本地風光如或未然且向十二時中無論忙間動靜我者本命元辰畢竟落在甚處至於工夫成片忽然撞破本來消息自有一段真受用處也謹復辭太平菴監院去歲臘底不敢固卻衆命暫領春制今欲一擔交出竊惟螳臂大難承命統祈上座與衆檀護再議須延道全德備有力者主之非獨寶剎中興亦可作婁江萬世之津梁矣原諒是荷復越州衆護法衲近辭辨峰歸憩隆福志圖釣明月於龍江攬清風於鶴渚一味守拙過活何期鼎翰遙頒招主能仁開函捧讀詞意殷殷非乘夙願來者何能若是只得暫領一期聊應衆誠若據本分一著即貴境奇巒佳水修竹茂林早已漏泄了也豈待貧衲饒舌然後為説法哉雜著一花現瑞賦有序甲午夏偶閲傳燈凡於中有關乎統系者輒撮其機緣語句筆而綜之始於釋迦拈花卒至辨山瑞老人故題曰一花現瑞雖文采不足而吾家歷代淵源灼如親炙矣嘉稱眼藏極號妙心橫目前而莫睹處劫外而恆今無修無證任去來而弗變非愚非智隨運用而不禁自爾目眴青蓮頤開金色權小覿面而生疑人天對揚而罔測竺乾四七授受而法記西東震旦二三相承而道望南北於是曹水分流青原拔萃紫荊茂而參天米價騰而遍地書信不通鈯斧密記石頭路滑竿木而隨身莫支藥嶠風高特牛而生子迥異奩開寶鑑活弄金毛吼時則山嶽俱震照處則狐魅難逃故知五位權分語脈渾無滲漏一音大闡宮商不犯纖毫詢名探語問水盤桓明月湖畔拋筌而夜擒玉兔鳳棲嶺頭撒網而日打金鸞多子塔前機契同安之志白鹿松古浪驚益水之寒遂乃秦鏡重懸太陽洞照烏雞帶雪而高飛石馬回途而復妙青鷹託夢而先徵皮履手書而遠紹焰裏芙蓉湖心燦爛了無寵辱之驚復何榮枯之變鐵鳳叫而天欲明木雞啼而夜將半希辨雲興百問瓶瀉電光影裏而煆煉玄徒裂石聲中而鉗錘作者欲驗阿魏之真細勘黃金之假寶明續焰奕世流芳古鏡臺前萬象臨而互照寒梅雪裏千枝並而交輝超宗異目兮堪為種草齊眉共躅兮切忌承當雪嵒凜冽邃洞嶙峋拈初秋草賽臘月之菡萏奪乾矢橛餌透網之金鱗寒宵正昶日午移輪一株向榮萬卉增秀垂呂望之鉤兮釣盡江湖展成湯之網兮搜空宇宙綸音降而霧涌霞蒸聖駕臨而龍驤虎驟是以少室一枝乳峰千古聲聞紫垣名動海宇語不帶玄汀鷺而飛回荻花機須轉位漁歌而驚起沙渚其寂也恆靈其動也安泰當面拈出纖毫不涉覿體相呈妙協兼帶返本還源遇緣無礙風送泉聲而夜來枕邊月移花影而曉到窗外大巧若拙玄羹不膾作禹門之砥柱為嵩嶽之爐韛炎日與霜花亂飛清風共明月常在高懸藻鏡廓徹心源力田給衆披蓑自耘腸斷秋風而擊柝目窺夜月而消魂或嵩陽鍾秀金店茂族松庭針契而芥投少室香飄而果熟撒手威音流澤周蜀或睹秦槐而得旨或覽傳燈而明妙或載月舟而入廛或朗宗鏡而普耀復有為佛祖師作乾坤則龜毛拂而涼飆生兔角杖而明月出彩鳳翱翔鐵牛奔咋更乃大覺興慈清涼示現窮性相而知非究緣生而了幻驅木偶提化外之機遣石女弄無針之線雲門大啓石傘高撑駕航舌倒懸瓴而宗説兼到舒岸眉開河目而權實並行瘖復語瞽重明病得瘥聵者聽仁慈煦蔚德沛雲礽靈鷲之真風因茲再扇新豐之古調賴是重賡幸而桐溪産瑞辨嶽增輝列君臣而野干碎膽論偏正而罔象失威九坐道場兮輪蹄輻輳十處説法兮雷電紛飛變荊榛而俄成寶所化瓦礫而頃作珠璣所以二千餘年六十五世葉葉聯芳花花並蒂虛空爛而彌新天地朽而不墜偉哉不可言思確乎盡未來際募造佛像疏夫法身無為不墮諸數豈云三十二相然後為佛盍緣衆生迷於聲色汩於輪回外逐妄境內惑真性自無量劫來人人有尊天真古佛久被塵埋故我世尊為三界師作四生父興慈運悲拯焚援溺向無身中現身無法處説法正如春風甘雨萬卉得之無不發生故曰物無虛應應必有由茲某上座發心募造香像請歸嵩山欲使人禮其相而契無相之法身瞻其形而獲無形之妙用不假修證始知本來是佛如斯福德烏可為喻請諸大檀幸勿錯過募禮大悲懺原夫悲心溥運慈力廣周拯群迷而登彼岸緣起無緣攜弱喪而達方舟化超大化塵塵獨映若涼月影散千溪剎剎斯彰猶摩尼光騰五色實菩提最上之經乃圓通第一之門茲啓敝寺欲建普門道場頂禮大悲懺法謹告大檀遞結殊勳一香一華總是莊嚴自家之佛土一幡一盍無非顯露本地之風光聲聲則古佛現身念念則大悲出世期滿三七之限果克僧祇之功以及法界有情共遊薩婆若海普令河沙含識同入陀羅尼門化知浴安禪結制列聖規繩選佛開爐後賢模範徹證唯憑於自肯助道須賴於檀門茲啓大能仁寺晉時古剎近代名藍乃人天際會之場實龍象交參之地克復日淺故爾一室屢空啓構工繁盍緣四事莫辦於是某禪德發為衆心肩知浴職登門踵戶而遍叩知音冒雨衝風而懇祈長者惟冀掀翻無盡藏同結良緣運出自家珍共成勝舉了明大事只消一箇衲僧忽悟水因豈羡十六開士無垢之家風再振古靈之公案重新功德難思筆舌莫罄矣環翠菴募修造苕溪之南去治二十里雲林藻岸煙水浮空俯而臨之若萬頃玻璃昔人所稱冰壺鮫室寧是過乎中有菴名環翠椽不盈三十根地不過一丸許盍是允賢上座所建經營再歲未獲落成豫過其處乞一言為引豫曰圖難於其易圖大於其細會必有如顧虎頭之金粟引四方投錢爭施者矣豈待豫以因果福利為嘵嘵哉募建靜室小引古吳興舊稱為山水窟而棲賢南山塢尤為最佳古澗潺湲奇峰嵂崒琅玕百畝煙霞滿阿誠為高人卓錫地然久蔽榛萃識者頗稀茲世奇禪德來自鼓山草鞋半天下而欲棲心於此可謂名山待人信不誣矣昨過辨峰為述其勝因乞余言為縛茅計豫謂既有其地必有其人既有其人必有檀越於一莖草上現出玉殿琳宮況十笏茅齋何慮不指日而成就哉化知殿夫真淨界內不假纖塵莊嚴海中奚棄一法是以大聖因地布髮掩泥而為供養焚身煉臂而作光明盍功不浪施良有以也茲某禪德為衆發心職任知殿謹募香燭幡華種種供具雖曰衲子行門必賴檀那克就打開帑鑰從教箇箇毛孔齊現金色如來速破慳封直使人人頂門放出然燈古佛如此奇緣甚於搶寶利益無量請著芳名化知浴若耶溪畔久號禪林玉笥峰前代稱法窟頭角以之而蹴踏雲濤以之而奔流所以鑄聖鎔凡必然開爐設浴惟冀大家樂助何憂獨力難成拈起玄沙荔枝觸破衲僧鼻孔掇來洞山果子塞卻禪者咽喉寶壽薑滋味惡辣雲門餅式樣新鮮若也塵不染塵揩背則重逢古佛水不洗水脫衣則入水見長人特啓高明速道一語化禪帳枯木堂前家聲自異長連床上活計偏殊紙帳梅花霜風揉而易碎鶉衣荷衲煙雨妒而難禁窮禪和一囊徹底破落戶寸縷無存雖則麈尾頻揮怎奈豹腳尤甚聊藉管城子之饒舌全仗毗耶老之神通直使文彩縱橫而機絲不犯任從寒炎代謝而密室誰知夜半輕垂寂寂深潛渾不露天明捲起堂堂現出本來人此非小緣幸望慷慨化施茶紫雲堆裏味得春先兔毫盞中香浮北苑昏魔聞之而遠退熱惱觸之而清涼信手傾來曷用望梅止渴滿盤托出不須鑿井求源廣開甘露之門普濟塵勞之衆仰冀大檀成此勝舉化齋僧田聖賢家券若箇無名佛祖田園阿誰少分威音那畔何自何他今世門頭立疆立界欲得現成受用須憑本分生涯百丈始興展兩手而敷揚大義仰山再起插一鍬而遠播宗風苟非其人於此中依然蹉過若是箇漢到者裏自肯承當化修大殿隆福禪寺乃性空妙普禪師樂道之地也群流帶繞九峰奔拱龍蟠鶴翔風景超然創始於唐再興於宋距今千有餘齡風雨淋漓荒蓁霾翳紺宇梵像久已隳頽豫自戊子春退謝昭慶歸憩青龍意圖結茅作容膝計不期方來彌衆皆是為道納子竊慮安禪無所好事者請營殿宇恢廓雲廚豫曰昔楊岐不事豐屋務要人道眼明白腳跟穩當何暇修為吾不欲干人且止僉曰不然楊岐雖有乍住屋壁疏之句非無棲身挂囊之所奈青龍上無片瓦下無卓錐胡以敷具集衆今幸熙世之時正檀那植福之際如願鼎新一旦輪奐俾法輪再轉於末運佛日重耀於中天利益莫大豫曰汝既爾爾吾復何言因乞數語為引謹敘顛末告諸長者化知浴法輪轉處唯憑龍象以交參爐韛開時一任風雲而際會雖則三常不足要須回事堪周是故耆婆施方只欲人通身慶快無垢設浴令者漢徹體宣明悅老炭趙老茶孰知端的鄭州梨青州棗自有來由一香一花總是箇中妙用一塵一芥無非格外神通打開昔日之慳囊共為佛事運出自己家寶同結奇緣覿面相呈幸無錯過化重建隆福寺木料竊聞賢于插草建梵剎於當時須達布金樹法幢於頃爾雖曰興衰有數要且克復由人茲者青龍隆福古寺實為積代選佛之場亦為歷朝祝釐之地浮屠聳峙層閣崔巍簾控九峰青遠挹雲間秀色座聯三泖碧時聆月下漁歌海衆高流或因聲而入道騷人俠士抑撫景以抽思第緣目邁月征觸目殿臺圮坼遂乃星移物換滿堂風雨飄搖苔蘚侵而門封蛛網煙塵妒而像壘燕泥梵音竟日寂寥祖意論年狼藉檀越聞者無不寒心苾芻見之安能袖手於是特持短疏躡峻嶺而鳩材遍告諸公乘危波而化木長者梁矮者柱惟憑繩墨施工巨為棟細為椽一任斧斤運用異時功備共瞻華藏之殊他日果圓齊睹祗桓之勝福德利益諒必熟聞依正莊嚴奚敢重舉化造安間堂並藥石古立叢林為老病設尊耆年而憐疾苦也彼少壯者一鉢千家孤雲萬里奚足為慮惟茲摧殘朽質舉目無親尪羸病軀方外誰顧第今諸方所重無非英雋茂齡其老病人罕預其數每觀是輩不勝太息雖萌斯願未遂其志今某發念欲募僧舍藥餌俾老者安病者瘥各辦於道故曰安間堂也惟冀上體釋迦看病之囑遠追先王養老之仁如斯勝利曷可道哉化大殿古佛堂塵塵透露空王殿物物全彰雖云本自圓成奚礙隨緣建立有為必藉無為而顯道諦惟憑世諦而周肯來直下承當自是一肩擔荷豎瓊樓於莖草均瞻箇裏慈尊現寶剎於毫端共步人間兜率可謂自他俱利福慧兩嚴化麥深耕淺種久蒙雨露之滋朝耨夕鉏屢受風霜之苦茲乃時至登場始獲功成就廩雲門胡餅全憑箇裏得來觀音饅首惟向此中拈出隨緣隨分勿拘指撮非量奚少奚多那論驢馱車載欲冀無漏因果快植第一福田化修月塘寺偈有漏即無漏有相名實相萬行六度先檀波最第一憶昔插標者布金復有誰羡茲不昧人千古成希覯施者無所施受者亦復爾施受二俱空空亦不住空但能果如是究竟號堅固世界虛空盡無住功不朽化結制齋選佛場開雲水畢集楗槌欲鳴惟憑檀力大家堪笑老金牛飯桶堂前舞不及化禪帳剎古荒涼久禪房草色深席穿敷藹具幔破臥松陰吹面風難避囓膚蚋易侵長連床上事今特報知音化大殿古殿摧頽草木封鰲椽鴛瓦半飛空唯祈四衆同舒手扶起當年舊祖風化裝佛丹霞爐內曾燒卻靈瑞菴中欲復新若是仙陀言外委一莖草上現金身化米辨山深處古龍華鉗聖錘凡為活計雖然四事且隨緣鉢盂難免溼兩次廬陵端的復誰曉舉似檀那勿外討慳囊打破始方親粒粒盡成無價寶化茶入門一句有誰諳不似諸方亂指南到口始知滋味別趙州公案勿勞參化薑生成辣性類難儔端的由來出漢州喫著通身流白汗功成不讓死貓頭化蘿蔔趙州曾道鎮州有借問檀那會也否钁底翻身活鱍機拈來塞破虛空口化衣單昔年堪笑老疏山千里迢迢賣布單後代兒孫貧徹骨冬來無物可遮寒化碗陶家輪上功成大冶爐中行滿文殊覿面相呈善權豈可省簡知音不必沉吟咦且道是甚麼碗化知浴一番澡垢一番新脫體無依不染塵告與知音言外薦何須入水見長人化禮大悲懺法筵珠網影玲瓏勝會奇緣不易逢一禮一瞻鎔宿業一聲一號悟圓通雲幢靄靄騰香霧花雨紛紛散曉風以及見聞隨喜者河沙福利算難窮齋單引無底鉢無手人能擎無米飯無口人能喫易牙莫辨純陀罔知直得人人沾天廚之供箇箇飽法喜之味不須向外馳求唯憑此中拈出畢竟是何意旨金牛道底職事單引夫叢林之創盍為接物利生設也從上諸祖莫不隱勝現劣用攝同事或負舂挨磨而傳心或執爨樵薪而得旨戮力匡勷互揚法化如是則弄瓦搬磚步步登文殊之智地擔柴運水頭頭入普賢之行門福慧二嚴自他俱利作龜鑑於斯時垂準繩於後世庶叢林永永不朁矣退辨山囑託兩序略規國家之有法度叢林之有清規所以警無良一衆心也無法度何以治民無清規難以肅衆是二者不可一日而缺也山僧前允檀護請主華林迄今三年慚無寸補宜退茲位以選有德者尸之然主人雖有新舊之殊規繩豈以進退而弛凡大小執事不得乘山僧退院妄生釁端擅自行事儻有過犯著知衆鳴鼓公議量其輕重而與罰如姦頑梗法不服即行燒衣擯出庶使清規不亂大衆安心待新堂頭入院後即將常住帳目文契交割分明山場田地界至踏勘清楚以便後人照管或欲他往須預前三日告別然後起行各盡乃職以答佛恩若不遵行非佛弟子源朗道昌然貴寂秀從德備資敬刻百老和尚語録第十九卷
