body:
  text: 住國山善權寺嗣法門人智操住京兆薦福寺嗣法門人智覺編次源流頌第一祖菩提達磨大師至金陵武帝問曰如何是聖諦第一義祖曰廓然無聖曰對朕者誰祖曰不識帝不契遂渡江至少林一日命諸門人曰汝等各言所得最後慧可禮三拜依位而立曰汝得我髓廓然無聖箭鋒機不契徒勞入禁幃拂袖江頭乘葦去踏翻明月亂流輝風凜冽雪紛飛禪林從此始多非謾云皮髓都分盡剩有芒鞋遮面歸第二祖慧可大師參初祖立雪斷臂悲淚求法祖曰諸佛最初求道為法忘形汝今斷臂我前求亦可在易名慧可師曰諸佛法印可得聞乎曰諸佛法印非從人得師曰我心未寧乞師與安曰將心來與汝安師曰覓心了不可得曰與汝安心竟梅枝孕玉少林春立雪空階太苦辛佛法若從斷臂得西天東土沒全人第三祖鑑智僧璨大師以居士參二祖曰弟子身纏風恙請和尚懺罪曰將罪來與汝懺士良久曰覓罪了不可得曰與汝懺罪竟宜依佛法僧士曰今見和尚已知是僧何名佛法曰是心是佛是心是法法佛無二僧寶亦然士曰今日始知罪性不在內外中間如其心然佛法無二也即為剃髮丹砂九轉璿璣一撥食牛之氣自爾天生迦陵之音迥然蘊殼頓空罪性兮霜月沉空至道無難兮薰風解籜莫莫莫須斟酌謾將風恙纍兒孫病差何假驢馱藥第四祖大醫道信大師沙彌時年十四禮三祖曰願和尚慈悲乞與解脫法門曰誰縛汝師曰無人縛曰何更求解脫乎師言下大悟服勞九載屢試玄微臘盡寒初散春來雪自融霧深知變豹浪暖看飛龍月落江眉暗雨添花淚紅玉關人去後千古動悲風第五祖大滿弘忍大師兒時造四祖祖曰汝何姓師曰姓即有非常姓曰是何姓師曰是佛性曰汝無姓耶師曰性空故無祖識是法器河出圖洛出書丹山之鳳蚌腹之珠其翱翔也縱橫而莫遏其圓潤也宛轉而無拘黃梅老黃梅老栽得青松惹煩惱至今六月尚餘寒千古萬古月皎皎第六祖大鑑慧能大師參五祖問汝從何來師曰嶺南曰欲須何事師曰唯求作佛曰嶺南人無佛性若為得佛師曰人即有南北佛性豈然祖異之乃曰著槽廠去師遂服勞於杵臼間因祖索偈欲付衣法師和偈曰菩提本無樹明鏡亦非臺本來無一物何處惹塵埃祖呼入室密授心宗衣鉢令渡江相逢狹路難避腦後一鎚見腮落落玄關頓斷重重金鎖雙開霜寒鶴唳露冷猿哀傳衣夜半成何事南北紛紛起禍胎第七祖青原行思大師參六祖問當何所務不落階級曰汝曾作什麼來師曰聖諦亦不為曰落何階級師曰聖諦尚不為何階級之有祖深器之即令首衆跣足披蓑度別岑相逢切忌話威音掀翻麟閣勳勞泯擊碎菱花影象沉靄靄寒雲籠嶽頂團團皓月蕩波心金牛不喫凡間草曉入滄溟無處尋第八祖南嶽石頭希遷大師參青原原問曰子何方來師曰曹溪曰將得甚麼來師曰未到曹溪亦不失曰若恁麼用去曹溪作甚麼師曰若不到曹溪爭知不失師又曰曹溪大師還識和尚否曰女今識我否師曰識又爭能識得曰衆角雖多一麟足矣入門一句辨疏親識寶還他碧眼人衆角雖多何足貴彩雲端裏産麒麟第九祖藥山惟儼大師參石頭問直指人心見性成佛伏望指示曰恁麼也不得不恁麼也不得恁麼不恁麼總不得子作麼生會師罔措復至馬祖仍伸前問於揚眉瞬目處契悟便禮拜曰你見甚麼道理便禮拜師曰某甲在石頭處如蚊子上鐵牛曰汝既如是善自護持後返石頭頭曰言語動用沒交涉師曰非言語動用亦沒交涉曰我者裏針劄不入師曰我者裏石上栽花頭然之南海瞎波斯撞入羅剎鬼國把家珍盡傾鼻孔剛剛捨得午夜特牛生箇兒五彩黃金額看他踏斷滄溟撑出那珊瑚枝上月第十祖雲嵒曇晟大師參藥山山問甚處來師曰百丈曰百丈有何言句師舉百味具足話曰鹹則鹹味淡則淡味不鹹不淡是常味作麼生是百味具足師無對又問更説甚麼法師曰有時道三句外省去六句內會取曰三千里外且喜沒交涉又問更説甚麼法師曰有時上堂大衆立定以拄杖一時趁散復召曰大衆衆回首丈曰是什麼曰何不早恁麼道今日因子得見海兄師於言下頓省凍鎖幽人眠雪屋金鞭擊碎蒼龍窟爻象動而悔吝生鳥篆成而鬼神哭續鸞膠截鼇足環樞妙轉無拘束獅子教兒迷子方六即一兮一即六第十一祖洞山良價大師參雲嵒問無情説法有省乃曰也大奇也大奇無情説法不思議若將耳聽終難會眼裏聞聲始得知後因過水睹影大悟有偈曰切忌從他覓迢迢與我疏我今獨自往處處得逢渠渠今正是我我今不是渠應須恁麼會方得契如如睹影逢渠不是渠到家何必鴈傳書曉風吹破梅花夢香霧輕沾粉蝶鬚月上珠簾剛夜半天明玉漏催更箭當軒秦鏡絶狐蹤禁殿無人誰敢犯第十二祖雲居道膺大師參洞山山問甚處來師曰翠微曰翠微有何言句師曰微供羅漢某問供養羅漢還來否曰每日你噇箇甚麼曰實有此語否師曰有曰不虛參見作家來山又曰吾聞思大和尚生倭國作王是否師曰若是思大和尚佛亦不作山然之險處連推不倒直須出手相扶一枝別露春色風月猶殊帝都第十三祖鳳棲同安道丕大師僧問如何是和尚家風師曰金雞抱子歸霄漢玉兔懷胎入紫微曰忽遇客來將何祗待師曰金果早朝猿摘去玉花晚後鳳銜來徹底打開寶藏傾來滿地奇珍就中那復擇疏親博施逢人不吝家風凜凜無比尊貴堂堂絶倫凡流切莫妄評論此箇門牆萬仞第十四祖鳳棲同安志大師參先同安將示寂上堂曰多子塔前宗子秀五老峰前事若何如是三舉衆無對師曰夜明簾外排班立萬里歌謠道太平安曰須是者驢漢始得老不休心更可嗟教兒汲汲做人家恁麼舉太周遮遺來枯井填難滿日後方知怨恨爺第十五祖梁山緣觀大師上堂曰垂絲千尺意在深潭一句橫空白雲自異孤舟獨棹不犯清波海上橫行罕逢明鑑僧問師唱誰家曲宗風嗣阿誰師曰龍生龍子鳳生鳳兒蘆花碎翦補羊裘鶴影悠悠雲影悠悠七里灘邊獨放舟深也拋鉤淺也拋鉤盲龜釣盡始方休雨又將收風又將收水天虛碧看飛鷗月滿枝頭霜滿枝頭第十六祖太陽警玄大師參梁山問如何是無相道場山指觀音像曰者是吳處士畫底師擬進語山急索曰者是有相底如何是無相底師遂有省便禮拜曰何不道取一句師曰道即不辭恐上紙筆曰此語上碑去在師獻偈曰我昔初機學道迷萬水千山覓見知明今辨古終難會直説無心轉更疑蒙師點出秦時鏡照見父母未生時如今覺了何所得夜放烏雞帶雪飛山謂洞上之宗可倚一時聲價藉甚有相無相重加鹽醬鏡愈磨而痕生工多巧而璞喪擬尋思莫輕放到此還須喫痛棒且道利害在甚麼處咄不用擔枷過狀第十七祖投子義青大師僧問師唱誰家曲宗風嗣阿誰師曰威音前一箭射透兩重山曰如何是相傳底事師曰全因淮地月得照郢陽春曰恁麼則入水見長人也師曰祇知荊玉異那辨楚王心僧禮拜師隨以拂子擊香几一下重關覿面勢崔巍一踏鴻門兩扇開香象截流無阻隔鯤鵬展翼任徘徊任徘徊看變態等間直透威音外桐溪從此顯家聲一夜春風敷萬卉第十八祖芙蓉道楷大師謁投子問佛祖言教如家常茶飯離此之外別有為人處麼曰汝道寰中天子敕還假堯舜禹湯也無師欲進語子以拂摵師口曰汝發意來早有三十棒也師大悟再拜便行曰且來闍黎師不顧曰汝到不疑之地耶師掩耳而出家寶不須外尋衣珠豈向他索雖然掩耳便行面目被人換卻面目換來見也無一條楖栗兩相扶只解扶兮不解倒可憐父子入荒草第十九祖鹿門自覺大師參芙蓉問胡家曲子不墮五音韻出青霄請師吹唱曰木雞啼夜半鐵鳳叫天明師曰恁麼則一句曲含千古韻滿堂雲水盡知音曰無舌童兒能解和師曰作家宗師人天眼目曰禁取兩片皮師從此悟入遂承印記緑暗園林春欲暮長安煙景仍如故五陵公子問歸路遙指顧花開何事風偏妒泣血子規啼不住窮愁無限向誰訴回首家山月滿戶急轉步度水休教溼卻褲第二十祖青州希辨大師參鹿門得言外旨出住中都萬壽嘗設百問曰聲前薦得落在今時句後承當迷頭認影作麼生是空劫已前自己又曰有口讚不盡無言心自明是則裂破虛空不是則鬼家活計上入端的處道將一句來劍按當門針投水碗象骨輥毬紫湖看犬直饒費盡精神也是徐六擔板擔板流沒來由卻把真金喚作鋀令人翻憶青州老恩大難將雨露酬第二十一祖大明寶大師參青州問離四句絶百非請師直指西來意曰昨日有人問打出去也師曰今日又如何曰你恁麼不識痛癢師禮拜曰可惜許棒折也師直得汗下後上堂輪王寶藏如赤窮底人酒店腰帶如大富底事掉轉身來撞著沒面目漢要拳便拳要踢便踢誰知我洞上家風別有擒虎頭收虎尾底宗旨會麼玉犬徹夜行不知天已曉芙蓉影落澄江水冷笑刻舟子底事披霜曉夜行浪蕩天涯興盡狂心死死後重蘇卻為誰新月淡蛾眉醉臥花陰渾不管好飲無錢酒債何時滿第二十二祖王山體大師侍大明於生臺見雀拾食乃拍手雀飛去明撫師背師驚顧曰若是雀子我孤負你不是雀子你孤負我師罔措曰幸是可憐生互相孤負去師豁然後上堂還有衝流度刃者麼僧從東過西從西過東師曰未得一場榮先刖兩脛足曰也知和尚慣用此機師曰罪不重科僧擬議師便打我負你你負我麻纏不住紙重裹狻猊爭肯被羅籠迸斷黃金無縫鎖白日昏兮霧漫漫浮雲散兮山朵朵一聲哮吼隕空花柳魅山魈沒處躲第二十三祖雪岩滿大師初參普照照曰兄弟年俊正宜叩參我當年念念以佛法為事師避席進曰和尚而今如何也曰如生冤家相似師曰若不得此語幾乎枉行千里照下禪床握師手曰作家那後造王山山舉洞山睹影因緣師疑之閲頌至折合終歸炭裏坐大悟曰今日方知病即藥也呈山山曰料掉沒交涉師曰和尚此回瞞我不得胸積經綸舌藏利劍不露鋒鋩埋兵索戰好作家猶未善平地可憐親被陷翻得身來是幾時花開二月春將半也大奇也大奇男兒志在青雲上投筆封侯更有誰第二十四祖萬松行秀大師參勝默有省復看玄沙未徹語請益雪岩岩曰待你頭生角腳手生爪牙然後討棒喫師偶見雞飛鳴大悟曰今日不惟捉敗沙老虎亦乃捉敗岑大蟲也曰不怕我笑你那忽聞架上一聲雞蝶夢驚回月墜西謾道山河歸至德首陽千古話夷齊第二十五祖雪庭福裕大師參萬松松問何處得箇消息來師曰老老大大向學人納敗闕曰老僧過在何處師曰學人且禮拜暫為和尚蓋覆卻松大喜遂印可後問僧面壁石有人看見達磨影者麼曰今日幸遇和尚師曰拄杖子今日幸遇上座乞供養他一頓遂打三棒曰恩大難酬師擲下杖曰脹殺懷州牛恁麼來看變動謾張兔網去羅鳳偏圓回互兩無傷捩轉機關全妙用杜禪流休賣弄縱時擒擒時縱棒頭有眼須珍重懷州脹殺一條牛嚇得蝦蟆跳入甕第二十六祖靈隱文泰大師參雪庭庭曰當機一句試拈出看師擬開口曰家産被人籍沒了也還在者裏叫屈師撫掌曰誰奈我何曰者風顛漢後上堂塵劫來事只在於今河沙妙德總在心源試教伊覿面相呈便不解當風拈出且道過在何處卓拄杖曰只為分明極翻令所得遲腦後張弓就地彈雀放去收回死蛇弄活活來毒氣便傷人説甚南山鱉鼻惡老蒼天老蒼天白頭婆子搽脂粉卻向人前賣少年第二十七祖還源福遇大師參靈隱聞舉切忌從他覓迢迢與我疏語即領悟曰今日捉敗老賊也隱喝出後僧問如何是祖師西來意師曰風送泉聲來枕畔月移花影到窗前得意謾將説向人畫龍點眼未為真揭開翡翠簾初曉拂卻鸞臺鏡上塵風送泉聲休逐響月移花影別家春重重指出何勞問少室庭前雙桂新第二十八祖香嚴文才大師讀證道歌至幻化空身契悟乃謁源求證源曰祇如道君不見是指阿誰師曰覿面親呈更無回互曰墮坑落塹漢作恁麼語師曰和尚作麼生曰汝口聻師曰勘破了也源休去老鼠偷油打破燈鄰家日午罵三更可憐笑殺人無數月裏嫦娥夢不成勘破了且低聲鷺鷥腳上螞蝗釘第二十九祖萬安子嵒大師初參息菴有省復參香嚴呈解嚴曰子不聞蠱毒之家水莫嘗否師曰也須吞得去吐得出始是肚皮曰蒼天中更添冤苦師曰謝和尚印可曰未在復閲寶鏡三昧大豁疑礙後上堂我不學諸方説禪浩浩地魔魅人家男女僧問達磨面壁時如何師曰正是浩浩禍胎曰如何得勦絶去師曰倒槎芒繩縛鬼子須是其人獨眼獰龍夜生角虎反掌為雲覆掌為雨焚劫之火不礙吸噓蠱毒之水何妨吞吐鶴翥翼而難留箭離絃而莫阻橐籥乾坤紛紜宇宙撲碎虛空萬象沉離婁有目還如瞽第三十祖凝然了改大師參萬安安曰路逢死蛇莫打殺無底籃子盛將歸此是洞上宗旨若是莽鹵禪和如何透得師曰莫是背觸不得底麼曰笑破山僧口師罔措曰你在鬼窟裏討甚麼碗師愈不安一日嚴上堂曰一言迥脫獨拔當時師當下釋然一言迥脫掀翻鬼窟獨拔當時放出俊鶻阿喇喇阿喇喇五乳峰頭路更滑寄語遊人仔細行謾將竿木強支撑第三十一祖俱空契斌大師參凝然然曰達磨未來你作麼生參師疑之偶睹秦封槐有省回侍次身甚戰栗然曰契斌參得禪也何驚疑之有師豁然省曰某今日到此如在紅爐中拾得一片冰相似然頷之咄哉沒智老翁白日青天見鬼達磨未必東來神光何曾得髓爛泥有刺須防卞璧無暇休指紅爐焰裏拾冰敲落舜若多齒第三十二祖定國可從大師參俱空空曰曾參何人來師曰少室山前風悄然曰因甚一華開五葉師曰沒孔鐵鎚百雜碎曰掠虛作麼師曰天下人只解掠實無一人掠虛曰不打自招師曰慣用底不妨勘破家富小兒嬌亂把珠璣滿地拋闌干斜倚憑誰語兩岸芙蕖露滴晚香飄任公釣錦鰲釣得錦鰲透碧霄翻憶西湖月下弄笙簫柳鎖長隄十二橋第三十三祖月舟文載大師掩關閲萬松機緣有省嘆曰洞上宗風大播天下有織錦回文之功非針線細密盤旋回互不觸當頭者不能與伊作主也既而幡然出關參無方從公發明己見撫而印之春雨山花燦錦秋風落葉飛金夜靜幽人得意猿啼旅客傷心等間若不登高望爭見東流海漾深第三十四祖宗鏡宗書大師聞月舟法席之盛入室請益密踐八載蒙付囑後少室請師師慨曰先師化後三十餘年洞上宗風逮乎湮沒遂主之臨終索筆書偈曰宗鏡宗鏡心法成行即日圓覺鏡破宗正招手悟猶鈍那堪八載周無脣不是兔有角亦非牛春信梅花曉琴聲月下悠華亭誰更委翻卻釣魚舟第三十五祖西京幻休常潤大師參宗鏡問鏡中現像時如何曰何不打破師曰其奈鏡像何曰鏡像安在師有省一日舉我今不是渠詰之曰既不是渠畢竟是何人師曰若要識此人有箇真消息無相滿虛空有形沒蹤迹曾為佛祖師常作乾坤則龜毛拂子清風生兔角杖頭明月出鏡復徵之師曰彩鳳翻飛身自在鐵牛奔吼意常間曰善哉水潺潺山疊疊蹭蹬天涯老劍客江北江南遍問津芒鞋踏綻路頭絶風吹柳絮走毛毬雨打梨花飛蛺蝶乳酪醍醐味不殊瓶盤叉釧金非別休休休直一橛轉盼家山雲外月他家父子好機關説甚臨濟白拈賊第三十六祖大覺方念大師參幻休休問甚處來師曰北方曰北方道法與此方何如師曰水分千派流出一源一日遊初祖面壁處契悟乃曰五乳峰前好箇消息大小石頭塊塊著地詣室呈休休囑曰無上涅槃心佛祖相傳付吾今授受時雲淨峰頭露乳峰嶮巇人難到到者應須膽也銷紫電光中鳴布鼓桃花浪裏看騰蛟頭角昂而機用別風雲際而意氣豪遞相承授兮水向源濁體佛祖心兮霜妒花嬌衆生末法真堪嘆草木皆兵何處逃第三十七祖雲門圓澄大師掩關看乾峰舉一不得舉二話發明詣雲棲棲舉海底泥牛師推出傍僧曰大衆證明後參大覺覺曰止風塗向青山近越王城畔滄海遙時如何師曰月穿滄海破波斯不展眉復呈偈覺曰語句綿密不落始終真當家種草向後開兩片皮截斷天下人舌頭有分在一鎚奮力碎重關直透雷門萬仞山江練靜暮雲間奪得靈符肘後還轉步乾坤外橫身宇宙間忘依倚絶躋攀洞簾倒捲水潺湲誕生王子天然貴金闕春風扣玉環第三十八祖百丈明雪大師參雲門門舉斬貓話師於言下知有將蒲團拋出門曰一語下徐州會從橋上過曰溪水潺潺汝等道看師曰敲空有響擊木無聲門頷之閲六日聞鐘聲大悟九坐道場臨終説偈來也無一物去也無一物欲知端的意百丈花梢月五色書徵九苞應瑞迥脫樊籠不墮圈繢蒲團拋出駿蹄空群擊木相酬靈禽折翨忽聞鐘聲世界殞而生佛平沉廓落身心朕兆泯而虛空粉碎楊老師真奇異令人千古仰高蹤百丈花梢風月霽經旨頌楞嚴經七處徵心徵心七處遍推求堪笑騎牛更覓牛回首西山殘照近一聲鴈叫又清秋若見是物則汝亦可見吾之見乃至自然非物云何非汝浮雲散盡碧天開一片冰輪耀御階花下相逢須急轉莫教衣袖惹塵埃見見之時見非是見見猶離見見不能及休誇投筆戎軒貴謾謂采薇義士高怎似幽人忘寵辱䰐鬖隨處混漁樵二十五圓通奇哉諸聖説圓通不覺和身墮草中陰處三科撈井月火風七大捕魚蹤秋深菊蕊噴香遠春暮桃花鬥色濃剖破藩籬元一統誰分南北與西東五十五位菩提路重重單復立階差畫足從來不是蛇行滿三祇湯裏雪功成剎海眼中沙通衢處處乘車馬古岸灣灣渡艇槎掉臂經行皆祖意胡為特地費周遮涅槃經生生拂地春風至山花遍野開遊人興不盡又上一崔巍不生生龜毛牽玉象兔角趁麒麟嚇得虛空走須彌也起瞋生不生喫飯不開口穿衣沒寸絲閻浮都踏遍兩足未曾移不生不生踢翻香水海拈卻蕊光幢萬籟悉沉寂聖凡兩俱忘佛牙頌偉哉婆伽梵果極名調御曩劫積殊勳萬德體圓具法身本無為而不墮諸數無形示有形無住顯常住處潔以非淨居染而不污大小阿毗曇一切文身句頻伽微妙音悉從齒端注不可以耳聞不可以目睹耳目不可近近之大火聚愚昧自疑惑闡提見嫉妒我祖獲斯瑞千載罕一遇永為福德城廣闢人天路我今作斯頌大海一滴助並冀垂不朽盡未來如故浮山十六題堂前不挂夜明簾花下間間懶去眠散髮齊眉誰作伴泥牛鞭起曉耕煙識自宗句中有響辨來機迥脫玄關絶是非上苑春回鶯語巧落花流水自依依死中活春園遊罷且休誇煙景依稀未是家玉笛一聲何處去紛紛天際落梅花活中死夜靜銀河泛鐵船蘭橈撥破玉壺天驚回石女鴛鴦夢倒跨金鸞入廣寒不落生死兔老冰盤夜倍明幾家砧杵動秋聲殷勤寄語嬋娟子莫負乘槎萬里情背捨歷代簪纓與麼來何妨落魄混塵埃薰風到處幽階靜帶笑葵花向日開不背捨當陽突出迅如風鐵壁銅牆一貫通夜半髑髏頻發笑驟驚木馬出紗籠活人劍高軒毒鼓謾勞撾觸著應須盡喪家聖解凡情齊掃蕩老胡依舊度流沙殺人刀不將奇特向人施遮莫行藏只自知夜靜一簾明月上微風吹動影離離平常莫道垂慈語帶柔異中來也為誰酬不從脅下安名字笑殺溈山水牯牛利道拔生金鎚覿面向君拋道火何曾口被燒不會逢人休錯舉春來依舊鳥聲嬌言無過失歷然藻鑑用無偏透脫離微始得玄秋水長天誰辨別鷺鷥飛出荻蘆邊透脫翀霄鸞鳳縈金鎖挂角羺羊猶滯蹤子夜木人剛轉側碧潭雲外看飛龍透脫不透脫輥毬舞笏幾多般妙闡當年教外傳熊耳真機千古秀松聲皓月永娟娟稱揚一句明明蓋古今超聲越色卒難尋雲封絶頂誰能到回首斜陽煙水深降句卷舒殺活不同倫大用何曾涉點塵蝸角尖頭藏宇宙螺螄眼裏定乾坤方入圓瑞老和尚住百丈一日垂問佛殿簷前為何墮落一花師云詩向梅中得琴從月下彈頌詩向梅中得琴從月下彈明明頻舉似切忌妄生端古澗潺潺兮歌詠新韻和風蕩蕩兮花開笑顏問野狐既脫皮毛因甚虛名千古不昧師云敲空有響擊木無聲頌敲空有響擊木無聲雨過山翠雲收日晴石筍抽條兮長春豔豔冰河發焰兮互古騰騰問冬間日色為何寒冷師云大雄峰高頌大雄峰高覿面全拋擬議開眼已犯吹毛不犯吹毛意句迥超木童腔外歌舞石女雲中品簫大悲菴行慧備資敬刻百老和尚語録第十七卷
