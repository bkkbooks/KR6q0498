body:
  text: 嗣法門人智朴編桐城方拱乾蘇菴閲五言絶句壽聖寺雲壑招提古迥然氣象寬燈明千嶂外鐘徹九天寒大雄峰一峰高且奇突出群巒上機峻鶴難棲古今絶比況靈景亭景勝空塵遠亭高野況多落花遙襯步龍象日頻過七星橋北斗接雲根橫溪慣鎖月惟憐迷渡人古岸通津闕石筍不假雷聲震詎蒙雨露新卓然峰頂外占斷劫前春鉢盂峰崒嵂團團秀宛如應量看清風時作饌堪笑幾人餐蓮花峰白雲擎雨蓋青岫仰蓮心不藉薰風力芬芳逾古今鳳凰窩修竹搖輕尾山花壯九苞天然殊異類那許雉同巢蟠龍石久謂蟠龍隱幾回空羡聞想是為霖去惟餘石上雲丫髻峰雙髻巫雲綰髼鬆意懶梳任從風雨妒亙古黛如初木人墓一片間田地耕來不記秋欲知翁隱處花雨滿荒丘秋日偶占日寒草影枯溪淺石頭露獨立何寥寥猿啼雲外樹雨中偶成犢角曉擎泥雨絲密織柳東風來問禪笑破梅花口其二霧壓茅堂矮風推竹徑斜野浦新添浪漁翁捕落花其三石夢傍雲飛松濤和月卷老因詩漸狂花為風偷剪春寒山貧賒霧著藤老倩風扶勿怪梅花晚多因春信孤冬夜夜寒燈欲語硯冷筆收花隱几虛生白推窗月半斜春日漫興間吟竹徑邊一杖春風裏倦即枕清流從來不洗耳老人池碧沼何人開謂言白髮叟欲知白髮人蓮生十丈藕碁磐石雲根猶斧平棋布星交磋輸贏總一般古今誰看破一岸居帶翠眉橫雙流寒碧繞中有酣眠人不知天地老虞姬廟夜聞楚歌聲一劍寒千古遺祠耶水濱猿啼霜月苦雞石無情化有情日淡朱冠瘦不解五更啼卻向風前三茅菴花落曉風香松高鶴夢冷遊人仔細看不是人間景曉起山深鳥喚人曙色盈花朵起搆佛前燈鄰家來乞火六言絶句秋吟一帶清流曳練滿庭秋色成堆爐頭火茶熟門外犬迎客來七言絶句冬日偶成榾柮頻燒焰正紅畏寒忘打五更鐘曉來雪霽登樓望突出雲間數朵峰其二剪剪朔風透破襦匡床獨坐暗嗟吁去冬爐內撥星火誰識今冬爐也無槎溪道中為踏新青一杖藜春風送我泛槎溪昔年仙子迹何在緑樹參差鳥亂啼巢燕幾度銜泥去復還巢成蘭若彩楣間似知野衲慵開口獨自喃喃語不間其二不向華堂舊處飛營來新壘傍禪屏時宣實相知音少欲逐秋風帶子歸舟中漫興春江雨霽水初平蘭棹依稀鏡裏行謾謂途中知己少桃花兩岸笑相迎偶成煙雨空濛柳線低隔林遙聽子規啼春光無限誰能委兩岸殘紅踏作泥夏日鹿城夜泊輕舠日暮泊江煙斜枕孤城對月眠蘋末風生驚客夢雞聲茆屋五更天秋日偶吟短策驚飛葉底香疏風野壑散清涼雲消乍怪山撑眼帶醉芙蓉笑夕陽候潮口占水涸江邊沙觜露潮回渡口浪花浮雙雙白鷺晴飛雪片片黃雲麥正秋再過永生菴雨中偶作屐齒蒼苔舊日痕隔林煙雨半黃昏重來五月薰風裏梅子生香竹有孫登洞庭峰頂撥雲天外笑長風落日秋高浪捲空七十二峰浮足下乾坤宛在渺茫中舟中值雪紛紛春色鬥風狂落似梅花淡不香清興滿船吟未了半隨流水下瀟湘春日即景磬聲遠度雲間寺月色橫鋪溪上橋滿樹梅花和雪眼翩翩蝴蝶冷魂飄妒花風二月春風半是狂嬌紅妒落滿池塘杜鵑啼出聲聲血燕子銜來口口香柳堤新水漲夜雨平林過院西忽聽茆舍亂鳴雞無端滾水桃花浪打破人家楊柳堤秋日雜詠客去偷間聊鼓腹過橋頻喚杖為僕丹楓黃葉亂堆詩明月滄江寒浸目夜泊斷橋野寺晚炊煙暫繫孤舟枕月眠夢裏溪聲疑作雨霜鐘敲斷五更天浪港水際無風柳不寒荻花影動皺波瀾細看疑是米家畫月冷漁翁垂釣竿白鶴山松老煙霞石亦斑巢餘鶴夢伴雲間不知羽化歸何處瘦影凝人月下還石帆山岧嶢望裏鬱蒙叢一片飛帆挂碧空自古不隨風力轉日斜影落鑑湖中耶溪夜棹樵風夜冷起鷗眠籟寂仙橋水漾煙幸遇多情溪上月同舟直話到門前問溪山寺一重山又一重溪山色溪聲望轉迷行盡溪山還問路溪山深處是招提秋夜水面風微夜漏遲草堂人正坐禪時疏鐘數點聲飄寺瘦月一鉤影浸池其二黃昏風雨鬧床頭搖落梧桐片片秋何處胡笳哀更切長江千里浪生愁鹵菴鼎首座一日別余之吳興行未數里值雨因爾懷之偶占一絶西風吹雨過苕溪之子途中半帶泥今夜芒鞋何處宿黃花歷亂草凄凄青溪道上野橋茆店向溪開黃葉西風撩亂堆三泖鐘聲隨棹去九峰月色逐人來山居五十詠十得荊溪老國山茆堂剩有兩三間高懸楖栗堪藏拙更羡春風為掩關百畝雲林間放曠一溪風月淡優遊謾云佛法無人會花鳥殷勤共唱酬亂雲堆裏搆禪栖狹路無因著馬蹄富貴易消花上露乾坤不盡甕中虀松花十里晚風香信步攜笻看夕陽徑僻苔深無客到峰頭唯覺嘯聲長青林雨過亂啼鳩倚杖懸崖看瀑流得失總歸蕉鹿夢是誰更與赤松遊山城好景亂如麻洞口人歸蜂放衙夜雨細牽書帶草曉風吹綻繡毬花半園春筍半園蔬帶雨披蓑漫漫鉏今日不為明日計得間且看古人書流水光中人面緑杏花叢裏犬聲紅山家一種天真趣不羡丹青筆墨工選佛選官成底事是凡是聖總虛名夜來枕上留新夢春到窗前聽曉鶯世上誰無塵事纍山中獨有道人間瞥然覷破閻浮夢鏡裏空花不用攀竹筧引來巖下水藤筐摘得嶺頭春飯餘石上披襟坐鷗鳥相將話主賓春歸煙樹濃如墨夏入巖房冷似冰沙上白鷗千點雪室中明月一溪燈荔枝一架繞薔薇晝掩禪關扣者稀閲罷琅函焚柏子雲間老鶴覓巢歸一林煙火隔橋東雨過蒼苔砌落紅巖下有僧敲月戶人間無客賣松風荷衣碎補幾經秋布幔繩床月一鉤夜雨驚翻蝴蝶夢卻令人笑老莊周一聲兩聲花外鳥三片四片嶺頭雲最是幽人親切句石池新水漾斜曛一泓嫩碧浸垂楊薝蔔花開滿院香世焰燎人真可畏幾能回首覓清涼雨挂層巒接斷虹佇看人在錦屏中沈沈月醉酴醾影細細香飄菡萏風當門好竹百千箇近水垂楊三四株路遠紅塵飛不到碧天長嘯玉輪孤糲食休嫌滋味淡苔茵獨臥夢魂涼懶殘不解煨香芋惹得丹書下草堂祖庭秋晚事如麻細钁荒田好種瓜胸次了無名利念何妨錮疾老煙霞寺門明月橋邊過洞口間雲雨後還活計些須隨分足從來無夢到人間性僻不宜廛市住機忘卻與野鶴同秋深簾挂千山雨夜靜松號萬壑風數點青山畫裏橫松絃落落寫幽情勿教黃葉隨流去恐有人來問姓名青燈素壁道人家水接山根竹徑斜睡起劃然長發笑夕陽影裏數歸鴉束腰不用三條篾遮眼全憑一卷經煙抹溪頭殘臘紫雨餘雲外亂峰青展開紙被雲千片放下蒲團月一輪獨坐渾忘塵世外老天許我做間人空庭滴瀝寒蕉雨白晝氤氳古鼎煙幽鳥不來常寂寂數聲短笛夕陽天依依影動風生竹淡淡光搖月上簾松菊而今誰作主翻然令我憶陶潛半壑半丘聊自適一囊一笠可資身孤燈夜雨添新韻黃葉秋風來故人雨歇竹梢風嫋嫋緑開水面月溶溶分明好箇西來意漏泄林間幾點鐘盡把喧囂細掃除年來自喜樂貧居不須筆硯添文彩鴈影空翻貝葉書一室寥寥對亂峰間吟臺畔步從容孤雲有意常留石野鶴無家只戀松風回谷口驚雲臥鹿過溪頭見水渾爐內香消人在定疏鐘斜月半黃昏桂老煙寒香細細山空鴈過影雙雙偶然濯足滄浪裏天外人歌白雪腔葛藤截斷入深林蹤迹安容野鹿尋芳草落花遊子興白雲流水老禪心布袍半染煙霞色草履遙沾石徑霜端的不勞頻借問幾株疏柳淡斜陽寺古松高孤鶴唳月明山悄一僧行雲深鳥道無尋處踏斷一溪流水聲石齒粼粼寒漱玉竹簾寂寂影篩金客來休問拈花事萬古冰壺一片心荷淡煙消枕簟涼雨餘簾外海棠香間情漠漠同江練一帶秋聲入夢長一念未鎔終是礙萬機休罷始相應打開日月籠中鳥笑指乾坤水上萍十笏茆齋百結衣胡麻脫粟好充飢芒鞋幸爾多強健日日登山看落暉壟頭雪霽梅方瘦水畔煙濃柳正肥此景目前誰共賞莫教孤負祖師機夜靜溪光侵戶白雲開山色上眉青明明盡把家私露分付禪流謾扣扃傍石依松好縛茆萬緣一筆盡勾銷夜寒鐘打雙溪寺天曉人過獨木橋壟上耕雲開白石雨中移竹補青山誰能到此忘喧寂萬境無心勝閉關雞鶴而今孰辨群從他人世自紛紜開窗獨對幽岑坐日暮鐘聲嶺外聞樹裏人家樹外山斷橋野寺隔溪灣深深更有深深處獨許間雲自往還尋得把茅聊蓋頂何妨斗室且容身孤巒夜寂那伽定枯木花開別苑春碎剪殘霞補舊蓑金鱗釣罷意無他善權洞古堪投老弄月嘲風臥薜蘿居士蔚小莊法名智欽同妻法名智恭捐刻
